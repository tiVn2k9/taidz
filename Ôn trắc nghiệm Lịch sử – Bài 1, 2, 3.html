ới.","Đẩy mạnh giao lưu văn hóa giữa các dân tộc.","Thúc đẩy hợp tác quốc tế về kinh tế, xã hội.","Thúc đẩy quan hệ hữu nghị giữa các dân tộc."],"ans":0,"id":"b1-30"},{"lesson":1,"part":1,"num":31,"stem":"Liên hợp quốc chú trọng phát triển mối quan hệ hữu nghị giữa các dân tộc không dựa trên cơ sở nào sau đây?","opts":["Quyền bình đẳng.","Củng cố hoà bình thế giới.","Quyền dân tộc tự quyết.","Quyền phủ quyết."],"ans":3,"id":"b1-31"},{"lesson":1,"part":1,"num":32,"stem":"Tổ chức Liên Hợp Quốc được thành lập nhằm thực hiện mục đích nào sau đây?","opts":["Giám sát lực lượng các nước Đồng minh tiêu diệt phát xít Đức.","Bảo đảm việc duy trì hiện trạng trật tự thế giới hai cực Ianta.","Mở rộng, thúc đẩy quan hệ hợp tác giữa các nước thành viên.","Hỗ trợ các nước sớm khắc phục hậu quả chiến tranh thế giới."],"ans":2,"id":"b1-32"},{"lesson":1,"part":1,"num":33,"stem":"Đối với Liên hợp quốc, duy trì hòa bình và an ninh thế giới không phải là mục tiêu","opts":["chiến lược.","thứ yếu.","hàng đầu.","chủ yếu."],"ans":1,"id":"b1-33"},{"lesson":1,"part":1,"num":34,"stem":"Mục tiêu và nguyên tắc hoạt động của Liên hợp quốc được quy định trong văn kiện nào sau đây?","opts":["Công ước Liên hợp quốc về Luật biển.","Tuyên ngôn Quốc tế Nhân quyền.","Công ước cấm vũ khí hóa học.","Hiến chương Liên hợp quốc."],"ans":3,"id":"b1-34"},{"lesson":1,"part":1,"num":35,"stem":"Tổ chức nào sau đây được thành lập (1945) với mục tiêu duy trì hòa bình và an ninh quốc tế?","opts":["Hiệp ước Bắc Đại Tây Dương.","Hiệp ước Vác-sa-va.","Liên hợp quốc.","Hiệp hội Đông Nam Á."],"ans":2,"id":"b1-35"},{"lesson":1,"part":1,"num":36,"stem":"Nhận xét nào sau đây là không đúng về các mục tiêu hoạt động của Liên hợp quốc?","opts":["Các mục tiêu tuy có sự thống nhất nhưng lại đối lập nhau.","Các mục tiêu có sự thống nhất, chặt chẽ và hỗ trợ nhau.","Các mục tiêu phản ánh bao quát, sự quan tâm toàn diện.","Duy trì hòa bình, an ninh quốc tế là mục tiêu hàng đầu."],"ans":0,"id":"b1-36"},{"lesson":1,"part":1,"num":37,"stem":"Một trong những mục tiêu của Liên hợp quốc được quy định trong Hiến chương Liên hợp quốc (1945) là","opts":["tiêu diệt tận gốc chủ nghĩa thực dân.","bình đẳng chủ quyền giữa các nước lớn.","duy trì hòa bình và an ninh quốc tế.","ngăn chặn phong trào cách mạng vô sản."],"ans":2,"id":"b1-37"},{"lesson":1,"part":1,"num":38,"stem":"Nội dung nào dưới đây là một trong những mục đích thành lập Liên hợp quốc?","opts":["Mở rộng các cuộc chiến tranh cục bộ.","Giải thể các tổ chức phi chính phủ.","Phát triển mối quan hệ giữa các dân tộc.","Kết thúc mọi tranh chấp trên thế giới."],"ans":2,"id":"b1-38"},{"lesson":1,"part":1,"num":39,"stem":"Duy trì hòa bình, an ninh thế giới là mục tiêu hoạt động chủ yếu của tổ chức nào sau đây?","opts":["Liên minh châu Phi.","Liên hợp quốc.","Liên minh châu Âu.","ASEAN."],"ans":1,"id":"b1-39"},{"lesson":1,"part":1,"num":40,"stem":"Hiện nay, Việt Nam vận dụng nguyên tắc của Liên hợp quốc để bảo đảm hòa bình ở Biển Đông thông qua chủ trương nào sau đây?","opts":["Tuân thủ luật pháp quốc tế để thực hiện quyền tài phán quốc gia.","Tiếp tục đẩy mạnh cuộc đấu tranh pháp lý tại Tòa án quốc tế.","Chỉ đe dọa sử dụng vũ lực khi bị nước ngoài xâm phạm chủ quyền.","Tham gia vào các liên minh chính trị quân sự mang tính phòng thủ."],"ans":0,"id":"b1-40"},{"lesson":1,"part":1,"num":41,"stem":"Liên Hợp Quốc đưa ra nguyên tắc “bình đẳng chủ quyền giữa các quốc gia và quyền tự quyết của các dân tộc” không dựa trên cơ sở nào sau đây?","opts":["Đây là những quyền tự nhiên của các quốc gia, dân tộc.","Chủ quyền quốc gia là nền tảng của quan hệ quốc tế hiện đại.","Đáp ứng được nguyện vọng của toàn thể nhân loại tiến bộ.","Trực tiếp chống lại âm mưu nô dịch của chủ nghĩa đế quốc."],"ans":3,"id":"b1-41"},{"lesson":1,"part":1,"num":42,"stem":"Nội dung nào say đây không phản ánh đúng nguyên tắc hoạt động của tổ chức Liên hợp quốc?","opts":["Tôn trọng toàn vẹn lãnh thổ và độc lập chính trị quốc gia.","Sự chung sống hoà bình và nhất trí của tất cả các thành viên.","Tôn trọng các nghĩa vụ quốc tế và luật pháp quốc tế.","Từ bỏ việc đe doạ hoặc sử dụng vũ lực trong quan hệ quốc tế."],"ans":1,"id":"b1-42"},{"lesson":1,"part":1,"num":43,"stem":"Một trong những nguyên tắc hoạt động của tổ chức Liên Hợp Quốc là","opts":["từ bỏ đe dọa bằng vũ lực hoặc sử dụng vũ lực trong quan hệ quốc tế.","chỉ can thiệp vào công việc nội bộ các nước nhỏ và kém phát triển.","thúc đẩy hợp tác quốc tế để giải quyết các vấn đề kinh tế và xã hội.","các nước lớn có quyền chi phối tình hình thế giới và quan hệ quốc tế."],"ans":0,"id":"b1-43"},{"lesson":1,"part":1,"num":44,"stem":"Nội dung nào sau đây là một trong những nguyên tắc hoạt động của tổ chức Liên hợp quốc?","opts":["Không can thiệp vào công việc nội bộ của các quốc gia.","Hợp tác phát triển hiệu quả về kinh tế, văn hóa và xã hội.","Luôn có sự cân bằng quyền lực với hệ thống xã hội đối lập.","Bình đẳng quyền con người, phát triển văn hóa, xã hội."],"ans":0,"id":"b1-44"},{"lesson":1,"part":1,"num":45,"stem":"Nội dung nào là cơ sở để tổ chức Liên hợp quốc đề ra nguyên tắc “Giải quyết các tranh chấp quốc tế bằng biện pháp hòa bình”?","opts":["Hòa bình là nguyện vọng, là xu thế của các dân tộc trên thế giới.","Tranh chấp, xung đột xảy ra ở hầu hết các khu vực trên thế giới.","Hòa bình là điều kiện quyết định để duy trì chế độ chính trị.","Mục đích của Liên hợp quốc là cân bằng lợi ích của các nước."],"ans":0,"id":"b1-45"},{"lesson":1,"part":1,"num":46,"stem":"Nội dung nào sau đây không phải là nguyên tắc hoạt động của tổ chức Liên hợp quốc?","opts":["Đảm bảo quyền con người, thúc đẩy sự phát triển văn hóa và xã hội.","Bình đẳng chủ quyền giữa các quốc gia và quyền tự quyết của các dân tộc.","Không can thiệp vào công việc nội bộ của bất kì nước nào.","Giải quyết các tranh chấp quốc tế bằng biện pháp hòa bình."],"ans":0,"id":"b1-46"},{"lesson":1,"part":1,"num":47,"stem":"Để đảm bảo cho việc thực sự phục vụ mục tiêu chung của cộng đồng quốc tế, Hiến chương Liên hợp quốc đã","opts":["yêu cầu các nước lớn các thiệp vào nội bộ các nước nhỏ.","quy định rõ các nguyên tắc hoạt động của tổ chức này.","chủ trương sử dụng bạo lực để giải quyết các vấn đề.","nghiêm cấm các nước không được sản xuất bom nguyên tử."],"ans":1,"id":"b1-47"},{"lesson":1,"part":1,"num":48,"stem":"Nội dung nào sau đây phản ánh đúng vai trò của Liên hợp quốc trong việc duy trì hòa bình và an ninh quốc tế?","opts":["Hỗ trợ các nền kinh tế kém phát triển thông qua các cơ quan chuyên môn.","Thực thi quyền con người, xây dựng một thế giới an toàn, công bằng hơn.","Góp phần giải quyết các cuộc xung đột và tranh chấp ở nhiều khu vực.","Thúc đẩy phát triển bền vững trên ba lĩnh vực kinh tế, xã hội và môi trường."],"ans":2,"id":"b1-48"},{"lesson":1,"part":1,"num":49,"stem":"Nhận xét nào sau đây phản ánh đúng hạn chế của tổ chức Liên Hợp Quốc trong quá trình hoạt động từ khi được thành lập đến năm 2000?","opts":["Không giải quyết được cuộc xung đột nào trên thế giới.","Không ngăn chặn được tình trạng căng thẳng trên thế giới.","Các cơ quan chuyên môn hoạt động chưa thực sự hiệu quả.","Sự hợp tác còn lỏng lẻo, chưa mở rộng trên nhiều lĩnh vực."],"ans":1,"id":"b1-49"},{"lesson":1,"part":1,"num":50,"stem":"Xây dựng và soạn thảo được một hệ thống các công ước quốc tế về giải trừ quân bị chống chạy đua vũ trang là hoạt động thể hiện vai trò nào của tổ chức Liên hợp quốc?","opts":["Duy trì hòa bình và an ninh quốc tế.","Ngăn chặn chiến tranh lạnh trên thế giới.","Bảo đảm quyền con người, phát triển văn hóa.","Thúc đẩy phát triển kinh tế, thương mại thế giới."],"ans":0,"id":"b1-50"},{"lesson":1,"part":1,"num":51,"stem":"Nội dung nào sau đây không phản ánh đúng đóng góp của tổ chức Liên hợp quốc?","opts":["Chấm dứt hoàn toàn các cuộc xung đột quân sự trên thế giới.","Góp phần xóa bỏ chế độ phân biệt chủng tộc ở châu Phi.","Thúc đẩy quan hệ hữu nghị và hợp tác giữa các dân tộc.","Thúc đẩy hợp tác quốc tế về thương mại, tài chính và đầu tư."],"ans":0,"id":"b1-51"},{"lesson":1,"part":1,"num":52,"stem":"Trải qua hơn 70 năm hoạt động (từ năm 1945), Liên hợp quốc đã có nhiều vai trò, đóng góp trên các lĩnh vực, nhưng không có vai trò nào sau đây?","opts":["Góp phần thúc đẩy quá trình phi thực dân hóa ở nhiều nơi trên thế giới.","Làm trung gian hòa giải chấm dứt xung đột và chiến tranh ở các khu vực.","Ra các văn bản, xây dựng môi trường thuận lợi thúc đẩy hợp tác quốc tế.","Ngăn chặn được các cuộc đối đầu Đông-Tây và xung đột trên thế giới."],"ans":3,"id":"b1-52"},{"lesson":1,"part":1,"num":53,"stem":"Nội dung nào sau đây là nguyên nhân chủ yếu làm cho số lượng thành viên của Liên Hợp Quốc tăng nhanh trong giai đoạn 1945-2000?","opts":["Sự phát triển mạnh mẽ của chủ nghĩa khủng bố quốc tế.","Gia nhập Liên Hợp Quốc để nhận được viện trợ kinh tế.","Tác động của trật tự thế giới hai cực và Chiến tranh lạnh.","Nhiều quốc gia thắng lợi trong cuộc đấu tranh giành độc lập."],"ans":3,"id":"b1-53"},{"lesson":1,"part":1,"num":54,"stem":"Một trong những văn kiện quan trọng được Liên hợp quốc ban hành nhằm duy trì hòa bình và an ninh thế giới là","opts":["Chương trình nghị sự 2030.","Công ước Liên hợp quốc về quyền trẻ em.","Tuyên ngôn Quốc tế Nhân quyền.","Hiệp ước cấm phổ biến vũ khí hạt nhân."],"ans":3,"id":"b1-54"},{"lesson":1,"part":1,"num":55,"stem":"Đọc đoạn tư liệu sau đây và trả lời câu hỏi: “[Năm 1960] Đại hội đồng Liên hợp quốc đã thông qua bản Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa. Đó là một sự kiện chính trị quan trọng. Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của pháp luật quốc tế; khẳng định rõ ràng cơ sở pháp lí quốc tế của cuộc đấu tranh giành độc lập dân tộc bị áp bức\". (Nguyễn Quốc Hùng, Nguyễn Hồng Quân, Liên hợp quốc và lực lượng giữ gìn hòa bình Liên hợp quốc, NXB Chính trị quốc gia, Hà Nội, 2008, tr.46) Đoạn tư liệu trên phản ánh vai trò nào sau đây của tổ chức Liên hợp quốc?","opts":["Đảm bảo các quyền cơ bản của con người.","Phát triển văn hóa, xã hội các nước thành viên.","Thúc đẩy phát triển kinh tế, tài chính quốc tế.","Thúc đẩy quá trình phi thực dân hóa trên thế giới."],"ans":3,"id":"b1-55"},{"lesson":1,"part":1,"num":56,"stem":"Nội dung nào sau đây phản ánh đúng vai trò quan trọng hàng đầu của Liên hợp quốc đã thực hiện từ khi thành lập đến nay?","opts":["Là trung tâm giải quyết các mâu thuẫn về vấn đề dân tộc trên thế giới.","Ngăn chặn được nguy cơ bùng nổ cuộc chiến tranh thế giới mới.","Thúc đẩy quan hệ hợp tác kinh tế, quân sự giữa các nước thành viên.","Là trung gian hòa giải mọi tranh chấp quốc tế giữa các dân tộc."],"ans":1,"id":"b1-56"},{"lesson":1,"part":1,"num":57,"stem":"Nhận xét nào sau đây phản ánh đúng về tổ chức Liên Hợp Quốc?","opts":["Có đóng góp tích cực trong việc giải trừ chủ nghĩa thực dân trên thế giới.","Là công cụ để duy trì trật tự thế giới mới sau Chiến tranh thế giới thứ nhất.","Là nhân tố hàng đầu chi phối quan hệ quốc tế phần lớn nửa sau thế kỉ XX.","Là diễn đàn khu vực vừa hợp tác, vừa đấu tranh vì hòa bình, an ninh thế giới."],"ans":0,"id":"b1-57"},{"lesson":1,"part":1,"num":58,"stem":"Hiện nay, một trong những cuộc xung đột trên thế giới mà Liên hợp quốc vẫn chưa giải quyết được là ở","opts":["Mô-dăm-bich.","Trung Đông.","En Xan-va-do.","Goa-tê-ma-la."],"ans":1,"id":"b1-58"},{"lesson":1,"part":1,"num":59,"stem":"Tham gia vào việc giải quyết vấn đề hòa bình trên bán đảo Đông Dương (1954) có sự tham gia của tổ chức quốc tế nào sau đây?","opts":["Hội quốc liên.","Hiệp hội các nước Đông Nam Á.","Liên hợp quốc.","Liên minh châu Âu."],"ans":2,"id":"b1-59"},{"lesson":1,"part":1,"num":60,"stem":"Cơ quan nào của tổ chức Liên hợp quốc giữ vai trò quan trọng yếu trong việc duy trì hoà bình và an ninh quốc tế?","opts":["Hội đồng Bảo an.","Đại hội đồng.","Hội đồng Kinh tế - Xã hội.","Tòa án quốc tế."],"ans":0,"id":"b1-60"},{"lesson":1,"part":1,"num":61,"stem":"Nội dung nào sau đây phản ánh đúng vai trò của Liên hợp quốc trong việc thúc đẩy phát triển?","opts":["Hỗ trợ các nền kinh tế kém phát triển thông qua các cơ quan chuyên môn.","Thực thi quyền con người, xây dựng một thế giới an toàn, công bằng hơn.","Góp phần thúc đẩy phong trào giải phóng dân tộc trên thế giới phát triển.","Góp phần giải quyết mọi cuộc xung đột và tranh chấp diễn ra trên thế giới."],"ans":0,"id":"b1-61"},{"lesson":1,"part":1,"num":62,"stem":"Nội dung nào sau đây phản ánh đúng vai trò của Liên hợp quốc trong việc thúc đẩy kinh tế, tài chính, thương mại quốc tế?","opts":["Tạo môi trường kinh tế bình đẳng, hỗ trợ các nền kinh tế kém phát triển.","Hỗ trợ các nước trong quá trình phát triển văn hóa, xã hội, giáo dục, y tế.","Giải quyết các cuộc tranh chấp, xung đột ở nhiều quốc gia và khu vực.","Thúc đẩy quá trình giành độc lập của các nước thuộc địa và phụ thuộc."],"ans":0,"id":"b1-62"},{"lesson":1,"part":1,"num":63,"stem":"Trong quá trình phát triển, Liên hợp quốc ưu tiên tạo môi trường thuận lợi để","opts":["thúc đẩy sự hợp tác quốc tế.","ngăn chặn khủng hoảng kinh tế.","dung dưỡng chủ nghĩa phát xít.","can thiệp vào nội bộ các nước."],"ans":0,"id":"b1-63"},{"lesson":1,"part":1,"num":64,"stem":"Nội dung nào sau đây được tổ chức Liên hợp quốc chú trọng, xem đó là công cụ phát triển kinh tế các nước thành viên?","opts":["xây dựng nền văn hóa tiên tiến, dân tộc.","phát triển hợp tác kinh tế, thương mại quốc tế.","đảm bảo các quyền cơ bản của con người.","duy trì hòa bình và an ninh trên thế giới."],"ans":1,"id":"b1-64"},{"lesson":1,"part":1,"num":65,"stem":"Từ năm 1960, Đại Hội đồng Liên hợp quốc đề ra các Chiến lược phát triển cho từng thập kỷ nhằm mục đích chủ yếu nào sau đây?","opts":["Hạn chế sự mở rộng ảnh hưởng của hệ thống tư bản chủ nghĩa.","Huy động sự hợp tác quốc tế cho các mục tiêu phát triển chung.","Ngăn chặn chiến tranh, duy trì hòa bình và an ninh trên thế giới.","Giải quyết triệt để tình trạng khủng hoảng kinh tế trên thế giới."],"ans":1,"id":"b1-65"},{"lesson":1,"part":1,"num":66,"stem":"Tại Hội nghị Thượng đỉnh Thiên niên kỉ năm 2000, Liên hợp quốc đã đề ra Mục tiêu phát triển thiên niên kỉ nhằm","opts":["xóa bỏ đói nghèo, đảm bảo bền vững môi trường.","thúc đẩy phong trào cách mạng vô sản phát triển.","xóa bỏ chế độ phân biệt chủng tộc A-pác-thai.","chống chiến tranh hạt nhân, buôn bán vũ khí."],"ans":0,"id":"b1-66"},{"lesson":1,"part":1,"num":67,"stem":"Năm 2015, Liên hợp quốc thông qua Chương trình nghị sự 2030 vì sự phát triển bền vững không bao gồm mục tiêu nào sau đây?","opts":["Giáo dục có chất lượng.","Chống nạn thất nghiệp.","Nước sạch và vệ sinh.","Giảm bất bình đẳng."],"ans":1,"id":"b1-67"},{"lesson":1,"part":1,"num":68,"stem":"Năm 1948, văn kiện nào sau đây đã được Đại hội đồng Liên hợp quốc thông qua, khẳng định những quyền cơ bản của con người?","opts":["Tuyên ngôn Nhân quyền.","Hiến chương Liên hợp quốc.","Công ước quốc tế về kinh tế.","Hiệp ước cấm vũ khí hạt nhân."],"ans":0,"id":"b1-68"},{"lesson":1,"part":1,"num":69,"stem":"Đại hội đồng Liên hợp quốc thông qua Tuyên ngôn Nhân quyền (1948) trong hoàn cảnh nào?","opts":["Chiến tranh lạnh trong hệ thống xã hội chủ nghĩa đang diễn ra.","Chiến tranh thế giới thứ hai đang bước vào giai đoạn kết thúc.","Hậu quả của cuộc chiến tranh thế giới đã được khắc phục triệt để.","Phong trào đấu tranh vì dân chủ và tiến bộ xã hội phát triển mạnh."],"ans":3,"id":"b1-69"},{"lesson":1,"part":1,"num":70,"stem":"Vai trò của Liên hợp quốc về bảo đảm quyền con người, phát triển văn hoá, xã hội được thể hiện qua một trong những nội dung nào sau đây?","opts":["Thông qua Công ước cấm vũ khí hoá học.","Cử lực lượng tham gia giữ gìn hòa bình.","Xây dựng các quỹ tài trợ cho giáo dục.","Thành lập các liên minh kinh tế - tài chính."],"ans":2,"id":"b1-70"},{"lesson":1,"part":1,"num":71,"stem":"Văn kiện nào sau đây của Liên hợp quốc đã khẳng định những quyền cơ bản của con người?","opts":["Tuyên ngôn Quốc tế về Nhân quyền.","Tầm nhìn ASEAN 2025.","Tuyên ngôn Độc lập.","Hiến chương ASEAN."],"ans":0,"id":"b1-71"},{"lesson":1,"part":1,"num":72,"stem":"Nội dung nào sau đây phản ánh không đúng về văn kiện “Tuyên ngôn Nhân quyền” (1948) của tổ chức Liên Hợp Quốc?","opts":["Trở thành mục tiêu vươn tới của mọi quốc gia, dân tộc.","Là một “văn kiện đột phá”, có tính pháp lý cao.","Khẳng định những quyền cơ bản của con người.","Đề cao các tư tưởng mang tính dân tộc cực đoan."],"ans":3,"id":"b1-72"},{"lesson":1,"part":1,"num":73,"stem":"Để đảm bảo quyền con người, Liên hợp quốc đã không xây dựng và thông qua văn bản, điều ước quốc tế nào sau đây?","opts":["Công ước quốc tế về các quyền kinh tế, xã hội và văn hóa.","Công ước quốc tế về các quyền dân sự và chính trị.","Tuyên ngôn Quốc tế Nhân quyền (1948).","Hiệp ước cấm phổ biến vũ khí hạt nhân (1968)."],"ans":3,"id":"b1-73"},{"lesson":1,"part":1,"num":74,"stem":"Năm 1948, Đại hội đồng Liên hợp quốc thông qua Tuyên ngôn Tuyên ngôn Nhân quyền đã","opts":["xóa bỏ chủ nghĩa thực dân trên phạm vi toàn cầu.","thủ tiêu các hình thức của chế độ phân biệt chủng tộc.","hạn chế tình trạng chạy đua vũ trang giữa các cường quốc.","đề cao những quyền và tự do cơ bản của con người."],"ans":3,"id":"b1-74"},{"lesson":1,"part":1,"num":75,"stem":"Để đảm bảo những quyền cơ bản của con người Liên hợp quốc đã","opts":["chỉ kí kết các văn bản song phương với các nước.","can thiệp trực tiếp vào công việc nội bộ các nước.","xây dựng, ký kết nhiều văn bản, điều ước quốc tế.","viện trợ về kinh tế cho các quốc gia và khu vực."],"ans":2,"id":"b1-75"},{"lesson":1,"part":1,"num":76,"stem":"Nội dung nào sau đây thể hiện vai trò của Liên hợp quốc trong việc bảo đảm quyền con người, phát triển văn hóa, xã hội?","opts":["Làm trung gian hòa giải cuộc chiến tranh thế giới thứ nhất.","Tăng cường bình đẳng giới và vị thế, năng lực của phụ nữ.","Triển khai hoạt động giữ gìn hoà bình ở nhiều khu vực.","Giảm lãi suất cho vay ở hầu hết các nước đang phát triển."],"ans":1,"id":"b1-76"},{"lesson":1,"part":1,"num":77,"stem":"Nội dung nào sau đây phản ánh đúng vai trò của Liên hợp quốc trong việc bảo đảm quyền con người, phát triển văn hóa và xã hội?","opts":["Trực tiếp tham gia vào quá trình thành lập các liên minh khu vực.","Ngăn chặn sự đối đầu Đông - Tây và mọi xung đột trên thế giới.","Công nhận nền kinh tế thị trường cho tất cả các quốc gia thành viên.","Thúc đẩy các chương trình phát triển giáo dục, y tế, văn hóa."],"ans":3,"id":"b1-77"},{"lesson":1,"part":1,"num":78,"stem":"Nội dung nào sau đây phản ánh không đúng vai trò của Liên hợp quốc trong việc bảo đảm quyền con người, phát triển văn hóa và xã hội?","opts":["Chú trọng đề cao việc bảo vệ các quyền cơ bản của con người.","Thúc đẩy các chương trình phát triển giáo dục, y tế, văn hóa.","Thúc đẩy các liên minh quân sự để đảm bảo an ninh thế giới.","Tạo điều kiện xây dựng các hệ thống an ninh xã hội và giáo dục."],"ans":2,"id":"b1-78"},{"lesson":1,"part":2,"num":79,"stem":"Cho những thông tin trong bảng sau đây:","stmts":[{"t":"Liên hợp quốc đã xây dựng được các văn bản và công ước quốc tế về bảo đảm quyền con người, hạn chế chạy đua vũ trang và thúc đẩy sự phát triển.","ok":true},{"t":"Tuyên ngôn Quốc tế Nhân quyền của Liên hợp quốc đã góp phần xây dựng một thế giới công bằng hơn, tạo cơ hội phát triển cho tất cả mọi người trên thế giới.","ok":true},{"t":"Bảng thông tin trên thể hiện các sự kiện trong quá trình thành lập tổ chức Liên hợp quốc.","ok":false},{"t":"Những nỗ lực phi thực dân hóa của Liên hợp quốc đã tạo tạo điều kiện thúc đẩy phong trào giải phóng dân tộc trên thế giới phát triển và giành thắng lợi.","ok":true}],"table":[["Thời gian","Nội dung"],["Năm 1945","Đại biểu 50 nước đã thông qua Hiến chương Liên hợp quốc."],["Năm 1948","Liên hợp quốc thông qua Tuyên ngôn Quốc tế Nhân quyền."],["Năm 1960","Liên hợp quốc thông qua Tuyên bố về phi thực dân hóa."],["Năm 1992","Đại hội đồng Liên hợp quốc thông qua Công ước về vũ khí hóa học."],["Năm 2015","Chương trình nghị sự 2030 vì sự phát triển bền vững của Liên hợp quốc được thông qua."]],"id":"b1-79"},{"lesson":1,"part":2,"num":80,"stem":"Đọc đoạn tư liệu sau đây: “Liên hợp quốc là một tổ chức đa phương toàn cầu đầu tiên có những hoạt động thực chất và đóng góp nhiều cố gắng trong việc phối hợp, điều tiết các mối quan hệ giữa các quốc gia độc lập có chủ quyền trên nguyên tắc tôn trọng chủ quyền bình đẳng của các quốc gia”. (Trần Nam Tiến (Chủ biên), Lịch sử quan hệ quốc tế hiện đại (1945 – 2000), NXB Giáo dục, Hà Nội, 2008, tr.23)","stmts":[{"t":"Liên hợp quốc là tổ chức quốc tế được thành lập nhằm duy trì hòa bình, an ninh trên thế giới.","ok":true},{"t":"Tính chất đa phương của Liên hợp quốc được thể hiện thông qua việc kết nạp các thành viên theo những thể chế chính trị khác nhau nhằm đặt lợi ích kinh tế lên hàng đầu.","ok":false},{"t":"Một trong những nguyên tắc hoạt động của Liên hợp quốc là tôn trọng toàn vẹn lãnh thổ và độc lập chính trị của các quốc gia.","ok":true},{"t":"Hiện nay, Liên hợp quốc cần được nâng cao vai trò để tiếp tục duy trì ổn định, an ninh, thịnh vượng trong bối cảnh địa chính trị phức tạp.","ok":true}],"id":"b1-80"},{"lesson":1,"part":2,"num":81,"stem":"Đọc đoạn tư liệu sau đây: “Năm 1960, Đại hội đồng Liên hợp quốc đã thông qua bản Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa. Đó là một sự kiện chính trị quan trọng. Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của luật pháp quốc tế, khẳng định rõ ràng cơ sở pháp lý của cuộc đấu tranh giành độc lập của các dân tộc bị áp bức\". (Nguyễn Quốc Hùng - Nguyễn Hồng Quân, Liên hợp quốc và Lực lượng gìn giữ hòa bình Liên hợp quốc, NXB Chính trị quốc gia, Hà Nội, 2008, tr. 46)","stmts":[{"t":"Đoạn tư liệu cho thấy đóng góp của Liên hợp quốc đối với việc duy trì hòa bình và an ninh quốc tế từ đầu thế kỷ XX.","ok":false},{"t":"Tuyên ngôn được đề cập trong đoạn tư liệu được thông qua là sự kiện đánh dấu chủ nghĩa thực dân bị thủ tiêu hoàn toàn trên thế giới.","ok":false},{"t":"Tuyên ngôn đã tạo cơ sở pháp lí để nhân dân Việt Nam tiếp tục đấu tranh hoàn thành cuộc cách mạng dân tộc dân chủ nhân dân trên cả nước.","ok":true},{"t":"Đại hội đồng Liên hợp quốc là một diễn đàn hợp tác quốc tế lớn và là cơ quan giữ vai trò chủ yếu trong việc duy trì hòa bình và an ninh quốc tế.","ok":false}],"id":"b1-81"},{"lesson":1,"part":2,"num":82,"stem":"Đọc đoạn tư liệu sau đây: “Sau hai tháng làm việc, qua các cuộc đấu tranh gay gắt giữa nhiều ý kiến và khuynh hướng khác nhau, hiến chương Liên hợp quốc được đại biểu của 50 nước ký kết ngày 26-6-1945. Hiến chương bắt đầu có hiệu lực kể từ ngày 24-10-1945 (ngày Quốc hội 5 cường quốc Liên Xô, Mỹ, Anh, Pháp và Trung Quốc thông qua Hiến chương Liên hợp quốc) và ngày này cũng được coi là ngày Liên hợp quốc chính thức được thành lập”. (Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 2015, tr.226)","stmts":[{"t":"Ngày 24 - 10 - 1945, bản Hiến chương Liên hợp quốc chính thức có hiệu lực, đánh dấu sự thành lập Liên hợp quốc.","ok":true},{"t":"Hiến chương Liên hợp quốc được kí kết ngay sau khi Chiến tranh thế giới thứ hai kết thúc mà không gặp phải bất kì sự phản đối hay tranh luận nào từ các đại biểu tham gia.","ok":false},{"t":"Hiến chương Liên hợp quốc quy định mục đích cao nhất của Liên hợp quốc là nhằm duy trì hòa bình và an ninh thế giới.","ok":true},{"t":"Nhân tố hàng đầu chi phối quan hệ quốc tế từ sau Chiến tranh thế giới thứ hai đến đầu thập niên 90 của thế kỉ XX là sự ra đời và hoạt động của Liên hợp quốc.","ok":false}],"id":"b1-82"},{"lesson":1,"part":2,"num":83,"stem":"Cho bảng thông tin sau đây:","stmts":[{"t":"Bảng thông tin trên phản ánh về mục tiêu của Liên hợp quốc và mối quan hệ giữa Việt Nam với tổ chức này.","ok":false},{"t":"Việc bảo đảm quyền con người và thúc đẩy sự phát triển của Liên hợp quốc đều có mối liên hệ mật thiết với hòa bình và an ninh thế giới.","ok":true},{"t":"Những thông tin trong bảng cho thấy Liên hợp quốc có đóng góp toàn diện đối với sự phát triển của thế giới trong quá khứ, hiện tại và tương lai.","ok":true},{"t":"Với vai trò là trụ cột trung tâm của hệ thống đa phương hiện đại, Liên hợp quốc có sự hiện diện phủ khắp toàn cầu và hoạt động ở cả những địa bàn khó khăn nhất.","ok":true}],"table":[["Thời gian","Nội dung"],["Năm 1948","Tuyên ngôn Nhân quyền thế giới ra đời."],["Năm 1966","Công ước quốc tế về các quyền kinh tế, xã hội và văn hóa được thông qua."],["Năm 1977","Việt Nam chính thức trở thành thành viên thứ 149 của tổ chức Liên hợp quốc."],["Năm 2001","Ông Kofi Annan được Ủy ban Nobel trao tặng Giải Nobel Hòa bình."],["Năm 2007 và 2019","Việt Nam được bầu làm Ủy viên không thường trực Hội đồng Bảo an."],["Năm 2023","Điều phối hoạt động hỗ trợ nhân đạo cho 245 triệu người ở 74 quốc gia và vùng lãnh thổ, kể cả những nơi tình hình thực địa phức tạp, như Afganistan, Sudan, Yemen, Gaza..."],["Năm 2024","Diễn ra Hội nghị Thượng đỉnh Tương lai với chủ đề “Giải pháp đa phương vì tương lai tốt đẹp hơn”."]],"id":"b1-83"},{"lesson":1,"part":2,"num":84,"stem":"Đọc đoạn tư liệu sau đây: “Sau hai tháng làm việc, qua các cuộc đấu tranh gay gắt giữa nhiều ý kiến và khuynh hướng khác nhau, hiến chương Liên Hợp Quốc được đại biểu của 50 nước ký kết ngày 26-6-1945. Hiến chương bắt đầu có hiệu lực kể từ ngày 24-10-1945 (ngày Quốc hội 5 cường quốc Liên Xô, Mỹ, Anh, Pháp và Trung Quốc thông qua Hiến chương Liên Hợp Quốc) và ngày này cũng được coi là ngày Liên Hợp Quốc chính thức được thành lập”. (Nguyễn Anh Thái (chủ biên), Lịch sử thế giới hiện đại, Nxb Giáo dục, Hà Nội, 2015, tr.226)","stmts":[{"t":"Ngày 24-10-1945, bản Hiến chương Liên Hợp Quốc chính thức có hiệu lực, đánh dấu sự thành lập của Liên Hợp Quốc.","ok":true},{"t":"Sự thông qua và có hiệu lực của Hiến chương Liên Hợp Quốc đã thiết lập một nền tảng pháp lý cho việc duy trì hòa bình và an ninh quốc tế trong giai đoạn hậu chiến..","ok":true},{"t":"Sự ra đời của Liên Hợp Quốc đánh dấu một bước ngoặt quan trọng trong việc xây dựng hệ thống an ninh tập toàn cầu, nhằm ngăn chặn xung đột và bảo bình quốc tế.","ok":true},{"t":"Hiến chương Liên Hợp Quốc được ký kết ngay sau khi Chiến tranh thế giới thứ hai kết thúc mà không gặp phải bất kỳ sự phản đối hay tranh luận nào từ các đại biểu tham gia.","ok":false}],"id":"b1-84"},{"lesson":1,"part":2,"num":85,"stem":"Cho bảng thông tin sau đây:","stmts":[{"t":"Tổ chức Liên hợp quốc được thành lập để nhanh chóng kết thúc Chiến tranh thế giới thứ hai.","ok":false},{"t":"Liên Xô, Mỹ, Anh đóng vai trò quan trọng nhất cho sự ra đời của tổ chức Liên hợp quốc.","ok":true},{"t":"Quá trình thành lập Liên hợp quốc diễn ra kéo dài với nhiều sự kiện quan trọng thể hiện sự nỗ lực vì hòa bình chung của cộng đồng quốc tế.","ok":true},{"t":"Ý tưởng thành lập Liên hợp quốc gắn liền với quá trình thiết lập và hoạt động của phe Đồng minh chống phát xít trong Chiến tranh thế giới thứ hai.","ok":false}],"table":[["Thời gian","Nội dung"],["Ngày 1/1/1942","Tại Oa-sinh-tơn (Mỹ), đại diện 26 nước chống phát xít ký bản Tuyên ngôn Liên hợp quốc, cam kết thành lập tổ chức quốc tế vì hòa bình và an ninh sau chiến tranh."],["Từ ngày 28/11 đến ngày 1/12/1943","Tại Hội nghị Tê-hê-ran (I-ran), ba nước Liên Xô, Mỹ, Anh khẳng định quyết tâm thành lập Liên hợp quốc."],["Tháng 2/1945","Tại Hội nghị I-an-ta (Liên Xô), ba nước Liên Xô, Mỹ, Anh ra quyết định thành lập Liên hợp quốc và đồng ý triệu tập hội nghị để thông qua Hiến chương Liên hợp quốc."],["Từ ngày 25/4 đến ngày 26/6/1945","Đại biểu 50 nước họp tại Xan Phran-xi-xcô (Mỹ) đã thông qua bản Hiến chương Liên hợp quốc."]],"id":"b1-85"},{"lesson":1,"part":2,"num":86,"stem":"Đọc đoạn tư liệu sau đây: “Duy trì hòa bình và an ninh quốc tế, và để đạt được mục đích đó, thi hành những biện pháp tập thể có hiệu quả để phòng ngừa và loại trừ các mối đe doạ hoà bình, cầm mọi hành vi xâm lược và phá hoại hoà bình khác; điều chỉnh hoặc giải quyết các vụ tranh chấp hoặc những tình thế có tính chất quốc tế có thể đưa đến sự phá hoại hoà bình, bằng biện pháp hoà bình theo đúng nguyên tắc của công lý và pháp luật quốc tế\". (Trích: Điều 1, Hiến chương Liên hợp quốc, ngày 24-10-1945)","stmts":[{"t":"Đoạn tư liệu thể hiện mục tiêu của Liên hợp quốc là duy trì hòa bình và an ninh quốc phòng cho tất cả các quốc gia.","ok":false},{"t":"Một trong những mục tiêu của Liên hợp quốc là giải quyết các vụ tranh chấp quốc tế bằng pháp luật của các quốc gia.","ok":false},{"t":"Trong số các mục tiêu của Liên hợp quốc, duy trì hòa bình và an ninh quốc tế là mục tiêu được đặt lên hàng đầu.","ok":true},{"t":"Ngày nay, Liên hợp quốc vẫn tiếp tục thực hiện mục tiêu giải quyết các vụ tranh chấp, xung đột quốc tế bằng biện pháp bạo lực.","ok":false}],"id":"b1-86"},{"lesson":1,"part":2,"num":87,"stem":"Đọc đoạn tư liệu sau đây: “Tất cả các quốc gia thành viên Liên hợp quốc đều phải làm tròn những nghĩa vụ mà họ phải đảm nhận theo Hiến chương này để được bảo đảm hưởng toàn bộ các quyền và ưu đãi do tư cách thành viên mà có; Tất cả các thành viên của Liên hợp quốc giải quyết các tranh chấp quốc tế của họ bằng biện pháp hoà bình, sao cho không tổn hại đến hoà bình, an ninh quốc tế và công lý”. (Trích: Điều 2, Hiến chương Liên hợp quốc, ngày 24-10-1945)","stmts":[{"t":"Đoạn tư liệu thể hiện mục tiêu hoạt động cơ bản của Liên hợp quốc là các quốc gia làm tròn nghĩa vụ đối với tổ chức này.","ok":false},{"t":"Nguyên tắc “giải quyết các tranh chấp quốc tế bằng biện pháp hòa bình” của Liên hợp quốc là cơ sở giải quyết mọi tranh chấp.","ok":false},{"t":"Nhu cầu duy trì hòa bình là cơ sở để Liên hợp quốc đề ra nguyên tắc “giải quyết các tranh chấp quốc tế bằng biện pháp hòa bình”.","ok":true},{"t":"Mặc dù Liên hợp quốc có những nguyên tắc hoạt động chặt chẽ, nhưng hiện nay giữa một số quốc gia thành viên vẫn diễn ra chiến tranh, xung đột.","ok":true}],"id":"b1-87"},{"lesson":1,"part":2,"num":88,"stem":"Đọc đoạn tư liệu sau đây: [Năm 1960] “Đại hội đồng Liên hợp quốc đã thông qua bản Tuyên ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa. Đó là một sự kiện chính trị quan trọng. Như thế, Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của luật pháp quốc tế: khẳng định rõ ràng cơ sở pháp lý quốc tế của cuộc đấu tranh giành độc lập của các dân tộc bị áp bức”. (Nguyễn Quốc Hùng, Nguyễn Hồng Quân, Liên hợp quốc và Lực lượng gìn giữ hòa bình Liên hợp quốc, NXB Chính trị Quốc gia, Hà Nội, 2008, tr.46)","stmts":[{"t":"Liên hợp quốc đã đưa ra văn bản quan trọng nhằm thủ tiêu hệ thống thuộc địa của chủ nghĩa thực dân trên thế giới.","ok":true},{"t":"Bản Tuyên ngôn của Liên hợp quốc đã có tác động tiêu cực đến phong trào đấu tranh giải phóng ở các nước thuộc địa và phụ thuộc trên thế giới.","ok":false},{"t":"Lực lượng gìn giữ hòa bình của Liên hợp quốc giúp tổ chức này thực thi nhiệm vụ bảo vệ nền hòa bình của các nước thuộc địa.","ok":false},{"t":"Đây là một trong những văn bản quan trọng thể hiện vai trò và đóng góp của Liên hợp quốc vì sự tiến bộ của nhân loại.","ok":true}],"id":"b1-88"},{"lesson":1,"part":2,"num":89,"stem":"Cho đoạn tư liệu sau đây: “Hội đồng bảo an có thẩm quyền quyết định những biện pháp nào phải được áp dụng mà không sử dụng vũ lực để thực hiện các nghị quyết của Hội đồng, và có thể yêu cầu các thành viên của Liên hợp quốc áp dụng những biện pháp ấy. Các biện pháp này có thể là cắt đứt toàn bộ hay từng phần quan hệ kinh tế, đường sắt, đường biển, hàng không, bưu chính, điện tín, vô tuyến điện và các phương tiện thông tin khác, kể cả việc cắt đứt quan hệ ngoại giao”. (Trích: Điều 41, Hiến chương Liên hợp quốc, ngày 24-10-1945)","stmts":[{"t":"Những biện pháp được Hội đồng Bảo an Liên hợp quốc áp dụng đã góp phần giải quyết các mối đe dọa hòa bình, phá hoại hòa bình và hành vi xâm lược.","ok":true},{"t":"Việc cắt đứt quan hệ ngoại giao là biện pháp có tính răn đe của Hội đồng Bảo An Liên hợp quốc đối các thành viên vi phạm Hiến chương.","ok":true},{"t":"Để đảm bảo quyền dân tộc tự quyết, mọi quyết định của Hội đồng bảo an đều thể hiện cho tiếng nói của tất cả các thành viên của Liên hợp quốc.","ok":false},{"t":"Đoạn tư liệu trên đề cập đến thẩm quyền của cơ quan trọng yếu trong việc duy trì hòa bình và an ninh thế giới của tổ chức Liên hợp quốc.","ok":true}],"id":"b1-89"},{"lesson":1,"part":2,"num":90,"stem":"Cho những thông tin trong bảng sau đây:","stmts":[{"t":"Việc thông qua các hiệp ước cấm vũ khí hủy diệt phản ánh quá trình phi hạt nhân hóa là một thách thức lớn, phức tạp, đòi hỏi sự kiên trì và nỗ lực lâu dài của toàn bộ cộng đồng quốc tế.","ok":true},{"t":"Hiệp ước cấm vũ khí hóa học được thông qua năm 1993 vì nhận thức về sự nguy hiểm và hậu quả tàn khốc của vũ khí này ngày càng tăng.","ok":true},{"t":"Đoạn tư liệu trên thể hiện những cột mốc và các văn kiện quan trọng trong quá trình phát triển của Liên hợp quốc.","ok":true},{"t":"Bản Tuyên ngôn Nhân quyền của Liên hợp quốc là văn bản pháp lí đầu tiên trên thế giới có đề cập đến quyền con người.","ok":false}],"imgs":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAnAAAAB5CAMAAACOXexwAAADAFBMVEUAAAD///8AAADv7++tra0ZGRlCQkLW1tbOzs57c3tzc2ucpaX37/fe3ube3tacnJS1rbWEhIxCQkqMlJS9tb1rY2u9xcUhGSEpKSlSWlpjWlpKUkqEe3s6MToxMTEQCAgQUhBzUuacUhBCUr1zGeacGRBCGb1zhBlzUrVrUhAQUr1zGbVrGRAQGb0ACAhazuZahOal5mNCGZRCUhkZUpSltWNCGRAQGZRCGWsZUmsQGWtCzmNChGOUzpwQzmMQhGOUvc4Z7+YZpeZa76VapaVzMXtzhEqlUuacUkJCUu+lGeacGUJCGe+lhBmlUrVrUkIQUu+lGbVrGUIQGe/OELWU786UWmvOGTrOGRDOGWNa7+ZapebmtbVC72NKUoRCpWOU75wQ72MQpWOUve/e91Le9xne94ylhEqlMXvvvebOEOZz5hBztRDOWjrOzjrOlDrOQrXOlLXOWhDOzhDOlBDOa7XOzmPOWmPOlGPm1rXvELWljL2EjL3e972U7++UWozvGTrvGRDOGYQpzqUphKXvGWMIzqUIhKVCEEIQOkLOlObOQual5hCltRDOa+ZCzhBChBAQzhAQhBBzEGuchHMQCDHvEOZz5jFztTFz5nNztXNz5lJztVKljO/vWjrvzjrvlDrvQrXvlLXvWhDvzhDvlBDva7XOzoTOWoTOlIQpzuYphOZazrVahLXvzmPvWmPvlGOEjO8IzuYIhOZazpRahJTvGYQp76UppaUI76UIpaWlEGsQWkLvlObvQual5jGltTHFvebva+ZCzjFChDEQzjEQhDFzEIxC7xBCpRAQ7xAQpRDvzoTvWoTvlISlEIxC7zFCpTEQ7zEQpTFrWoSlhJQQGTrO9+aMrZxrjHPF3u8QKRC91q1CWkL33u/W9/8IGQjO1q29taVKSlohGQj39+Z7jHPv3tYZCACElHPe3ve1rZwpKRDF3tatpZStrZQIGSHv995rc3ucpZTv9+8hGRl7c2tjc2vO3s73//f/7/8ACABKQkLW3tYxQkLv7/drlNeeAAAAAXRSTlMAQObYZgAANjRJREFUeF7tfc1vI7uWn1hkl0jLRYpdpEq0WlUXg0lwk8EzMKsgu/xT2 trực Hội đồng Bảo an Liên hợp quốc (2008-2009) là mốc khởi đầu quá trình hội nhập quốc tế của Việt Nam.","ok":false},{"t":"Đoạn tư liệu đề cập đến những hoạt động và đóng góp tích cực của Việt Nam đối với tổ chức Liên hợp quốc.","ok":true},{"t":"Để tối ưu hóa nguồn lực và thể hiện cam kết đối với các mục tiêu phát triển bền vững, Việt Nam là quốc gia dân tiên đã có Một ngôi nhà xanh chung của Liên hợp quốc.","ok":true}],"table":[["TT","Thời gian","Nội dung chính"],["1","1996-1998","- Một trong những nước đầu tiên ký Hiệp ước Cấm thử hạt nhân toàn diện. - Thành viên chính thức của Công ước Cấm vũ khí hóa học."],["2","2008-2009","Ủy viên không thường trực của Hội đồng Bảo an Liên hợp quốc."],["3","2012-2015","Là nước đầu tiên có Một ngôi nhà xanh chung của Liên hợp quốc."],["4","2014-2016","- Việt Nam bắt đầu cử lực lượng tham gia các hoạt động giữ gìn hòa bình Liên hợp quốc. - Thành viên của Hội đồng Nhân quyền."],["5","2020-2021","- Hoàn thành xuất sắc vai trò Ủy viên không thường trực của Hội đồng Bảo an Liên hợp quốc. - Liên hợp quốc thông qua Ngày Quốc tế chống dịch bệnh 27/12 do Việt Nam đề xuất."]],"id":"b1-92"},{"lesson":1,"part":2,"num":93,"stem":"Cho đoạn tư liệu: “4. Tất cả các quốc gia thành viên Liên hợp quốc từ bỏ đe doạ vũ lực hoặc sử dụng vũ lực trong quan hệ quốc tế nhằm chống lại sự bất khả xâm phạm về lãnh thổ hay nền độc lập chính trị của bất kì quốc gia nào cũng như bằng cách khác trái với những mục đích của Liên hợp quốc 5. Tất cả các thành viên của Liên hợp quốc giải quyết các tranh chấp quốc tế của họ bằng biện pháp hoà bình, sao cho không tồn hại đến hoà bình, an ninh quốc tế và công lí\". (Hiến chương Liên Hợp Quốc, Điều 2)","stmts":[{"t":"Để giảm chi phí quân sự cho các nước đang phát triển, Hiến chương Liên hợp quốc yêu cầu các quốc gia từ bỏ việc sử dụng vũ lực và đe dọa sử dụng vũ lực.","ok":false},{"t":"Đoạn tư liệu trên đề cập đến mục tiêu và nguyên tắc hoạt động của Liên hợp quốc.","ok":false},{"t":"Nguyên tắc “giải quyết các tranh chấp quốc tế bằng biện pháp hoà bình” của Liên hợp quốc là cơ sở quan trọng để Việt Nam bảo vệ chủ quyền trên Biển Đông.","ok":true},{"t":"Việc từ bỏ đe doạ vũ lực hoặc sử dụng vũ lực của các quốc gia thành viên Liên hợp quốc đã trở thành cơ sở pháp lý để chống lại hành vi áp đặt, xâm lược.","ok":true}],"id":"b1-93"},{"lesson":1,"part":2,"num":94,"stem":"Cho những thông tin trong bảng sau đây:","stmts":[{"t":"Để giúp các nước khôi phục kinh tế sau Chiến tranh, Hội nghị Tê-hê-ran năm 1943 đã đặt ra việc thành lập tổ chức Liên hợp quốc.","ok":false},{"t":"Việc Việt Nam gia nhập Liên hợp quốc năm 1977 đã phản ánh đường lối hội nhập quốc tế sâu rộng của Đảng Cộng sản Việt Nam.","ok":true},{"t":"Bảng thông tin thể hiện quá trình hình thành và phát triển của tổ chức quốc tế đầu tiên.","ok":false},{"t":"Sự ra đời của Liên hợp quốc năm 1945 là nỗ lực của toàn thể nhân loại tiến bộ trên thế giới để duy trì hòa bình và an ninh thế giới.","ok":true}],"imgs":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAnAAAAB7CAMAAADDlU17AAADAFBMVEUAAAD////Ozs4AAAA6OjpKSkpCQkLW1tbFxcX39/fv7+9jY1re5t7e3tatra2lpaUICAhrc2sZISGEe3uMhIxSWlprY2uUlJQpKSkZEBBKUkq1tb1ze3O1tbWcnJwxKTGlUubmzrWljEKlGeZzUuZzjEJzGealUrWljBClGbVzUrVzjBBzGbWlUhBCUr2lGRBCGb1zUhAQUr1zGRAQGb2M76WMxaVSzuZShOYZzuYZhObeQrUQGZRCGWsZUmsQGWtCzmNChGMQzmMQhGMZCDpS76VSpaUZ76UZpaWlUkJCUu+ljHOlGUJCGe9zUkIQUu9zGUIQGe+t796tjO+E796EjO+txd6tjMWExd6EjMVS7+ZSpeYpUhkZ7+YZpeYIUhkZUkJC72NKUoRCpWMQ72MQpWOtWntKWiGlvRBzvRC13qXe9xnvGYzvGTrvGWPvGRBKEBnOGYzOGTrOGWPOGRDvxeal7xBz7xClEGtCzhBChBBzEGsQzhAQhBDe963e90qlvTFzvTGlvXPva+bvEOZzvXPva7XvELXe93ulvVLOa+bOEOZzvVLOa7XOELXvzozvWozvWjrvzjrvlIzvlDrvzmPvWmPvWhDvzhDvlGPvlBBSzrVShLUZzrUZhLXOzozOWozOWjrOzjrOlIzOlDrOzmPOWmPOWhDOzhDOlGPOlBBSzpRShJQZzpQZhJRKMRmMWmul73PvnObvQual7zFCKZRz7zEpUpRz73PvnLWlEIxCzjFChDFzEIwQzjEQhDGthJylMWtC7xBCpRBzMWsQ7xAQpRCl71LOnObOQuZCCJQIUpRz71LOnLUZKUJrlHOMWoylMYxC7zFCpTFKGUpzMYwQ7zEQpTFrWoTW9957nJzOveYQKQh7e5zO3u8xKRCElHP39961tZwhCADF1rVKSlre9//OvbXv3u/O3rVrUlqtrZTv5vc6KULFva3v99atpZ AAAABJRU5ErkJggg=="],"id":"b1-94"},{"lesson":1,"part":2,"num":95,"stem":"Đọc đoạn tư liệu sau: “Hội đồng Bảo an gồm có 5 thành viên thường trực và 10 thành viên không thường trực, trong đó 5 thành viên được Đại Hội đồng bầu hàng năm với nhiệm kỳ hai năm. Trung Quốc, Pháp, Liên bang Nga, Anh và Hoa Kỳ là các thành viên thường trực. Khi bầu các thành viên không thường trực cho Hội đồng Bảo an, Hiến chương yêu cầu Đại Hội đồng phải chú ý trước hết đến đóng góp của các thành viên Liên hợp quốc cho việc duy trì hòa bình và an ninh quốc tế, và chú ý đến các mục đích khác của tổ chức và việc phân bố địa lý công bằng. Các thành viên mãn nhiệm không được bầu lại ngay lập tức”. (Trần Thanh Hải. (2001). Cơ cấu tổ chức của Liên hợp quốc. Nhà xuất bản Chính trị Quốc gia, tr. 60.)","stmts":[{"t":"Số thành viên của Hội đồng Bảo an Liên hợp quốc luôn có sự thay đổi chủ yếu do sự thay đổi nhanh chóng của tình hình thế giới và quan hệ quốc tế.","ok":false},{"t":"Những thành viên có đóng góp cho việc duy trì hoà bình và an ninh quốc tế có cơ hội được bầu vào Hội đồng Bảo an Liên hợp quốc.","ok":true},{"t":"Đoạn tư liệu trên phản ánh đầy đủ cơ cấu tổ chức, nguyên tắc hoạt động của Liên hợp quốc.","ok":false},{"t":"Hội đồng Bảo an Liên hợp quốc là cơ quan chuyên môn, thường trực của Liên hợp quốc.","ok":false}],"id":"b1-95"},{"lesson":1,"part":2,"num":96,"stem":"Cho đoạn tư liệu sau đây: Đối với Liên hợp quốc: “Các hoạt động gìn giữ hòa bình đa chiều ngày nay không chỉ được kêu gọi để duy trì hòa bình và an ninh mà còn tạo điều kiện cho các tiến trình chính trị, bảo vệ dân thường, hỗ trợ giải trừ quân bị, giải ngũ và tái hòa nhập cho những người từng tham chiến; hỗ trợ các tiến trình hiến pháp và tổ chức bầu cử, bảo vệ và thúc đẩy nhân quyền và hỗ trợ khôi phục pháp quyền và mở rộng quyền lực nhà nước hợp pháp.” (Duy trì hòa bình và an ninh quốc tế, trang thông tin điện tử Liên hợp quốc, https://www.un.org/en/our-work)","stmts":[{"t":"Thông qua qua các hoạt động gìn giữ hòa bình hiện nay, Liên hợp quốc đã thay thế vai trò của chính phủ tại các nước xung đột.","ok":false},{"t":"Sự mở rộng các hoạt động gìn giữ hòa bình là cơ sở để Liên hợp quốc từng bước can thiệp vào công việc nội bộ của các quốc gia.","ok":false},{"t":"Đoạn tư liệu trên đề cập đến mục tiêu và nguyên tắc hoạt động của Liên hợp quốc.","ok":false},{"t":"Việc kết hợp yếu tố nhân quyền giúp hoạt động gìn giữ hòa bình của Liên hợp quốc mang tính nhân đạo và bền vững hơn.","ok":true}],"id":"b1-96"},{"lesson":1,"part":2,"num":97,"stem":"Cho đoạn tư liệu sau đây: “Ai cũng được hưởng những quyền tự do ghi trong bản Tuyên ngôn này không phân biệt đối xử vì bất cứ lý do nào, như chúng tộc, màu da, nam nữ, ngôn ngữ, tôn giáo, chính kiến hay quan niệm, nguồn gốc dân tộc hay xã hội, tài sản, dòng dõi hay bất cứ thân trạng nào khác. Ngoài ra không được phân biệt về quy chế chính trị, pháp lý hay quốc tế của quốc gia hay lãnh thổ mà người đó trực thuộc, dù là nước độc lập, bị giám hộ, mất chủ quyền hay bị hạn chế chủ quyền,” (Liên hợp quốc. (1948). Tuyên ngôn Quốc tế Nhân quyền, Điều 2.)","stmts":[{"t":"Tuyên ngôn Quốc tế Nhân quyền của Liên hợp quốc công bố đã trở thành cơ sở pháp lí để đấu tranh chống và lật đổ được chế độ phân biệt chủng tộc trên thế giới.","ok":false},{"t":"Theo Tuyên ngôn Quốc tế Nhân quyền, “chủng tộc, màu da, nam nữ, ngôn ngữ, tôn giáo\" không phải là căn cứ để phân biệt quyền con người.","ok":true},{"t":"Tuyên ngôn Quốc tế Nhân quyền là một trong những văn kiện pháp lí quan trọng của Liên hợp quốc, được thông qua đồng thời với Hiến chương.","ok":false},{"t":"Đoạn tư liệu đề cập đến vai trò đảm bảo quyền con người của Liên hợp quốc.","ok":true}],"id":"b1-97"},{"lesson":2,"part":1,"num":1,"stem":"Một trong những vấn đề cấp bách đặt ra đối với các cường quốc Liên Xô, Mỹ, Anh vào đầu năm 1945 là","opts":["tổ chức lại thế giới sau chiến tranh.","phân chia hệ thống thuộc địa ở châu Phi.","giải trừ hoàn toàn chủ nghĩa thực dân.","thành lập khối đồng minh chống phát xít."],"ans":0,"id":"b2-1"},{"lesson":2,"part":1,"num":2,"stem":"Nội dung nào sau đây không phải là vấn đề cấp bách đặt ra đối với các cường quốc Liên Xô, Mĩ, Anh vào đầu năm 1945?","opts":["Mở rộng hệ thống thuộc địa ở châu Á.","Tổ chức lại trật tự thế giới sau chiến tranh.","Nhanh chóng đánh bại hoàn toàn phát xít.","Phân chia thành quả chiến thắng."],"ans":0,"id":"b2-2"},{"lesson":2,"part":1,"num":3,"stem":"Nội dung nào sau đây không phải là nhiệm vụ cấp bách đặt ra cho các nước Đồng minh đầu năm 1945?","opts":["Nhanh chóng kết thúc Chiến tranh thế giới thứ hai.","Phân chia thành quả chiến thắng với nhau.","Nhanh chóng phát triển cách mạng khoa học – kĩ thuật.","Tổ chức lại trật tự thế giới sau chiến tranh."],"ans":2,"id":"b2-3"},{"lesson":2,"part":1,"num":4,"stem":"Hội nghị I-an-ta diễn ra trong bối cảnh lịch sử nào sau đây?","opts":["Phe phát xít đã bị đánh bại hoàn toàn trên tất cả các mặt trận.","Nhân dân thế giới đang gánh chịu hậu quả nặng nề của chiến tranh.","Hệ thống xã hội chủ nghĩa đã được xác lập trên toàn thế giới.","Phe Đồng minh bắt đầu chuyển sang phản công trên các mặt trận."],"ans":1,"id":"b2-4"},{"lesson":2,"part":1,"num":5,"stem":"Hội nghị Ianta (tháng 2/1945) diễn ra trong hoàn cảnh nào sau đây?","opts":["Phe Đồng minh đang giành nhiều thắng lợi trên các chiến trường.","Các nước phát xít bắt đầu liên kết với nhau để phân chia thế giới.","Nhân dân thế giới đã khắc phục được hoàn toàn hậu quả chiến tranh.","Trật tự thế giới hai cực Ianta bắt đầu bước vào giai đoạn xói mòn."],"ans":0,"id":"b2-5"},{"lesson":2,"part":1,"num":6,"stem":"Yêu cầu bức thiết nào sau đây được đặt ra cho các nước Đồng minh khi cuộc Chiến tranh giới thứ hai (1939-1945) bước vào giai đoạn cuối?","opts":["Tiêu diệt hoàn toàn chủ nghĩa phát xít và tổ chức lại thế giới.","Thủ tiêu tất cả các hình thức của chế độ phân biệt chủng tộc.","Thành lập tổ chức Hội Quốc liên để ngăn chặn chiến tranh.","Tạo điều kiện để xu thế toàn cầu hóa được ra đời và phát triển."],"ans":0,"id":"b2-6"},{"lesson": được mâu thuẫn về vấn đề thị trường giữa các cường quốc.","Tạo nên trật tự thế giới mới theo hướng xu thế đa cực, đa trung tâm.","Làm thay đổi sâu sắc quan hệ quốc tế, đặc biệt là quan hệ giữa Liên Xô - Mỹ.","Tạo nên khuôn khổ của trật tự thế giới mới: trật tự nhất siêu, nhiều cường."],"ans":2,"id":"b2-30"},{"lesson":2,"part":1,"num":31,"stem":"Quyết định nào sau đây của Hội nghị Ianta (2 – 1945) là một trong những nhân tố trực tiếp đưa đến sự phân chia hai cực trong quan hệ quốc tế sau Chiến tranh thế giới thứ hai?","opts":["Thành lập tổ chức Liên hợp quốc để duy trì hoà bình, an ninh quốc tế.","Thoả thuận việc phân chia phạm vi ảnh hưởng giữa các nước ở châu Âu và châu Á.","Liên Xô sẽ tham gia chống Nhật ở châu Á sau khi chiến tranh kết thúc ở châu Âu.","Tiêu diệt tận gốc chủ nghĩa phát xít Đức và chủ nghĩa quân phiệt Nhật."],"ans":1,"id":"b2-31"},{"lesson":2,"part":1,"num":32,"stem":"Theo quyết định của Hội nghị Ianta (2-1945), quốc gia nào cần trở thành một quốc gia thống nhất và dân chủ?","opts":["Trung Quốc.","Ấn Độ.","Liên Xô.","Pháp."],"ans":0,"id":"b2-32"},{"lesson":2,"part":1,"num":33,"stem":"Nội dung nào gây tranh cãi nhiều nhất giữa các nước cường quốc Liên Xô, Mĩ, Anh tại Hội nghị Ianta (tháng 2/1945)?","opts":["Tiêu diệt tận gốc chủ nghĩa phát xít Đức và chủ nghĩa quân phiệt Nhật.","Thành lập tổ chức Liên Hợp Quốc để duy trì hòa bình và an ninh thế giới.","Thống nhất sử dụng vũ khí hạt nhân để tiêu diệt tận gốc chủ nghĩa phát xít.","Thỏa thuận việc phân chia phạm vi ảnh hưởng tại châu Âu và châu Á."],"ans":3,"id":"b2-33"},{"lesson":2,"part":1,"num":34,"stem":"Những quyết định của Hội nghị I-an-ta cùng những thỏa thuận của Liên Xô, Mỹ, Anh ở Hội nghị Pốt-xđam (1945) đã trở thành khuôn khổ của một trật tự thế giới mới, vì","opts":["các nước tham chiến được hưởng nhiều quyền lợi sau chiến tranh thế giới.","đã phân chia xong phạm vi ảnh hưởng giữa các nước thắng trận.","khép lại trật tự thế giới cũ và xác lập trật tự thế giới “hai cực” đối lập.","mở đầu quá trình giải thể của chủ nghĩa thực dân mới ở các nước thuộc địa."],"ans":1,"id":"b2-34"},{"lesson":2,"part":1,"num":35,"stem":"Năm 1945, quyết định của hội nghị nào sau đây góp phần tạo ra khuôn khổ của trật tự thế giới mới sau Chiến tranh thế giới thứ hai?","opts":["Hội nghị Giơ-ne-vơ.","Hội nghị Pa-ri.","Hội nghị I-an-ta.","Hội nghị Ba-li."],"ans":2,"id":"b2-35"},{"lesson":2,"part":1,"num":36,"stem":"Hội nghị Ianta (2/1945) thỏa thuận việc phân chia phạm vi ảnh hưởng của ba cường quốc chủ yếu ở khu vực nào sau đây?","opts":["Châu Âu, Châu Mĩ.","Châu Á, Châu Phi.","Châu Á, Châu Âu.","Châu Á, châu Mĩ."],"ans":2,"id":"b2-36"},{"lesson":2,"part":1,"num":37,"stem":"Quyết định nào sau đây của Hội nghị I-an-ta (2-1945) tạo nên những bất lợi cho cách mạng Việt Nam trong những năm 1945 - 1946?","opts":["Liên Xô có phạm vi ảnh hưởng và kiểm soát ở các nước Đông Dương.","Quân Anh cùng với quân Pháp làm nhiệm vụ giải giáp quân đội Nhật.","Đông Nam Á vẫn thuộc phạm vi ảnh hướng của các nước phương Tây.","Quân Anh và quân Trung Hoa Dân quốc vào kiểm soát Đông Dương."],"ans":2,"id":"b2-37"},{"lesson":2,"part":1,"num":38,"stem":"Nhận định nào sau đây là không đúng về Hội nghị Ianta (tháng 2/1945)?","opts":["Hội nghị diễn ra trong một thời gian dài, đầy căng thẳng.","Có ảnh hưởng đến vấn đề hòa bình sau chiến tranh.","Vi phạm quyền tự quyết của nhiều quốc gia, dân tộc.","Phản ánh tham vọng và thực lực giữa các cường quốc."],"ans":0,"id":"b2-38"},{"lesson":2,"part":1,"num":39,"stem":"Trong hội nghị Ianta (2/1945), Liên Xô, Mĩ, Anh đã thống nhất","opts":["mục tiêu chung là tiêu diệt hoàn toàn chủ nghĩa phát xít.","viện trợ cho các nước đồng minh khắc phục hậu quả chiến tranh.","không can thiệp vào việc kết thúc chiến tranh ở các nước.","đàn áp phong trào giải phóng dân tộc ở Á – Phi – Mĩ Latinh."],"ans":0,"id":"b2-39"},{"lesson":2,"part":1,"num":40,"stem":"Mục tiêu chung được các cường quốc thỏa thuận trong hội nghị 1-an-ta (2-1945) là","opts":["tiêu diệt tận gốc phát xít Đức và chủ nghĩa quân phiệt Nhật Bản.","thủ tiêu chủ nghĩa thực dân và chủ nghĩa phân biệt chủng tộc.","chấm dứt tình trạng nội chiến ở Trung Quốc, Áo và Phần Lan.","xây dựng nước Đức trở thành quốc gia thống nhất và dân chủ."],"ans":0,"id":"b2-40"},{"lesson":2,"part":1,"num":41,"stem":"Trong tiến trình Chiến tranh thế giới thứ hai (1939-1945), Liên Xô có thể khôi phục được những quyền lợi đã mất của nước Nga trong cuộc chiến tranh Nga-Nhật (1904 – 1905) vì một trong những lí do nào sau đây?","opts":["Nhân nhượng hoàn toàn lợi ích cho Mĩ ở châu Âu.","Chấp nhận tham gia chống Nhật khi chiến tranh kết thúc.","Đảm bảo chia sẻ nghĩa vụ với Đồng minh ở Châu Á.","Phối hợp cùng Mỹ tiêu diệt phát xít Italia ở Bắc Phi."],"ans":2,"id":"b2-41"},{"lesson":2,"part":1,"num":42,"stem":"Nhận định nào sau đây về Hội nghị Ianta (2/1945) là đúng và đầy đủ?","opts":["Đưa tới những tác động có tính chất hai mặt.","Đưa đến sự chia cắt lãnh thổ ở một số nước.","Tạo điều kiện cho nhiều nước giành độc lập.","Khởi đầu sự thay đổi quan hệ giữa Mĩ và Xô."],"ans":0,"id":"b2-42"},{"lesson":2,"part":1,"num":43,"stem":"Nhận xét nào sau đây là đúng về việc thỏa thuận đóng quân và phân chia phạm vi ảnh hưởng giữa các cường quốc trong Hội nghị I-an-ta (2-1945)?","opts":["Không phản ánh tham vọng và thực lực giữa Mĩ và Liên Xô.","Hướng đến mục tiêu triệt tiêu sức mạnh của các nước tư bản.","Thực chất là sự phân chia quyền lợi giữa Mĩ và Liên Xô.","Bản chất việc thoả thuận là để tiêu diệt chủ nghĩa thực dân."],"ans":2,"id":"b2-43"},{"lesson":2,"part":1,"num":44,"stem":"Trật tự thế giới hai cực I-an-ta được hình thành bắt nguồn từ những quyết định của","opts":["\"Hội nghị tam cường\" và Hội nghị Pốt-xđam (1945).","Liên Xô và Mỹ ở Hội nghị Xan Phran-xi-xcô (1945).","Hội nghị Tê-hê-ran (1943) và Hội nghị I-an-ta (1945).","Liên Xô, Mỹ, Anh trong Hội nghị Tê-hê-ran (1943)."],"ans":0,"id":"b2-44"},{"lesson":2,"part":1,"num":45,"stem":"Nhận xét nào sau đây là đúng về vị thế của các cường quốc trong trật tự thế giới hai cực I-an-ta (1945-1991)?","opts":["Mĩ giữ vai trò quyết định chi phối mọi mối quan hệ quốc tế.","Anh không còn giữ được vai trò quốc tế như giai đoạn trước.","Nhật Bản vươn lên trở thành một cường quốc về chính trị.","Liên Xô đã có lợi thế khi được phân chia các vùng thuộc địa"],"ans":1,"id":"b2-45"},{"lesson":2,"part":1,"num":46,"stem":"Nhận xét nào sau đây phản ánh đúng về quan hệ quốc tế trong thời kỳ Chiến tranh lạnh?","opts":["Hai phe đế quốc đẩy mạnh cuộc chạy đua vũ trang gay gắt.","Không diễn ra bất kì cuộc xung đột quân sự giữa hai phe.","Hòa bình, hợp tác là xu thế chủ đạo chi phối quan hệ quốc tế.","Phản ánh xu thế vừa hợp tác, vừa đấu tranh giữa các quốc gia."],"ans":3,"id":"b2-46"},{"lesson":2,"part":1,"num":47,"stem":"Trật tự thế giới hai cực I – an – ta được xác lập sau Chiến tranh thế giới thế giới thứ hai khẳng định vị thế hàng đầu của hai cường quốc nào sau đây?","opts":["Liên Xô và Mỹ.","Anh và Pháp.","Mỹ và Anh.","Liên Xô và Anh."],"ans":0,"id":"b2-47"},{"lesson":2,"part":1,"num":48,"stem":"Nội dung nào sau đây là nhân tố hàng đầu chi phối toàn bộ đời sống chính trị thế giới trong phần lớn thời gian nửa sau thế kỉ XX?","opts":["Các cuộc “chiến tranh nóng\" ở châu Á liên tiếp diễn ra không có hồi kết.","Hai hệ thống xã hội đối lập ra đời: tư bản chủ nghĩa và xã hội chủ nghĩa.","Cục diện trật tự hai cực, hai phe: tư bản chủ nghĩa và xã hội chủ nghĩa.","Xu hướng liên kết khu vực và xu thế toàn cầu hoá đang diễn ra mạnh mẽ."],"ans":2,"id":"b2-48"},{"lesson":2,"part":1,"num":49,"stem":"Quá trình hình thành và tồn tại của Trật tự hai cực Ianta có đặc điểm nào sau đây?","opts":["Chỉ thể hiện sự phá hoại của nghĩa nghĩa đế quốc.","Có sự thỏa hiệp giữa các cường quốc vì lợi ích quốc gia.","Chịu sự tác động, chi phối trực tiếp của Liên hợp quốc.","Là hệ quả trực tiếp của xu thế hoà hoãn Đông - Tây."],"ans":1,"id":"b2-49"},{"lesson":2,"part":1,"num":50,"stem":"Nhận định nào sau đây là đúng về quan hệ quốc tế trong thời kì Chiến tranh lạnh?","opts":["Chịu sự chi phối, tác động trực tiếp của trật tự thế giới đa cực, nhiều trung tâm.","Các nước vừa hợp tác, vừa đấu tranh trong bối cảnh thế giới đầy biến động.","Liên Xô và Mỹ từ hậu thuẫn đến xung đột quân sự trực tiếp ở Đông Dương.","Các quốc gia cùng tồn tại, hợp tác và cạnh tranh theo sự sắp đặt của Liên hợp quốc."],"ans":1,"id":"b2-50"},{"lesson":2,"part":1,"num":51,"stem":"Nội dung nào sau đây góp phần duy trì sự ổn định tương đối của Trật tự thế giới hai cực Ianta trong nửa sau thế kỉ XX?","opts":["Sự thống nhất về mục tiêu và chiến lược của hai phe.","Có sự cân bằng sức mạnh tương đối giữa hai phe, hai cực.","Sự hợp tác chiến lược giữa hai hệ thống chính trí đối lập.","Sự cân bằng trong lợi ích giữa hai cực, hai phe đế quốc."],"ans":1,"id":"b2-51"},{"lesson":2,"part":1,"num":52,"stem":"Trong giai đoạn từ năm 1945 đến đầu những năm 70 của thế kỉ XX, Trật tự thế giới hai cực I-an-ta có biểu hiện nào sau đây?","opts":["Phát triển mạnh và đưa đến xung đột quân sự trực tiếp giữa Liên Xô - Mỹ.","Xác lập và phát triển nhanh với sự đối đầu diễn ra trên nhiều lĩnh vực.","Từ đối đầu căng thẳng chuyển sang hoà dịu và hoà hoãn Đông - Tây.","Mĩ và Trung Quốc là hai cường quốc nắm quyền chi phối quan hệ quốc tế."],"ans":1,"id":"b2-52"},{"lesson":2,"part":1,"num":53,"stem":"Sự kiện nào sau đây có ý nghĩa mở ra bước đột phá đầu tiên, góp phần làm xói mòn trật tự thế giới hai cực I-an-ta?","opts":["Cách mạng Trung Quốc giành thắng lợi (1949).","Cách mạng tháng Tám ở Việt Nam (8/1945).","Chế độ độc tài thân Mỹ thất bại ở Cuba (1959).","Anh, Pháp rút quân khỏi kênh đào Xuy-ê (1956)."],"ans":0,"id":"b2-53"},{"lesson":2,"part":1,"num":54,"stem":"Sự kiện nào sau đây tạo ra sự đối lập về kinh tế - chính trị giữa Tây Âu và Đông Âu sau Chiến tranh thế giới thứ hai?","opts":["Mỹ viện trợ các nước Tây Âu qua “Kế hoạch Mác-san\".","Sự thành lập của tổ chức NATO và Hiệp ước Vác-sa-va.","Thông điệp của Tổng thống Mĩ Truman trước Quốc hội.","Liên Xô và các nước Đông Âu thành lập khối SEATO."],"ans":0,"id":"b2-54"},{"lesson":2,"part":1,"num":55,"stem":"Từ sau Chiến tranh thế giới thứ hai đến nửa đầu những năm 70 của thế kỷ XX, quan hệ giữa Mỹ và Liên Xô là","opts":["đối tác.","đối đầu.","hợp tác.","đồng minh."],"ans":1,"id":"b2-55"},{"lesson":2,"part":1,"num":56,"stem":"Sự ra đời của khối NATO (1949) và Vác-xa-va (1955) là một trong những biểu hiện rõ rệt về sự đối đầu trong Trật tự thế giới hai cực I-an-ta trên lĩnh vực nào sau đây?","opts":["Văn hoá.","Quân sự.","Kinh tế.","Giáo dục."],"ans":1,"id":"b2-56"},{"lesson":2,"part":1,"num":57,"stem":"Trong giai đoạn từ những năm 70 của thế kỉ XX đến năm 1991, trật tự thế giới hai cực I-an- ta có biểu hiện nào sau đây?","opts":["Các cuộc chiến tranh cục bộ chỉ diễn ra chủ yếu ở khu vực Mỹ La-tinh.","Đi từ xu thế hòa hoãn Đông-Tây đến đối thoại và chấm dứt sự đối đầu.","Các nước Tây Âu và Đông Âu bắt đầu có sự đối lập về chính trị - kinh tế.","Quân đội Mỹ và Liên Xô trực tiếp tham chiến ở Triều Tiên và Việt Nam."],"ans":1,"id":"b2-57"},{"lesson":2,"part":1,"num":58,"stem":"Đầu những năm 70 của thế kỉ XX, trật tự hai cực I-an-ta đã bước đầu suy yếu với một trong những biểu hiện nổi bật nào sau đây?","opts":["Liên Xô và Mỹ thỏa thuận hạn chế vũ khí chiến lược.","Liên Xô và Mỹ tuyên bố chấm dứt chiến tranh lạnh.","Liên Xô thành lập tổ chức Hiệp ước Vác – sa – va.","Mỹ thành lập tổ chức Hiệp ước Bắc Đại Tây Dương."],"ans":0,"id":"b2-58"},{"lesson":2,"part":1,"num":59,"stem":"Yếu tố quyết định dẫn tới sự xuất hiện xu thế hòa hoãn Đông - Tây trong quan hệ quốc tế từ đầu những năm 70 của thế kỷ XX?","opts":["Yêu cầu hợp tác giải quyết các vấn đề toàn cầu.","Sự thay đổi tích cực trong quan hệ giữa Liên Xô và Mĩ.","Mĩ, Canađa, 33 nước Châu Âu ký định ước Henxinki.","Liên Xô và Mỹ tuyên bố chấm dứt chiến tranh lạnh."],"ans":1,"id":"b2-59"},{"lesson":2,"part":1,"num":60,"stem":"Trong thời gian tồn tại của trật tự thế giới hai cực, hai phe, sự kiện nào sau đây của Việt Nam không chịu sự tác động của xu thế hòà hoãn Đông - Tây?","opts":["Giải quyết vấn đề Cam-pu-chia.","Công cuộc Đổi mới đất nước.","Gia nhập tổ chức Thương mại quốc tế.","Đàm phán và kí kết Hiệp định Pa-ri."],"ans":2,"id":"b2-60"},{"lesson":2,"part":1,"num":61,"stem":"Một trong những biểu hiện của xu thế hoà hoãn Đông - Tây trong quan hệ quốc tế những năm 70 của thế kỉ XX là","opts":["sự vươn lên mạnh mẽ của Nhật Bản từ năm 1960.","các cuộc gặp gỡ cấp cao Xô - Mỹ năm 1972.","cách mạng Trung Quốc thắng lợi năm 1949.","khủng hoảng năng lượng, dầu mỏ năm 1973."],"ans":1,"id":"b2-61"},{"lesson":2,"part":1,"num":62,"stem":"Từ những năm 70 của thế kỉ XX, sự xuất hiện xu thế nào sau đây góp phần làm suy yếu Trật tự hai cực I-an-ta?","opts":["Xu thế công nghiệp hóa.","Xu thế đa cực.","Xu thế đa quốc gia.","Xu thế hòa hoãn Đông Tây."],"ans":3,"id":"b2-62"},{"lesson":2,"part":1,"num":63,"stem":"Từ đầu những năm 70 của thế kỉ XX, quan hệ Mỹ - Liên Xô chuyển dần sang hòa dịu, sau đó kết thúc Chiến tranh lạnh (1989) là do","opts":["trật tự nhất siêu, nhiều cường đang trong quá trình mở rộng.","chịu nhiều tốn kém và bị suy giảm thế mạnh về nhiều mặt.","xu thế liên kết khu vực và toàn cầu hóa diễn ra mạnh mẽ.","quá trình mở rộng không ngừng của Liên minh châu Âu (EU)."],"ans":1,"id":"b2-63"},{"lesson":2,"part":1,"num":64,"stem":"Kết quả cuối cùng của sự đối đầu căng thẳng giữa Mỹ và Liên Xô sau Chiến tranh thế giới thứ hai là đã dẫn đến","opts":["trật tự thế giới đơn cực xác lập.","cuộc chiến tranh thế giới mới.","trật tự thế giới lưỡng cực tan rã.","các cuộc xung đột trực tiếp."],"ans":2,"id":"b2-64"},{"lesson":2,"part":1,"num":65,"stem":"Tháng 12-1989, tại đảo Manta, Tổng thống Mĩ và Tổng bí thư Đảng Cộng sản Liên Xô đã cùng tuyên bố","opts":["chấm dứt Chiến tranh lạnh.","không phổ biến vũ khí hạt nhân.","cắt giảm vũ khí chiến lược.","bình thường hóa quan hệ."],"ans":0,"id":"b2-65"},{"lesson":2,"part":1,"num":66,"stem":"Nhận xét nào sau đây là đúng về đặc điểm nổi bật của quan hệ quốc tế từ đầu những năm 70 của thế kỷ XX đến năm 1991?","opts":["Đối thoại hòa bình là xu thế chủ đạo.","Đối đầu và chiến tranh gay gắt.","Vừa đối đầu vừa đối thoại, hợp tác.","Liên minh giữa Mỹ và Liên Xô ra đời."],"ans":2,"id":"b2-66"},{"lesson":2,"part":1,"num":67,"stem":"Từ đầu những năm 70 của thế kỉ XX, tình hình quan hệ quốc tế đã có chuyển biến gì?","opts":["Tiếp tục đối đầu căng thẳng","Xu hướng hòa hoãn xuất hiện","Chuyển từ đối đầu sang đối thoại","Thiết lập quan hệ đồng minh"],"ans":1,"id":"b2-67"},{"lesson":2,"part":1,"num":68,"stem":"Sự kiện nào sau đây đánh dấu Trật tự hai cực I-an-ta hoàn toàn sụp đổ?","opts":["Bức tường Béc-lin sụp đổ (1989).","Chiến tranh lạnh kết thúc (1989).","Khủng hoảng năng lượng (1973).","Liên Xô chính thức tan rã (1991)."],"ans":3,"id":"b2-68"},{"lesson":2,"part":1,"num":69,"stem":"Những năm 70 của thế kỉ XX, thế giới xuất hiện xu thế nào sau đây ảnh hưởng đến sự tồn tại của trật tự hai cực Ianta?","opts":["Đa quốc gia.","Đơn cực.","Công nghiệp hoá.","Hoà hoãn Đông - Tây."],"ans":3,"id":"b2-69"},{"lesson":2,"part":1,"num":70,"stem":"Trong những năm 70 – 80 của thế kỉ XX, Liên Xô và Mỹ thỏa thuận hạn chế chạy đua vũ trang đã chứng tỏ","opts":["hai nước ngừng việc chế tạo bom nguyên tử.","phương tiện chiến tranh của hai nước đã lạc hậu.","sự điều chỉnh chiến lược đối ngoại của hai nước.","quá trình phi hạt nhân giữa hai nước bắt đầu."],"ans":2,"id":"b2-70"},{"lesson":2,"part":1,"num":71,"stem":"Trong thời kỳ Chiến tranh lạnh, hầu như mọi cuộc chiến tranh hoặc xung đột quân sự ở các khu vực trên thế giới đều","opts":["liên quan đến sự đối đầu giữa hai cực Liên Xô và Mỹ.","diễn ra căng thẳng, lâu dài và không phân thắng bại.","dẫn tới sự chia cắt lâu dài của mọi quốc gia trên thế giới.","giải quyết được những mâu thuẫn về xung đột sắc tộc."],"ans":0,"id":"b2-71"},{"lesson":2,"part":1,"num":72,"stem":"Sự kiện nào được xem là khởi đầu cho chính sách chống Liên Xô của Mỹ, gây nên cuộc Chiến tranh lạnh?","opts":["Thành lập Tổ chức quân sự NATO (4/1949).","Thông điệp Tổng thống Tơ-ru-man (3/1947).","Sự ra đời của kế hoạch Mác-san (6/1947).","Hội đồng tương trợ kinh tế ra đời (1/1949)."],"ans":1,"id":"b2-72"},{"lesson":2,"part":1,"num":73,"stem":"Nội dung nào không phản ánh đúng bản chất của Chiến tranh lạnh?","opts":["Do Mỹ phát động nhằm chống Liên Xô và các nước xã hội chủ nghĩa.","Thế giới đã bị chia thành hai phe tư bản chủ nghĩa và xã hội chủ nghĩa.","Là cuộc xung đột giữa các nước chống khủng bố và các nước khủng bố.","Đối đầu cùng thẳng giữa hai phe tư bản chủ nghĩa và xã hội chủ nghĩa."],"ans":2,"id":"b2-73"},{"lesson":2,"part":1,"num":74,"stem":"Việc Mỹ và Liên Xô chính thức cùng tuyên bố chấm dứt Chiến tranh lạnh (12-1989) không xuất phát từ","opts":["việc cả hai nước cần thoát khỏi thế “đối đầu” để ổn định và củng cố vị thể của mình.","sự tốn kém của mỗi nước do cuộc chạy đua vũ trang kéo dài hơn bốn thập niên.","sự suy giảm “thế mạnh” của hai nước trên nhiều mặt so với các cường quốc khác.","việc cả hai nước đều gặp khó khăn do tác động của phong trào giải phóng dân tộc."],"ans":3,"id":"b2-74"},{"lesson":2,"part":1,"num":75,"stem":"Nhân tố chủ yếu chi phối quan hệ quốc tế trong phần lớn nửa sau thế kỉ XX là","opts":["xu thế toàn cầu hóa.","sự ra đời các khối quân sự đối lập.","sự hình thành các liên minh kinh tế.","cục diện “Chiến tranh lạnh”."],"ans":3,"id":"b2-75"},{"lesson":2,"part":1,"num":76,"stem":"Sự ra đời của Tổ chức Hiệp ước Bắc Đại Tây Dương (NATO) năm 1949 và Tổ chức Hiệp ước Vác-sa- va năm 1955 là hệ quả trực tiếp của","opts":["các cuộc chiến tranh cục bộ trên thế giới.","chiến lược toàn cầu “Ngăn đe thực tế” của Mĩ.","xung đột vũ trang giữa Đông Âu và Tây Âu.","cuộc Chiến tranh lạnh do Mĩ phát động."],"ans":3,"id":"b2-76"},{"lesson":2,"part":1,"num":77,"stem":"Trong thời kỳ Chiến tranh lạnh, các cường quốc trên thế giới tập trung vào phát triển lĩnh vực nào để khẳng định sức mạnh?","opts":["Chính trị.","Giáo dục.","Quân sự.","Văn hóa."],"ans":2,"id":"b2-77"},{"lesson":2,"part":1,"num":78,"stem":"Nguyên nhân chủ yếu dẫn tới cục diện hai cực, hai phe sau Chiến tranh thế giới thứ hai là gì?","opts":["Ý muốn tiêu diệt Liên Xô của giới tư bản ở Mỹ để độc chiếm nguồn dầu mỏ.","Mâu thuẫn về vấn đề thị trường và thuộc địa của các nước tư bản chủ nghĩa.","Do sự đối lập về mục tiêu và chiến lược giữa hai cường quốc Liên Xô và Mỹ.","Trật tự thế giới có quá nhiều mâu thuẫn của các nước bại trận và thắng trận."],"ans":2,"id":"b2-78"},{"lesson":2,"part":1,"num":79,"stem":"Nhận xét nào sau đây là không đúng về Chiến tranh lạnh (1947–1991)?","opts":["Cuộc chạy đua vũ trang giữa hai nước lôi kéo nhiều nước tham gia.","Các cuộc chiến tranh cục bộ là sự xung đột trực tiếp của Xô và Mỹ.","Là cuộc chiến giữa hai phe mang tính đại diện, hết sức dai dẳng.","Các cường quốc trên thế giới vẫn giữ vai trò chi phối quan hệ quốc tế."],"ans":1,"id":"b2-79"},{"lesson":2,"part":1,"num":80,"stem":"Sự kiện nào sau đây diễn ra trong thời kì Chiến tranh lạnh?","opts":["Chiến tranh thế giới thứ hai bùng nổ và lan rộng.","Cộng đồng ASEAN chính thức được thành lập.","Tổ chức Hiệp ước Bắc Đại Tây Dương thành lập.","Phát xít Nhật tuyên bố đầu hàng Đồng minh."],"ans":2,"id":"b2-80"},{"lesson":2,"part":1,"num":81,"stem":"Sự kiện nào dưới đây được xem là sự kiện khởi đầu cuộc “Chiến tranh lạnh\"?","opts":["Đạo luật viện trợ nước ngoài của Quốc hội Mỹ.","Kế hoạch Macsan “Phục hưng Châu Âu”.","Thông điệp của Tổng thống Mỹ Truman.","Sự thành lập khối quân sự NATO."],"ans":2,"id":"b2-81"},{"lesson":2,"part":1,"num":82,"stem":"Trong Chiến tranh lạnh (1947-1989), vì sao Mỹ và Liên Xô tránh xung đột trực tiếp về quân sự?","opts":["Cả Mỹ và Liên Xô đều không đủ lực lượng chiến đấu.","Liên Xô đã khủng hoảng kinh tế, chính trị trầm trọng.","Ngăn ngừa nguy cơ nổ ra cuộc chiến tranh thế giới mới.","Sự phản đối chiến tranh của nhân dân Mỹ và Liên Xô."],"ans":2,"id":"b2-82"},{"lesson":2,"part":1,"num":83,"stem":"Nội dung nào sau đây là mục tiêu của Mỹ khi phát động Chiến tranh lạnh (1947)?","opts":["Chống lại Liên Xô và các nước Đông Âu.","Giúp đỡ phong trào cách mạng trên thế giới.","Thiết lập khối kinh tế ở các nước Đông Âu.","Chống lại các lực lượng khủng bố ở châu Âu."],"ans":0,"id":"b2-83"},{"lesson":2,"part":1,"num":84,"stem":"Sự kiện nào sau đây đánh dấu việc xác lập cục diện hai cực, hai phe và Chiến tranh lạnh bao trùm thế giới?","opts":["Cuộc Chiến tranh Triều Tiên bùng nổ và diễn ra mạnh mẽ.","Mỹ viện trợ các nước Tây Âu qua “Kế hoạch Mác-san\".","Sự thành lập của tổ chức NATO và Hiệp ước Vác-sa-va.","Liên Xô và các nước Đông Âu thành lập tổ chức SEV."],"ans":2,"id":"b2-84"},{"lesson":2,"part":1,"num":85,"stem":"Cuộc Chiến tranh lạnh do Mỹ phát động chống Liên Xô là cuộc chiến","opts":["giành thị trường quyết liệt giữa hai siêu cường Mỹ và Liên Xô.","có sự đối đầu trực tiếp giữa Liên minh châu Âu và ASEAN.","không hồi kết về quân sự và ý thức hệ giữa Mỹ và Liên Xô.","không tiếng súng nhưng đặt thế giới trong tình trạng căng thẳng."],"ans":3,"id":"b2-85"},{"lesson":2,"part":1,"num":86,"stem":"Nội dung nào sau đây là một trong những biểu hiện của Chiến tranh lạnh?","opts":["Mỹ phát triển trở thành một cực duy nhất.","Các cuộc chiến tranh cục bộ diễn ra ở nhiều nơi.","Trung Quốc và Liên Xô chạy đua vũ trang.","Trung Quốc và Mỹ trở thành hai cực lớn nhất."],"ans":1,"id":"b2-86"},{"lesson":2,"part":1,"num":87,"stem":"Cuộc Chiến tranh lạnh do Mỹ phát động (1947) nhằm chống lại Liên Xô và các nước xã hội chủ nghĩa được bắt nguồn từ","opts":["sự đối lập về mục tiêu, chiến lược phát triển giữa hai cường quốc.","tham vọng lớn của Mỹ trong việc độc quyền vũ khí nguyên tử.","khi Liên Xô và Mỹ phân chia ảnh hưởng trên bán đảo Triều Tiên.","khi Mỹ muốn gạt ảnh hưởng của Liên Xô ra khỏi Liên hợp quốc."],"ans":0,"id":"b2-87"},{"lesson":2,"part":1,"num":88,"stem":"Trong thời kỳ Chiến tranh lạnh, quốc gia nào ở châu Âu trở thành tâm điểm đối đầu giữa hai cực Xô - Mỹ?","opts":["Anh.","Hy Lạp.","Pháp.","Đức."],"ans":3,"id":"b2-88"},{"lesson":2,"part":1,"num":89,"stem":"Nội dung nào dưới đây không phải là nguyên nhân dẫn đến sự sụp đổ của Trật tự thế giới hai cực I-an- ta?","opts":["Sự phát triển của nền kinh tế Nhật Bản, Tây Âu.","Ảnh hưởng, tác động mạnh mẽ của trí tuệ nhân tạo.","Thắng lợi to lớn của phong trào giải phóng dân tộc.","Sự suy giảm thế mạnh của hai nước Liên Xô và Mỹ."],"ans":1,"id":"b2-89"},{"lesson":2,"part":1,"num":90,"stem":"Nội dung nào sau đây là nguyên nhân dẫn đến sụp đổ trật tự thế giới hai cực I-an-ta (1945-1991)?","opts":["Các thế lực phát xít liên tục cầm quyền ở các nước tư bản chủ nghĩa.","Sự tan rã từng phần của hệ thống tư bản chủ nghĩa ở các nước châu Âu.","Các nước xã hội chủ nghĩa đã trở thành trung tâm kinh tế hàng đầu thế giới.","Sự vươn lên của các nước trên thế giới nhằm thoát khỏi ảnh hưởng hai cực."],"ans":3,"id":"b2-90"},{"lesson":2,"part":1,"num":91,"stem":"Trật tự thế giới hai cực I-an-ta sụp đổ (1991) là do một trong những nguyên nhân nào sau đây?","opts":["Liên hợp quốc thành lập không cho phép các nước sản xuất vũ khí.","Quốc tế Cộng sản ra đời ảnh hưởng trực tiếp đến trật tự hai cực.","Chiến tranh thế giới kết thúc tạo điều kiên cho các nước phát triển.","Chay đua vũ trang khiến cả Mỹ và Liên Xô suy giảm thế mạnh."],"ans":3,"id":"b2-91"},{"lesson":2,"part":1,"num":92,"stem":"Nội dung nào sau đây phản ánh đúng nguyên nhân sụp đổ của Trật tự thế giới hai cực I- an-ta?","opts":["Tác động trực tiếp của xu thế cải cách, đổi mới trên thế giới.","Các nước đế quốc đã hoàn thành mục tiêu xâm lược thuộc địa.","Sự khủng hoảng, suy yếu, tan rã của Đông Âu và Liên Xô.","Mĩ và Liên Xô giải thể tất cả các tổ chức quân sự trên toàn cầu."],"ans":2,"id":"b2-92"},{"lesson":2,"part":1,"num":93,"stem":"Thắng lợi của phong trào giải phóng dân tộc trên thế giới và sự ra đời của hàng loạt các quốc gia độc lập sau Chiến tranh thế giới thứ hai đã","opts":["đánh dấu trật tự hai cực I-an-ta sụp đổ hoàn toàn.","làm sụp đổ hoàn toàn chế độ xã hội chủ nghĩa ở Liên Xô.","tăng cường phạm vi ảnh hưởng của Mĩ và Liên Xô.","góp phần làm suy yếu trật tự thế giới hai cực I-an-ta."],"ans":3,"id":"b2-93"},{"lesson":2,"part":1,"num":94,"stem":"Một trong những nguyên nhân dẫn đến sự sụp đổ của Trật tự thế giới hai cực lanta là do","opts":["hòa bình hợp tác đã trở thành xu thế phổ biến.","Liên Xô và Mỹ đã bị suy giảm về thế mạnh.","sự xuất hiện xu thế đa cực nhiều trung tâm.","mâu thuẫn Đông - Tây được giải quyết triệt để."],"ans":1,"id":"b2-94"},{"lesson":2,"part":1,"num":95,"stem":"Nội dung nào sau đây là yếu tố quyết định dẫn đến Trật tự thế giới hai cực I-an-ta sụp đổ?","opts":["Tác động của cuộc Cách mạng công nghiệp lần thứ ba.","Sự vươn lên mạnh mẽ của các nước và tổ chức quốc tế.","Liên Xô và Mỹ bị suy giảm vị thế do phải chạy đua vũ trang.","Các nước xã hội chủ nghĩa trên thế giới bị sụp đổ hoàn toàn."],"ans":2,"id":"b2-95"},{"lesson":2,"part":1,"num":96,"stem":"Nội dung nào sau đây không phản ánh đúng nguyên nhân sụp đổ của Trật tự hai cực I-an-ta?","opts":["Liên Xô lâm vào cuộc khủng hoảng nghiêm trọng.","Mỹ và Liên Xô bị suy giảm thế mạnh về kinh tế.","Sự ra đời của trật tự đa cực trong quan hệ quốc tế.","Sự vươn lên cạnh tranh của Tây Âu, Nhật Bản."],"ans":2,"id":"b2-96"},{"lesson":2,"part":1,"num":97,"stem":"Nội dung nào sau đây không phản ánh đúng tác động của sự sụp đổ Trật tự hai cực I-an-ta đến các quốc gia trên thế giới?","opts":["Đưa tới xu thế phát triển mới trong quan hệ quốc tế.","Tạo điều kiện cho các cường quốc mới nổi vươn lên.","Hình thành trật tự thế giới một cực, nhiều trung tâm.","Ảnh hưởng đến vấn đề dân tộc, tôn giáo ở nhiều nơi."],"ans":2,"id":"b2-97"},{"lesson":2,"part":1,"num":98,"stem":"Nội dung nào sau đây phản ánh đúng tác động của việc chấm dứt Chiến tranh lạnh (1991) đến tình hình thế giới?","opts":["Chấm dứt mọi các cuộc chạy đua vũ trang giữa các nước.","Giải thể tất cả các tổ chức chính trị - quân sự trên thế giới.","Tạo cơ sở xác lập trật tự thế giới mới theo xu hướng đa cực.","Quan hệ Xô - Mỹ từ đồng minh chuyển sang đối đầu gay gắt."],"ans":2,"id":"b2-98"},{"lesson":2,"part":1,"num":99,"stem":"Một trong những tác động tích cực của sự sụp đổ Trật tự hai cực I-an-ta đối với tình hình thế giới là","opts":["dẫn đến sự kết thúc Chiến tranh lạnh.","làm xuất hiện xu thế liên kết khu vực.","thúc đẩy nền hòa bình cho nhân loại.","xác lập vai trò bá chủ thế giới của Mỹ."],"ans":2,"id":"b2-99"},{"lesson":2,"part":1,"num":100,"stem":"Sự sụp đổ của Trật tự thế giới hai cực I-an-ta (1991) không có tác động nào sau đây?","opts":["Mở ra chiêu hướng và điêu kiện giải quyết hòa bình các cuộc tranh châp với xung đột.","Phạm vi ảnh hưởng của hai siêu cường Mỹ và Liên Xô bị thu hẹp ở nhiều nơi trên thế giới.","Tạo điều kiện cho các cường quốc mới nổi có vị trí, vai trò lớn hơn trong quan hệ quốc tế.","Tạo điều kiện cho trật tự thế giới mới dần hình thành theo xu thế đa cực, nhiều trung tâm."],"ans":1,"id":"b2-100"},{"lesson":2,"part":1,"num":101,"stem":"Trật tự thê giới hai cực I-an-ta sụp đổ (1991) có tác động nào sau đây đến quốc tế?","opts":["Đưa tới sự ra đời của Hiệp hội các quốc gia Đông Nam Á.","Mở rộng quan hệ quốc tế, thúc đẩy xu thế toàn cầu hóa.","Mỹ chuyên sang ủng hộ xu thế đa cực, nhiều trung tâm.","Khẳng định ví trí đứng đầu nền kinh tế thế giới của Trung Quốc."],"ans":1,"id":"b2-101"},{"lesson":2,"part":1,"num":102,"stem":"Nội dung nào sau đây phản ánh không đúng tác động của sự sụp đổ Trật tự hai cực I-an-ta đến tình hình thế giới?","opts":["Mỹ tạm thời chiếm ưu thế trong tương quan so sánh lực lượng mới.","Dẫn đến sự hình thành một trật tự thế giới mới theo xu thế đa cực.","Tạo điều kiện giải quyết hòa bình các vụ tranh chấp, xung đột khu vực.","Tạo điều kiện cho sự thắng lợi của phong trào giải phóng dân tộc."],"ans":3,"id":"b2-102"},{"lesson":2,"part":1,"num":103,"stem":"Nội dung nào sau đây phản ánh tác động của sự sụp đổ trật tự hai cực I-an- ta đối với thế giới?","opts":["Dẫn đến sự đối đầu giữa khối NATO và Vác-sa-va ngày càng gia tăng.","Các quốc gia ra sức chạy đua vũ trang để khẳng định vị thế.","Đưa tới sự phát triển của những xu thế mới trong quan hệ quốc tế.","Gia tăng sự phụ thuộc của các quốc gia vào Liên Xô và Mỹ."],"ans":2,"id":"b2-103"},{"lesson":2,"part":1,"num":104,"stem":"Sự sụp đổ của Trật tự hai cực I-an-ta có tác động nào sau đây đối với Việt Nam?","opts":["Tạo ra nhiều cơ hội cho Việt Nam xây dựng và phát triển đất nước.","Nhận được sự giúp đỡ của hệ thống xã hội chủ nghĩa để bảo vệ Tổ quốc.","Tạo điều kiện thuận lợi cho Việt Nam gia nhập tổ chức Liên hợp quốc.","Giải quyết mọi khó khăn trong quá trình xây dựng và bảo vệ Tổ quốc."],"ans":0,"id":"b2-104"},{"lesson":2,"part":1,"num":105,"stem":"Từ cuộc Chiến tranh lạnh (1947 – 1989), Việt Nam rút ra được bài học kinh nghiệm nào sau đây cho việc xây dựng chính sách quốc phòng – an ninh hiện nay?","opts":["Đối đầu quân sự không phải là cách giải quyết tối ưu trong quan hệ quốc tế.","Muốn tự lực tự cường đất nước chỉ có con đường xập trung phát triển quân sự.","Phải tích cực tham gia các liên minh chính trị – quân sự với các nước lớn.","Chiếm ưu thế về quân sự sẽ giải quyết được tất cả các vấn đề an ninh quốc gia."],"ans":0,"id":"b2-105"},{"lesson":2,"part":2,"num":106,"stem":"Đọc đoạn tư liệu sau đây: “Cuộc Chiến tranh lạnh (1947-1989) chủ yếu diễn ra ở châu Âu, nhưng đã làm thay đổi sâu sắc quan hệ quốc tế: giữa Mỹ với Liên Xô, giữa các nước Đông Âu với các nước Tây Âu, giữa các nước tư bản chủ nghĩa với các nước xã hội chủ nghĩa. Sự đối đầu gay gắt giữa Mỹ và Liên Xô trong thời gian diễn ra Chiến tranh lạnh đã làm gia tăng cuộc chạy đua vũ trang, dẫn đến một số cuộc chiến tranh cục bộ trên thế giới.\" (Nguyễn Anh Thái (chủ biên), Lịch sử thế giới hiện đại, Nxb Giáo dục, Hà Nội, 2015, tr.538)","stmts":[{"t":"Trong thời kì Chiến tranh lạnh, đã diễn ra cuộc chạy đua vũ trang giữa Mỹ và Liên Xô.","ok":true},{"t":"Cuộc Chiến tranh lạnh (1947-1989) là một trong những nhân tố chi phối nền chính trị thế giới và các quan hệ quốc tế trong phần lớn nửa sau thế kỉ XX.","ok":true},{"t":"Những bất đồng tại Hội nghị I-an-ta là nguồn gốc của sự đối đầu giữa các cường quốc trong phe Đồng minh, dẫn tới tình trạng Chiến tranh lạnh.","ok":false},{"t":"Trong những năm 1947-1989, hầu hết các cuộc chiến tranh cục bộ đều mang dấu ấn của Chiến tranh lạnh, với sự can thiệp, hậu thuẫn và trực tiếp đối đầu giữa Mỹ và Liên Xô.","ok":false}],"id":"b2-106"},{"lesson":2,"part":2,"num":107,"stem":"Đọc đoạn tư liệu sau đây: \"Sự ra đời hai học thuyết phản ánh hai ý thức hệ đối lập nhau được sử dụng làm cơ sở tư tưởng cho hai cực trong trật tự thế giới sau Chiến tranh thế giới thứ hai - Trật tự I-an-ta; và cũng là sự khởi đầu cho mối quan hệ quốc tế mang hình thái Chiến tranh lạnh, một cuộc chiến tuy không nổ súng, không đổ màu nhưng luôn căng thẳng, gay gắt nhằm loại trừ lẫn nhau, tiêu diệt nhau. Chiến tranh không bùng nổ trên phạm vi thế giới, song đâu đó trên Trái Đất, không lúc nào ngừng tiếng súng, ngừng đổ máu mà ở phía sau vẫn là sự dính líu của các nước lớn. Điều đó làm cho tình hình diễn biến rất phức tạp, tác động sâu sắc đến vận mệnh các quốc gia, dân tộc\". (Vũ Dương Ninh, Quan hệ đối ngoại Việt Nam (1940 - 2020), NXB Chính trị Quốc gia Sự thật, Hà Nội 2022, tr.115)","stmts":[{"t":"Chiến tranh lạnh tuy không diễn ra sự đối đầu trực tiếp giữa Mỹ và Liên Xô, nhưng để lại hậu quả nặng nề qua các cuộc chiến tranh ủy nhiệm tại nhiều khu vực.","ok":true},{"t":"Trật tự hai cực I-an-ta đã dẫn đến tình trạng đối đầu Đông - Tây và cuộc Chiến tranh lạnh kéo dài trong gần bốn thập kỷ nửa sau thế kỉ XX.","ok":true},{"t":"Nguyên nhân dẫn đến sự bùng nổ Chiến tranh lạnh bắt nguồn từ sự đối lập sâu sắc về mục tiêu, lợi ích và chiến lược giữa hai siêu cường Liên Xô và Mỹ.","ok":true},{"t":"Trật tự hai cực I-an-ta đã làm cho thế giới bị chia rẽ sâu sắc, hình thành hai phe đối lập về chính trị, kinh tế và quân sự do Mỹ và Liên Xô đứng đầu.","ok":true}],"id":"b2-107"},{"lesson":2,"part":2,"num":108,"stem":"Cho đoạn tư liệu sau đây: “Trải qua hơn 40 năm, \"Trật tự hai cực lanta\" đã từng bước bị xói mòn: thắng lợi của cách mạng Trung Quốc năm 1949 đã tạo ra một “đột phá” đối với trật tự này là đập tan âm mưu của Mĩ khống chế Trung Quốc và Liên Xô buộc phải từ bỏ những đặc quyền ở vùng Đông Bắc Trung Quốc, [...], thắng lợi của phong trào giải phóng dân tộc làm thay đổi căn bản bộ mặt của khu vực Á - Phi - Mĩ Latinh mà theo \"khuôn khổ Ianta\" thuộc ảnh hưởng truyền thống của Mĩ và các nước phương Tây; sự phát triển mạnh mẽ về kinh tế của Nhật Bản, Tây Âu dẫn đến việc hai trung tâm kinh tế - tài chính là Tây Âu và Nhật Bản cạnh tranh với Mĩ (trước đây Mĩ là trung tâm kinh tế, tài chính duy nhất của thể giới)\" (Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr.417)","stmts":[{"t":"Bản đồ chính trị khu vực Á - Phi - Mĩ La-tinh thay đổi sâu sắc do thắng lợi của phong trào giải phóng dân tộc sau Chiến tranh thế giới thứ hai.","ok":true},{"t":"Sự tồn tại của trật tự thế giới trong Chiến tranh lạnh đã ảnh hưởng sâu sắc, làm cho cuộc cách mạng khoa học - kĩ thuật trên thế giới bị chững lại.","ok":false},{"t":"Sự ra đời và phát triển của các quốc gia độc lập sau năm 1945 đã góp phần hình thành trật tự thế giới mới sau Chiến tranh lạnh.","ok":true},{"t":"Thắng lợi của cách mạng dân tộc dân chủ ở Trung Quốc năm 1949 buộc Mỹ phải từ bỏ những đặc quyền ở vùng Đông Bắc nước này.","ok":false}],"id":"b2-108"},{"lesson":2,"part":2,"num":109,"stem":"Đọc đoạn tư liệu sau: “Ở “Trật tự thế giới hai cực I-an-ta\", Liên Xô đã đạt được 3 mục tiêu cơ bản: bảo vệ vững chắc sự tồn tại và phát triển của đất nước Xô viết; thu hồi lại những đất đai của đế quốc Nga trước đây (kể từ chiến tranh Nga Nhật 1904 - 1905 đến chiến tranh chống ngoại xâm và nội phản 1918 - 1920); mở rộng phạm vi ảnh hưởng ở châu Âu và châu Á, qua đó thiết lập một vành đai an toàn bao quanh phía tây, đông và nam Liên Xô. Còn Mỹ, đã khống chế được Tây Âu, Nhật Bản, chi phối cục diện thế giới. Mặt khác, sự thoả thuận giữa ba cường quốc ở Hội nghị I-an-ta đã xâm phạm đến chủ quyền, lãnh thổ và lợi ích của nhân dân nhiều nước.\" (Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, 2006, tr. 234)","stmts":[{"t":"Đoạn tư liệu trên thể hiện sự đối đầu trên lĩnh vực kinh tế giữa Mĩ và Liên Xô sau Chiến tranh thế giới thứ hai.","ok":false},{"t":"Sự hình thành và tồn tại của Trật tự thế giới hai cực I-an-ta không phù hợp với lợi ích chung của cộng đồng quốc tế.","ok":true},{"t":"Trong Trật tự thế giới hai cực I-an-ta, Liên Xô giành được nhiều quyền lợi, qua đó, mở rộng được hệ thống thuộc địa ở châu Âu và châu Á.","ok":false},{"t":"Trật tự hai cực I-an-ta đã tác động và làm biến đổi sâu sắc đến quan hệ quốc tế, để lại những di chứng ở thời điểm hiện tại.","ok":true}],"id":"b2-109"},{"lesson":2,"part":2,"num":110,"stem":"Cho bảng dữ liệu sau đây:","stmts":[{"t":"Thắng lợi của phong trào giải phóng dân tộc và sự ra đời của hàng loạt các quốc gia độc lập không phải là nguyên nhân làm suy yếu Trật tự thế giới hai cực I-an-ta.","ok":false},{"t":"Sự suy yếu của Mỹ và Liên Xô do chạy đua vũ trang là nguyên nhân dẫn đến việc hai nước phải điều chỉnh chính sách đối ngoại và giảm căng thẳng.","ok":true},{"t":"Xu thế toàn cầu hóa và ảnh hưởng của cuộc Cách mạng công nghiệp lần thứ ba chỉ ảnh hưởng đến Liên Xô và Mỹ, không tác động đến các nước khác.","ok":false},{"t":"Sự phát triển kinh tế của Nhật Bản và Tây Âu trong những năm 70 của thế kỉ XX đã làm giảm vai trò dẫn đầu về kinh tế của Mỹ và Liên Xô trên thế giới.","ok":true}],"table":[["Nguyên nhân sụp đổ Trật tự thế giới hai cực I-an-ta","Chạy đua vũ trang khiến Liên Xô và Mĩ tốn kém, suy yếu, buộc hai bên phải tự điều chỉnh, từng bước hạn chế căng thẳng."],["Nguyên nhân sụp đổ Trật tự thế giới hai cực I-an-ta","Sự vươn lên của các nước trên thế giới nhằm thoát khỏi ảnh hưởng của hai cực, đặc biệt, thắng lợi của các phong trào giải phóng dân tộc và sự ra đời của hàng loạt các quốc gia độc lập ở Á, Phi và Mĩ Latinh."],["Nguyên nhân sụp đổ Trật tự thế giới hai cực I-an-ta","Sự thay đổi trong cán cân kinh tế thế giới, đặc b
