iệt là sự vươn lên mạnh mẽ của các nước Tây Âu và Nhật Bản."],["Nguyên nhân sụp đổ Trật tự thế giới hai cực I-an-ta","Xu thế hòa hoãn, toàn cầu hóa và ảnh hưởng của cuộc Cách mạng công nghiệp lần thứ ba."],["Nguyên nhân sụp đổ Trật tự thế giới hai cực I-an-ta","Sự sụp đổ chế độ xã hội chủ nghĩa của các nước Đông Âu và Liên Xô."]],"id":"b2-110"},{"lesson":2,"part":2,"num":111,"stem":"Cho những thông tin trong bảng sau đây:","stmts":[{"t":"Bảng thông tin thể hiện vê những vân đề liên quan đến sự hình thành, phát triển và sụp đổ của trật tự thế giới sau Chiến tranh thế giới thứ hai.","ok":true},{"t":"Sự hình thành trật tự thế giới mới sau Chiến tranh thế giới thứ hai chịu tác động bởi mục tiêu chiến lược của các cường quốc.","ok":true},{"t":"Sự hình thành và phát triển của các Trật tự thế giới trong và sau Chiến tranh lạnh đều chứng tỏ Liên hợp quốc là tổ chức duy nhất quyết định điều tiết quan hệ quốc tế.","ok":false},{"t":"Thực tiễn quan hệ quốc tế trong thời kì Chiến tranh lạnh cho thấy các nước có thể chế chính trị khác nhau có vai trò như nhau đối với sự hình thành Trật tự thế giới đa cực.","ok":false}],"table":[["Thời gian","Nội dung"],["Năm 1945","Hội nghị I-an-ta (Liên Xô) và Hội nghị Pốt-xđam (Đức) được tổ chức; Liên hợp quốc thành lập."],["Năm 1947","Mĩ phát động Chiến tranh lạnh chống Liên Xô."],["Năm 1949","Cách mạng Trung Quốc thành công, nước Cộng hòa nhân dân Trung Hoa ra đời; Tổ chức Hiệp ước Bắc Đại Tây Dương được thành lập."],["Năm 1955","Tổ chức Hiệp ước Vác-sa-va được thành lập."],["Năm 1989","Liên Xô và Mĩ tuyên bố chấm dứt Chiến tranh lạnh."],["Năm 1991","Hệ thống xã hội chủ nghĩa sụp đổ."]],"id":"b2-111"},{"lesson":2,"part":2,"num":112,"stem":"Cho những thông tin trong bảng sau đây:","stmts":[{"t":"Hội nghị I-an-ta (2 - 1945) được xem là hội nghị khởi đầu cho việc hình thành một trật tự thế giới mới sau khi Chiến tranh thế giới thứ hai kết thúc trên toàn thế giới.","ok":true},{"t":"Phát biểu của Tổng thống Mỹ G. Bút-sơ trong cuộc gặp với Tổng Bí thư Đảng Cộng sản Liên Xô M. Goóc-ba-chốp (12 - 1989) đánh dấu kết thúc hoàn toàn cuộc đối đầu quân sự tại châu Âu.","ok":false},{"t":"Việc Mỹ đề ra “Kế hoạch Mác-san\" còn Liên Xô và các nước Đông Âu thành lập Hội đồng tương trợ kinh tế (SEV) đã tạo ra sự đối đầu về chính trị, kinh tế giữa hai hệ thống xã hội đối lập.","ok":true},{"t":"Tổng thống Mỹ R. Nich-xơn có chuyến thăm chính thức đầu tiên tới Liên Xô đã mở đầu cho sự xói mòn và đi đến sụp đổ của trật tự thế giới hai cực I-an-ta.","ok":false}],"table":[["Thời gian","Nội dung"],["Năm 1945","Tại I-an-ta (Liên Xô) đã diễn ra hội nghị giữa ba cường quốc: Liên Xô, Mĩ, Anh."],["Năm 1947","Mĩ đề ra “Kế hoạch Mác-san” nhằm viện trợ cho các nước Tây Âu."],["Năm 1949","Liên Xô và các nước Đông Âu thành lập Hội đồng tương trợ kinh tế (SEV)."],["Năm 1972","Tổng thống Mĩ R. Nich-xơn có chuyến thăm chính thức đầu tiên tới Liên Xô."],["Năm 1989","Liên Xô và Mĩ cùng tuyên bố chấm dứt Chiến tranh lạnh."]],"id":"b2-112"},{"lesson":2,"part":2,"num":113,"stem":"Cho đoạn tư liệu sau đây: “Trong \"trật tự thế giới hai cực I-an-ta\" đã diễn ra một cuộc đối đầu, quyết liệt và kéo dài tới gần bốn thập niên giữa hai \"cực\" Xô - Mỹ, làm cho cục gay gắt, diện thế giới luôn luôn phức tạp, căng thẳng. Cuộc đối đầu này đã dẫn tới cuộc đối đầu giữa hai khối Đông - Tây và cuốn hút từng quốc gia, từng khu vực chịu ảnh hưởng sâu sắc của cuộc đối đầu này”. (Nguyễn Anh Thái (chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 2006, tr.234-235)","stmts":[{"t":"Cuộc đối đầu và chạy đua vũ trang giữa Mỹ và Liên Xô là nguyên nhân dẫn đến cuộc chiến tranh thế giới nửa sau thế kỉ XX.","ok":false},{"t":"Một trong những hệ quả của cuộc đối đầu Đông - Tây là nguy cơ bùng nổ các cuộc xung đột do mâu thuẫn sắc tộc, tôn giáo và tranh chấp lãnh thổ ở nhiều nơi trên thế giới.","ok":true},{"t":"Cuộc đối đầu giữa Mỹ và Liên Xô ở phần lớn nửa sau thế kỉ XX diễn ra trên hầu hết các lĩnh vực ngoại trừ việc chạy đua vũ trang giữa Liên Xô và Mỹ.","ok":false},{"t":"Trật tự thế giới hai cực I-an-ta được xác lập đã làm cho quan hệ quốc tế trở nên căng thẳng.","ok":true}],"id":"b2-113"},{"lesson":2,"part":2,"num":114,"stem":"Đọc đoạn tư liệu sau đây: “Vào thập niên 1980, mối quan hệ nồng ấm giữa Tổng thống Mỹ Ri-gân và nhà lãnh đạo Liên Xô Goóc-ba chốp đã giúp giảm dần tình trạng căng thẳng của Chiến tranh lạnh. Năm 1987, hai nhà lãnh đạo đã đồng ý huỷ bỏ tên lửa hạt nhân tầm trung. Năm 1989, Goóc-ba-chốp cho phép các quốc gia xã hội chủ nghĩa ở Đông Âu bầu ra chính phủ dân chủ, và đến năm 1991, Liên Xô tan rã thành 15 nước cộng hòa độc lập.” (King Fisher, Bách khoa thư lịch sử (Nguyễn Đức Tĩnh và Ngô Minh Châu dịch), NXB Thể giới, Hà Nội, 2016, tr.437)","stmts":[{"t":"Trong thập niên 80 của thế kỉ XX, tình trạng căng thẳng của Chiến tranh lạnh diễn ra gay gắt.","ok":false},{"t":"Đoạn trích trên đề cập đến sự xói mòn và tan rã của trật tự thế giới hai cực I-an-ta.","ok":true},{"t":"Cục diện hai cực, hai phe trong quan hệ quốc tế phần lớn nửa sau thế kỉ XX kết thúc bắt nguồn từ sự suy giảm tương đối sức mạnh giữa các bên.","ok":true},{"t":"Điểm chung của các trật tự thế giới được hình thành và xác lập trong thế kỉ XX là đều suy yếu, sụp đổ khi có sự hòa hoàn, thỏa hiệp giữa các siêu cường.","ok":false}],"id":"b2-114"},{"lesson":2,"part":2,"num":115,"stem":"Đọc đoạn tư liệu sau đây:","stmts":[{"t":"Để thiết lập một trật tự thế giới mới và phân chia phạm vi ảnh hưởng giữa các cường quốc sau khi chiến tranh kết thúc, hội nghị Ianta và hội nghị Pốt-xđam đã được tổ chức.","ok":true},{"t":"Thông điệp của Tổng thống Mỹ Truman trước Quốc hội năm 1947 là sự kiện đặt khuôn khổ cho sự hình thành của một trật tự thế giới mới sau khi chiến tranh kết thúc.","ok":false},{"t":"Bảng tư liệu đề cập trên đề cập đến quá trình hình thành, phát triển và sụp đổ hoàn toàn của trật tự thế giới hai cực Ianta.","ok":false},{"t":"Việc thành lập Tổ chức Hiệp ước Bắc Đại Tây Dương (NATO) vào năm 1949 và Tổ chức Hiệp ước Vácsava vào năm 1955 đã làm gia tăng căng thẳng và chạy đua vũ trang.","ok":true}],"table":[["Thời gian","Nội dung"],["Năm 1945","Các hội nghị Ianta (Liên Xô), Hội nghị Pốt-xđam (Đức) được tổ chức."],["Năm 1947","Thông điệp của Tổng thống Mĩ xem Liên Xô là kẻ thù nguy hiểm nhất được phát đi."],["Năm 1949","Tổ chức Hiệp ước Bắc Đại Tây Dương được thành lập."],["Năm 1955","Tổ chức hiệp ước Vácsava được Liên Xô và 6 nước Đông Âu thành lập."],["Năm 1989","Tổng thống Mĩ và Liên Xô gặp nhau tại Malta, tuyên bố kết thúc Chiến tranh lạnh."]],"id":"b2-115"},{"lesson":2,"part":2,"num":116,"stem":"Cho những thông tin trong bảng sau đây:","stmts":[{"t":"Thực tiễn quan hệ quốc tế trong thời kì Chiến tranh lạnh đã chứng tỏ sự phức tạp của các mối quan hệ đan xen với nhau, nhất là giữa những quốc gia các chế độ chính trị - xã hội đối lập.","ok":true},{"t":"Sự ra đời của tổ chức NATO (1949) và Hiệp ước Vác-sa-va (1955) là mốc đánh dấu trật tự thế giới hai cực I-an-ta bắt đầu xói.","ok":false},{"t":"Trong thời kì Chiến tranh lạnh, các nước nhỏ không có vai trò gì trong quan hệ quốc tế chủ yếu vì quan hệ quốc tế bị chi phối bởi mục tiêu chiến lược của các cường quốc.","ok":false},{"t":"Bảng thông tin thể hiện quá trình hình thành, xói mòn và sụp đổ của trật tự thế giới lưỡng cực Ianta.","ok":true}],"table":[["Thời gian","Nội dung"],["1945","Hội nghị I-an-ta (Liên Xô) và Hội nghị Pốt-xđam (Đức) được tổ chức; Liên hợp quốc thành lập."],["1947","Mĩ phát động Chiến tranh lạnh chống Liên Xô."],["1949","Cách mạng Trung Quốc thành công, nước Cộng hòa nhân dân Trung Hoa ra đời; Tổ chức Hiệp ước Bắc Đại Tây Dương được thành lập."],["1955","Tổ chức Hiệp ước Vác-sa-va được thành lập."],["1989","Liên Xô và Mĩ tuyên bố chấm dứt Chiến tranh lạnh."],["1991","Hệ thống xã hội chủ nghĩa sụp đổ."]],"id":"b2-116"},{"lesson":2,"part":2,"num":117,"stem":"Đọc đoạn tư liệu sau đây: “Ba cường quốc cũng đã thoả thuận để quân đội Mỹ chiếm đóng Nhật Bản, quân đội Liên Xô chiếm đóng miền Bắc Triều Tiên và quân đội Mĩ chiếm đóng Nam Triều Tiên, lấy vĩ tuyến 38 làm ranh giới; Nhật Bản thuộc phạm vi ảnh hưởng của Mĩ; Trung Quốc tiến tới thành lập chính phủ liên hiệp bao gồm Đảng Cộng sản Trung Quốc và Mỹ với Liên Xô cùng có quyền lợi ở Trung Quốc; các vùng còn lại của châu Á (Đông Nam Á, Tây Á, Nam Á...) vẫn thuộc phạm vi ảnh hưởng truyền thống của các nước phương Tây\". (Nguyễn Anh Thái. (2021). Lịch sử thế giới hiện đại (1917-1995). Nhà xuất bản Giáo dục, tr. 224)","stmts":[{"t":"Theo quyết định của hội nghị I-an-ta (2-1945), Nhật Bản là quốc gia duy nhất ở châu Á không chịu sự chiếm đóng của các nước Đồng minh.","ok":false},{"t":"Những quyết định của hội nghị I-an-ta (2-1945) đã để lại những hệ quả có tính chất hai mặt đối với mối quan hệ giữa các quốc gia Đồng minh chủ chốt.","ok":true},{"t":"Các quyết định của hội nghị I-an-ta (2-1945) đã vi phạm quyền tự quyết của nhiều quốc gia, dân tộc vì đã không có sự đồng thuận của các quốc gia, dân tộc có liên quan.","ok":true},{"t":"Đoạn tư liệu trên thể hiện việc phân chia phạm vi ảnh hưởng giữa các quốc gia thắng trận trong Chiến tranh thế giới thứ hai.","ok":true}],"id":"b2-117"},{"lesson":2,"part":2,"num":118,"stem":"Đọc đoạn tư liệu sau: “Trải qua hơn 40 năm, “Trật tự hai cực lanta” đã từng bước bị xói mòn: thắng lợi của cách mạng Trung Quốc năm 1949 đã tạo ra một “đột phá” đối với trật tự này và đập tan âm mưu của Mĩ khống chế Trung Quốc và Liên Xô phải bỏ những đặc quyền ở vùng Đông Bắc Trung Quốc; sự lớn mạnh của nền kinh tế các nước tư bản Tây Âu, đặc biệt sự ra đời của Khối thị trường chung châu Âu (EEC) từ giai đoạn trước làm suy giảm nghiêm trọng phạm vi ảnh hưởng của Mĩ ở Tây Âu; thắng lợi của phong trào giải phóng dân tộc làm thay đổi căn bản bộ mặt của khu vực Á – Phi – Mĩ Latinh mà theo “khuôn khổ lanta” thuộc ảnh hưởng truyền thống của Mĩ và các nước phương Tây; sự phát triển mạnh mẽ của kinh tế Nhật Bản, Tây Âu dẫn đến việc hai trung tâm kinh tế - tài chính là Tây Âu và Nhật Bản cạnh tranh với Mi. (Nguyễn Anh Thái. (n.d.). Lịch sử thế giới hiện đại. Nhà xuất bản Giáo dục, tr. 417)","stmts":[{"t":"Việc \"trật tự hai cực Ianta\" bị xói mòn dần theo thời gian (hơn 40 năm) phản ánh quan hệ quốc tế luôn vận động và biến đổi không ngừng, không thể dự đoán.","ok":false},{"t":"Đoạn tư liệu trên đề cập đến sự xói mòn và sụp đổ của trật tự thế giới hai cực Ianta.","ok":false},{"t":"Sự ra đời của các quốc gia độc lập ở châu Á đã góp phần làm xói mòn trật tự hai cực Ianta vì đã thu hẹp phạm vi ảnh hưởng của Mĩ và các nước phương Tây.","ok":true},{"t":"Quan hệ giữa Nhật Bản, Tây Âu và Mĩ trong trật tự hai cực Ianta là đối đầu quân sự.","ok":false}],"id":"b2-118"},{"lesson":2,"part":2,"num":119,"stem":"Cho những thông tin trong bảng sau đây:","stmts":[{"t":"\"Cuộc khủng hoảng tên lửa ở Cu-ba (1962)\" đã đưa thế giới đến bờ vực chiến tranh hạt nhân trong Chiến tranh lạnh vì Cu-ba đã tự phát triển vũ khí hạt nhân.","ok":false},{"t":"Các cuộc chiến tranh cục bộ trong Chiến tranh lạnh đã để lại nhiều bài học kinh nghiệm về sự kiềm chế của các cường quốc trong giải quyết xung đột trên thế giới.","ok":true},{"t":"Cuộc chiến tranh Triều Tiên (1950-1953) là “sản phẩm” của Chiến tranh lạnh và là sự đụng đầu trực tiếp thứ ba giữa hai phe - TBCN và XHCN.","ok":false},{"t":"Bảng thông tin đề cập đến những cuộc chiến tranh cục bộ, xung đột trong khuôn khổ Chiến tranh lạnh.","ok":true}],"table":[["Thời gian","Nội dung"],["Từ 1945 đến 1954","Cuộc chiến tranh xâm lược Đông Dương của thực dân Pháp."],["Từ 1954 đến 1975","Cuộc chiến tranh xâm lược Việt Nam của đế quốc Mĩ."],["Từ 1950 đến 1953","Cuộc chiến tranh Triều Tiên."],["Năm 1961","Cuộc khủng hoảng Béc-lin."],["Năm 1962","Cuộc khủng hoảng tên lửa ở Cu-ba."]],"id":"b2-119"},{"lesson":2,"part":2,"num":120,"stem":"Cho đoạn tư liệu sau đây: “Năm 1949, Mỹ và các nước Tây Âu thành lập Khối quân sự Bắc Đại Tây Dương (NATO) để thực hiện thế bao vây, cô lập và tấn công Liên Xô và các nước chủ nghĩa xã hội. Liên Xô đã nhanh chóng vạch trần âm mưu của Mỹ và các nước đế quốc. Trong Bị vong lục gửi các thành viên của NATO ngày 31/3 và ngày 04/4/1949, Chính phủ Liên Xô đã chỉ rõ “Hiệp ước Bắc Đại Tây Dương hoàn toàn không có gì liên quan đến mục đích tự vệ của các nước thành viên, những nước không bị ai đe dọa và không ai cóy định tấn công. Trái lại, Hiệp ước này mang tính chất xâm lược rất rõ ràng và nhằm chống lại Liên Xô\". (Viện Lịch sử Quân sự Việt Nam. (2007). NATO trong thời kỳ Chiến tranh lạnh (1941-1991). Nhà xuất bản Quân đội Nhân dân, tr. 53–54)","stmts":[{"t":"Mỹ và 11 nước phương Tây thành lập NATO nhằm chuẩn bị một cuộc chiến tranh thế giới mới chống Liên Xô và các nước dân chủ nhân dân ở Đông Âu.","ok":false},{"t":"Đoạn tư liệu trên đề cập đến sự ra đời của tổ chức quân sự đầu tiên trên thế giới.","ok":false},{"t":"Sự ra đời của NATO năm 1949 đã làm cho mối quan hệ giữa Mỹ với Liên Xô và các nước nhân chủ nhân dân ở Đông Âu ngày càng trở nên căng thẳng.","ok":true},{"t":"Sự ra đời của NATO năm 1949 là phù hợp với nguyện vọng của nhân dân thế giới.","ok":false}],"id":"b2-120"},{"lesson":2,"part":2,"num":121,"stem":"Cho đoạn tư liệu sau đây: “Giữa hai cực Liên Xô và Mỹ có sự khác nhau hoàn toàn: \"cực\" Liên Xô luôn luôn làm hậu thuẫn cho phong trào cách mạng xã hội chủ nghĩa, cách mạng giải phóng dân tộc và sự nghiệp đấu tranh vì hòa bình, dân chủ và tiến bộ xã hội; ngược lại, \"cực\" Mỹ luôn ra sức cấu kết, giúp đỡ các thế lực phản động chống phá cách mạng thế giới với mưu đồ vươn lên vị trị \"thống trị\" thế giới - đây là điểm khác biệt cơ bản để từ đó nhìn nhận, đánh giá về \"trật tự hai cực lanta\". (Nguyễn Anh Thái. (2006). Lịch sử thế giới hiện đại. Nhà xuất bản Giáo dục, tr. 234.)","stmts":[{"t":"Sự đối lập về mục tiêu, chiến lược phát triển giữa Mỹ và Liên Xô sau Chiến tranh thế giới thứ hai là nguyên nhân chính gây ra mọi cuộc xung đột trên thế giới ở nửa sau thế kỉ XX.","ok":false},{"t":"Để bảo vệ vị trí thống trị thế giới của mình, Mỹ đã giúp đỡ các thế lực phản động chống phá cách mạng.","ok":true},{"t":"Sau Chiến tranh thế giới thứ hai, chính sách đối ngoại của Liên Xô đã phản ánh vai trò siêu cường.","ok":true},{"t":"Đoạn tư liệu trên đề cập đến những quyết định quan trọng của Hội nghị Ianta (2/1945).","ok":false}],"id":"b2-121"},{"lesson":2,"part":2,"num":122,"stem":"Đọc đoạn tư liệu sau đây: “Sau khi hai nước tuyên bố chấm dứt Chiến tranh lạnh vào năm 1989, Liên Xô và Mĩ thực sự từ đối đầu chuyển sang hợp tác với nhau để giải quyết những tranh chấp quốc tế và xung đột quân sự mang tính đối địch trước đây giữa \"hai cực\". Liên Xô và Mĩ thỏa thuận giải quyết cuộc xung đột quân sự ở Afghanistan bằng việc quân đội Liên Xô rút ra khỏi Afghanistan, giải quyết vấn đề Campuchia (thương lượngvà kí kết hiệp định Paris về Campuchia năm 1991), giải quyết vấn đề Angola, Namibia ở Tây Nam Phi... Trong những thỏa thuận với Mĩ, Liên Xô có những thỏa hiệp, nhượng bộ không có lợi cho cách mạng thế giới, thực hiện chính sách \"không can thiệp\" vào CHDC Đức và các nước Đông Âu, chính sách không thực hiện những cam kết với các đồng minh cũ của Liên Xô...\" (Trần Nam Tiến. (2008). Lịch sử quan hệ quốc tế hiện đại. Nhà xuất bản Giáo dục, tr. 394.)","stmts":[{"t":"Đoạn tư liêu trên đề cập đến tình hình thế giới và quan hệ quốc tế những năm đầu thế kỉ XXI.","ok":false},{"t":"Để ngăn chặn thế giới đến bờ vực thảm họa hạt nhân, Liên Xô và Mỹ chuyển từ đối đầu sang hợp tác ngay sau khi chính thức chấm dứt Chiến tranh Lạnh.","ok":true},{"t":"Những hành động của Mỹ và Liên Xô trong giai đoạn 1989 – 1991 đã có tác động tích cực đối với sự phát triển của trật tự thế giới theo xu hướng đa cực.","ok":false},{"t":"Sự kiện Liên Xô và Mĩ tuyên bố chấm dứt Chiến tranh lạnh vào năm 1989 là mốc đánh dấu hai siêu cường này không còn tình trạng cạnh tranh với nhau.","ok":false}],"id":"b2-122"},{"lesson":2,"part":2,"num":123,"stem":"Đọc đoạn tư liệu sau đây: “Chiến tranh thế giới thứ hai kết thúc, phe Trục phát xít Đức - Italia - Nhật Bản thất bại hoàn toàn, Liên Xô và các nước Đồng minh giành thắng lợi. Cuộc chiến này đã làm thay đổi căn bản tương quan sức mạnh giữa các nước, trung tâm quyền lực trong quan hệ quốc tế, đưa đến hình thành một trật tự thế giới mới cả về chính trị và kinh tế. Hội nghị nguyên thủ ba nước là Anh, Mĩ và Liên Xô tại Teheran (tháng 10 - 1943), đặc biệt các cuộc đàm phán tại lanta (tháng 2 - 1945) và Pốtxđam (tháng 7-8 năm 1945) đã sắp xếp lại quyền lực trong quan hệ quốc tế và từ đây thế giới hình thành nên hệ thống hay trật tự thế giới hai cực, một cực do Liên Xô đứng đầu và cực kia do Mĩ đứng đầu đối nghịch nhau về ý thức hệ chính trị - tư tưởng, kinh tế và quân sự”. (Trần Khánh & Nguyễn Huy Hoàng. (2022). Bàn về trật tự thế giới hiện nay. Tạp chí Lý luận chính trị, (536), tháng 10.)","stmts":[{"t":"Đoạn tư liệu trên đề cập đến sự hình thành trật tự thế giới hai cực sau Chiến tranh lạnh.","ok":false},{"t":"Chiến tranh thế giới thứ hai đã làm “thay đổi căn bản tương quan sức mạnh giữa các nước” chủ yếu vì tất cả các nước tham chiến đều bị suy yếu, tàn phá nặng nề.","ok":false},{"t":"Cuộc đàm phán tại Ianta (tháng 2 - 1945) và Pốtxđam (tháng 7-8 năm 1945) là mốc đánh dấu cục diện hai cực, hai phe chính thức được xác lập trên phạm vi toàn thế giới.","ok":false},{"t":"Việc các nước thắng trận tổ chức các hội nghị quốc tế trong và sau Chiến tranh thế giới thứ hai cho thấy họ giữ vai trò quyết định trong thiết lập trật tự thế giới mới.","ok":true}],"id":"b2-123"},{"lesson":2,"part":2,"num":124,"stem":"Cho đoạn tư liệu sau đây: “Trong thời kỳ Chiến tranh lạnh, Mỹ sử dụng kinh tế như một phương thức lôi kéo một số nước đứng về phía Mỹ, tránh để những nước này rơi vào vòng ảnh hưởng của phe xã hội chủ nghĩa, điển hình là Kế hoạch Mácsan cùng các chương trình viện trợ cho Nhật Bản, Hàn Quốc. Kế hoạch Mácsan hay còn gọi là \"Chương trình Phục hưng Châu Âu\" được đánh giá là một trong những dự án thành công nhật trong lịch sử chính sách đối ngoại Mỹ. Trong đó, Mỹ đã sử dụng tiềm năng kinh tế, lợi thế về kinh tế để tác động vào chính sách đối ngoại của các quốc gia khác và qua đó đạt được mục tiêu chính sách đối ngoại của mình”. (Trần Thị Vinh. (2020). Tác động của nhân tố kinh tế đến chính sách đối ngoại của Mỹ: Lịch sử và hiện tại. Tạp chí Khoa học Xã hội và Nhân văn, 6(1), 1-18.)","stmts":[{"t":"Để lôi kéo các nước đồng minh về phía mình, hạn chế ảnh hưởng của phe xã hội chủ nghĩa, Mỹ đã tiến hành thực hiện kế hoạch Mác-san.","ok":true},{"t":"Đoạn tư liệu trên đề cập đến việc xây dựng khối liên minh kinh tế giữa Mỹ và các nước Tây Âu sau Chiến tranh thế giới thứ hai.","ok":false},{"t":"Việc thực hiện kế hoạch Mác-san đã giúp Mĩ đạt được tất cả các mục tiêu chính sách đối ngoại của mình sau Chiến tranh thế giới thứ hai.","ok":false},{"t":"Mục tiêu chính Mỹ tiến hành kế hoạch Mác-san là lôi kéo các nước phương Tây để chống lại Liên Xô và các nước xã hội chủ nghĩa ở Đông Âu.","ok":true}],"id":"b2-124"},{"lesson":3,"part":1,"num":1,"stem":"Sau Chiến tranh lạnh, hầu hết các quốc gia đều điều chỉnh chiến lược, tập trung vào phát triển","opts":["chính trị.","quân sự.","kinh tế.","văn hóa."],"ans":2,"id":"b3-1"},{"lesson":3,"part":1,"num":2,"stem":"Từ sau Chiến tranh lạnh, hầu hết các quốc gia điều chỉnh chiến lược phát triển lấy kinh tế làm trọng điểm vì một trong những lí do nào sau đây?","opts":["Các cường quốc đã chấm dứt hoàn toàn chạy đua vũ trang.","Hòa bình và an ninh thế giới được bảo vệ ở mức cao nhất.","Sức mạnh của một quốc gia chỉ dựa trên sức mạnh về kinh tế.","Kinh tế trở thành nội dung căn bản trong quan hệ quốc tế."],"ans":3,"id":"b3-2"},{"lesson":3,"part":1,"num":3,"stem":"Trong xu thế đa cực hiện nay, đề vươn lên khẳng định vị thế các nước lớn đều tập trung","opts":["phát triển kinh tế làm trọng điểm.","phát triển khoa học công nghệ.","củng cố quốc phòng an ninh.","xây dựng sức mạnh tổng hợp."],"ans":3,"id":"b3-3"},{"lesson":3,"part":1,"num":4,"stem":"Sau khi Chiến tranh lạnh kết thúc, các quốc gia trên thế giới đều ra sức điều chỉnh chiến lược phát triển lấy kinh tế làm trọng tâm vì một trong những lí do nào sau đây?","opts":["Giữa các cường quốc đã chấm dứt việc chạy đua vũ trang.","Kinh tế phát triển tạo nên sức mạnh thực sự cho quốc gia.","Hòa bình và an ninh thế giới được bảo vệ ở mức cao nhất.","Xu thế toàn cầu hóa xuất hiện đòi hỏi các nước phải hội nhập."],"ans":1,"id":"b3-4"},{"lesson":3,"part":1,"num":5,"stem":"Hình thức cạnh tranh chủ yếu giữa các cường quốc từ sau khi Chiến tranh lạnh chấm dứt đến năm 2000 là","opts":["thành lập các tổ chức quân sự trên thế giới.","lôi kéo đồng minh vào các tổ chức quân sự.","xây dựng sức mạnh tổng hợp của quốc gia.","tăng cường các cuộc chạy đua vũ trang."],"ans":2,"id":"b3-5"},{"lesson":3,"part":1,"num":6,"stem":"Nội dung căn bản của quan hệ quốc tế sau thời kì Chiến tranh lạnh xoay quanh vấn đề","opts":["phát triển kinh tế.","xung đột sắc tộc, tôn giáo.","tranh chấp lãnh thổ.","chạy đua vũ trang."],"ans":0,"id":"b3-6"},{"lesson":3,"part":1,"num":7,"stem":"Sau Chiến tranh lạnh, lĩnh vực nào sau đây trở thành trung tâm trong quan hệ quốc tế?","opts":["Văn hóa.","Giáo dục.","Kinh tế.","Y tế."],"ans":2,"id":"b3-7"},{"lesson":3,"part":1,"num":8,"stem":"“Lấy phát triển kinh tế làm trọng điểm” được xem là nội dung chiến lược chủ yếu của các nước trong thời kỳ","opts":["ngay sau khi Chiến tranh lạnh bắt đầu.","sau khi cuộc Chiến tranh lạnh kết thúc.","chủ nghĩa xã hội thành hệ thống thế giới.","Chiến tranh thế giới thứ hai kết thúc."],"ans":1,"id":"b3-8"},{"lesson":3,"part":1,"num":9,"stem":"Từ sau Chiến tranh lạnh, hầu hết các quốc gia điều chỉnh chiến lược lấy phát triển kinh tế làm trung tâm vì","opts":["các nước giải quyết bất đồng, mâu thuẫn bằng thương lượng hòa bình.","hòa bình và an ninh thế giới được bảo vệ ở mức cao nhất.","giữa các cường quốc đã chấm dứt việc chạy đua vũ trang.","kinh tế trở thành nhân tố quyết định sức mạnh tổng hợp của quốc gia."],"ans":3,"id":"b3-9"},{"lesson":3,"part":1,"num":10,"stem":"Xét về bản chất, toàn cầu hóa là","opts":["sự phát triển nhanh chóng của quan hệ thương mại giữa các quốc gia trên thế giới.","sự tăng cường sáp nhập và hợp nhất các công ty thành những tập đoàn lớn trên toàn cầu.","sự tăng lên mạnh mẽ những mối liên hệ, tác động, phụ thuộc lẫn nhau giữa các nước.","sự ra đời của các tổ chức liên kết kinh tế, thương mại, tài chính quốc tế và khu vực."],"ans":2,"id":"b3-10"},{"lesson":3,"part":1,"num":11,"stem":"Xu thế toàn cầu hóa là hệ quả của","opts":["sự ra đời các công ty xuyên quốc gia.","cuộc cách mạng khoa học – công nghệ.","quá trình thống nhất thị trường thế giới.","sự phụ thuộc giữa các quốc gia trên thế giới."],"ans":1,"id":"b3-11"},{"lesson":3,"part":1,"num":12,"stem":"Trong xu thế hội nhập và toàn cầu hóa, việc đẩy mạnh hợp tác trên cơ sở tôn trọng độc lập, chủ quyền, toàn vẹn lãnh thổ, không can dự vào công việc nội bộ của nhau và cùng có lợi là","opts":["chủ trương chung của một số nước.","nhân tố thứ yếu của các mối quan hệ quốc tế.","nguyên tắc mang tính tất yếu.","xu thể hòa hoãn mang tính cục bộ."],"ans":2,"id":"b3-12"},{"lesson":3,"part":1,"num":13,"stem":"Xu thế nào sau dây là xu thế phát triển chính của thế giới sau Chiến tranh lạnh và là hệ quả cuộc cách mạng khoa học - công nghệ?","opts":["Xu thế đa cực.","Toàn cầu hoá.","Đối thoại giữa các nước lớn.","Lấy kinh tế làm trung tâm."],"ans":1,"id":"b3-13"},{"lesson":3,"part":1,"num":14,"stem":"Sự phát triển nhanh chóng của nền thương mại thế giới với vai trò ngày càng lớn của các công ty xuyên quốc gia là biểu hiện của xu thế nào sau khi chiến tranh lạnh chấm dứt?","opts":["Xu thế đối thoại, hòa hoãn giữa các nước lớn.","Xu thế lấy phát triển chính trị làm trung tâm.","Xu thế nhiều trung tâm trong quan hệ quốc tế.","Xu thế toàn cầu hóa ngày càng gia tăng mạnh mẽ."],"ans":3,"id":"b3-14"},{"lesson":3,"part":1,"num":15,"stem":"Sau Chiến tranh lạnh, xu thế chủ đạo trong quan hệ quốc tế là","opts":["đẩy mạnh vai trò quản lý của Liên hợp quốc.","đối thoại, thỏa hiệp, tránh xung đột trực tiếp.","hợp tác, không cạnh tranh, không mâu thuẫn.","không xung đột, hòa bình và tiến hành hợp tác."],"ans":1,"id":"b3-15"},{"lesson":3,"part":1,"num":16,"stem":"Nội dung nào sau đây phản ánh đúng xu thế phát triển của thế giới trong thập niên đầu sau Chiến tranh lạnh?","opts":["Tăng cường xây dựng liên minh quân sự.","Trật tự thế giới đơn cực được xác lập.","Xu thế đối thoại, hòa bình, hợp tác.","Các nước tăng cường chạy đua vũ trang."],"ans":2,"id":"b3-16"},{"lesson":3,"part":1,"num":17,"stem":"Từ sau Chiến tranh lạnh, các nước trên thế giới có sự điều chỉnh quan hệ theo hướng đối thoại, thoả hiệp và tránh xung đột trực tiếp, chủ yếu vì lí do nào sau đây?","opts":["Cần tập trung vào cuộc đấu tranh chống lại chủ nghĩa khủng bố.","Hợp tác địa - chính trị trở thành nội dung căn bản giữa các nước.","Muốn có môi trường thuận lợi để vươn lên xác lập vị thế quốc tế.","Mong muốn cắt giảm số lượng vũ khí hạt nhân của Nhật Bản."],"ans":2,"id":"b3-17"},{"lesson":3,"part":1,"num":18,"stem":"Từ thập niên 90 của thế kỉ XX, xu thế nào ngày càng chiếm ưu thế trong quan hệ quốc tế?","opts":["Nhất siêu, nhất cường.","Đối thoại, hợp tác.","Hòa hoãn Đông Tây.","Chạy đua vũ trang."],"ans":1,"id":"b3-18"},{"lesson":3,"part":1,"num":19,"stem":"Đặc điểm nổi bật trong quan hệ quốc tế sau khi chiến tranh lạnh chấm dứt là","opts":["Hợp tác chính trị - văn hóa là xu thế chủ đạo.","Hai siêu cường Xô - Mĩ đối thoại, hợp tác.","Hòa bình, hợp tác trở thành xu thế chủ đạo.","Hai siêu cường Xô - Mĩ đối đầu gay gắt."],"ans":2,"id":"b3-19"},{"lesson":3,"part":1,"num":20,"stem":"Sau Chiến tranh lạnh, các nước điều chỉnh quan hệ với nhau theo chiều hướng hòa hoãn, đối thoại, hợp tác chủ yếu là do","opts":["trật tự hai cực I-an-ta đã được xác lập","nhu cầu ổn định để phát triển kinh tế","kinh tế Liên Xô đang lâm vào khủng hoảng","Mỹ và Liên Xô hạn chế chạy đua vũ trang."],"ans":1,"id":"b3-20"},{"lesson":3,"part":1,"num":21,"stem":"Nội dung nào sau đây phản ánh đúng sự điều chỉnh quan hệ giữa các nước có chế độ chính trị khác nhau sau khi Chiến tranh lạnh chấm dứt?","opts":["Giảm dần sự cạnh tranh về kinh tế.","Thiết lập quan hệ đối tác chiến lược.","Hòa hoãn, đối thoại, cùng phát triển.","Giảm dần cuộc chạy đua vũ trang."],"ans":2,"id":"b3-21"},{"lesson":3,"part":1,"num":22,"stem":"Sau Chiến tranh lạnh, yếu tố nào sau đây thúc đẩy các nước điều chỉnh quan hệ theo hướng hòa hoãn, đối thoại, hợp tác là chủ yếu?","opts":["Công ty xuyên quốc gia có ảnh hưởng ngày càng lớn.","Tác động sâu sắc của vấn đề an ninh lương thực toàn cầu.","Nhu cầu ổn định chính trị để phát triển kinh tế.","Chủ nghĩa khủng bố đe dọa hòa bình thế giới."],"ans":2,"id":"b3-22"},{"lesson":3,"part":1,"num":23,"stem":"Nội dung nào sau đây không phản ánh đúng xu thế đối thoại, hợp tác trong quan hệ quốc tế sau khi chiến tranh lạnh chấm dứt?","opts":["Các nước giải quyết bất đồng và mâu thuẫn bằng thương lượng hòa bình.","Các nước xây dựng quan hệ hợp tác lâu dài trên cơ sở hai bên cùng có lợi.","Các nước liên minh với nhau hình thành các tổ chức quân sự lớn ở các châu lục.","Các nước điều chỉnh quan hệ theo hướng hòa hoãn, đối thoại đa phương hóa."],"ans":2,"id":"b3-23"},{"lesson":3,"part":1,"num":24,"stem":"Sau khi Chiến tranh lạnh kết thúc, các nước lớn điều chỉnh quan hệ đối ngoại theo hướng đối thoại, hợp tác chủ yếu nhằm mục đích gì?","opts":["Hòa bình, ổn định để phát triển kinh tế.","Hạn chế mọi tác động của khủng hoảng kinh tế.","Tập trung lực lượng để cạnh tranh quốc tế.","Xóa bỏ những mâu thuẫn đang tồn tại."],"ans":0,"id":"b3-24"},{"lesson":3,"part":1,"num":25,"stem":"“Các nước điều chỉnh quan hệ với nhau theo hướng hòa hoãn, đối thoại đa dạng hóa, đa phương hóa, xây dựng quan hệ hợp tác chiến lược ổn định và lâu dài” là một trong những nội dung của xu thế nào sau khi Chiến tranh lạnh kết thúc?","opts":["Xu thế đa cực.","Xu thế lấy phát triển kinh tế là trọng tâm.","Xu thế toàn cầu hóa.","Xu thế đối thoại, hợp tác trong quan hệ quốc tế."],"ans":3,"id":"b3-25"},{"lesson":3,"part":1,"num":26,"stem":"Trong bối cảnh quốc tế sau Chiến tranh lạnh diễn biến phức tạp, Chủ trương nhất quán của Đảng và Nhà nước Việt Nam là","opts":["tham gia vào các liên minh chính trị quốc tế và khu vực.","mở rộng việc hội nhập kinh tế quốc tế bằng mọi giá.","chủ động nắm bắt thời cơ, đi tắt đón đầu sự phát triển.","nhượng bộ các cường quốc để nâng tầm đối tác chiến lược."],"ans":2,"id":"b3-26"},{"lesson":3,"part":1,"num":27,"stem":"Trong xu thế của thế giới ngày nay, để tạo ra thời cơ cho sự phát triển, Việt Nam đã","opts":["nỗ lực vươn lên khẳng định vị thế, vai trò của mình trong quan hệ quốc tế.","chủ động tham gia các diễn đàn hợp tác với các cường quốc kinh tế thế giới.","tích cực tham gia vào các diễn đàn khu vực và quốc tế với vai trò điều phối.","mở rộng, thiết lập quan hệ hợp tác về ngoại giao và quân sự với các nước lớn."],"ans":0,"id":"b3-27"},{"lesson":3,"part":1,"num":28,"stem":"Cuối thế kỉ XX đầu thế kỉ XXI, để hội nhập vào nền kinh tế thế giới trong bối cảnh toàn cầu hóa, Việt Nam cần giữ vững nguyên tắc đối thoại nào?","opts":["Trung lập trước các vấn đề lớn của quốc tế.","Giữ vững độc lập, chủ quyền quốc gia dân tộc.","Có phương pháp đối thoại chung với mọi đối tác.","Lấy hội nhập chính trị làm cơ sở hội nhập kinh tế."],"ans":1,"id":"b3-28"},{"lesson":3,"part":1,"num":29,"stem":"Vấn đề nào sau đây có ý nghĩa sống còn đối với Đảng và nhân dân ta trong thời kỳ Đổi mới?","opts":["Nắm bắt thời cơ hội nhập quốc tế.","Tận dụng nguồn vốn từ bên ngoài.","Áp dụng thành tựu khoa học kĩ thuật.","Nắm bắt thời cơ vượt qua thách thức."],"ans":3,"id":"b3-29"},{"lesson":3,"part":1,"num":30,"stem":"Khái niệm “đa cực” được hiểu là","opts":["trạng thái địa – văn hoá toàn cầu với nhiều trung tâm quyền lực chi phối.","một trật tự mới với vai trò vượt trội của Mỹ, chi phối các nước khác.","một trật tự thế giới mà các nước vừa và nhỏ có vai trò quyết định.","trạng thái địa – chính trị toàn cầu với nhiều trung tâm quyền lực điều phối."],"ans":3,"id":"b3-30"},{"lesson":3,"part":1,"num":31,"stem":"Trong trật tự thế giới hiện nay, sự gia tăng vai trò của các trung tâm, tổ chức quốc tế cho thấy","opts":["những thay đổi về so sánh lực lượng trong quan hệ quốc tế.","sự phụ thuộc của các quốc gia vào các tổ chức quốc tế lớn.","nền kinh tế toàn cầu thực sự phát triển đồng đều, cân bằng.","ảnh hưởng bao trùm của các quan hệ hợp tác song phương."],"ans":0,"id":"b3-31"},{"lesson":3,"part":1,"num":32,"stem":"Tình trạng nhiều quốc gia, khu vực tạo ra thế cân bằng về kinh tế, chính trị, quân sự toàn cầu là biểu hiện của","opts":["xu thế đa cực.","trật tự đơn cực.","trật tự nhất siêu – đa cường.","trật tự nhất siêu – một trung tâm."],"ans":0,"id":"b3-32"},{"lesson":3,"part":1,"num":33,"stem":"“Không có một trung tâm quyền lực thống trị, thay vào đó, nhiều quốc gia, khu vực tạo ra thế cân bằng về kinh tế, chính trị, quân sự toàn cầu”. Đoạn thông tin trên phản ánh đặc điểm của trật tự thế giới theo xu hướng nào sao đây?","opts":["Đơn cực.","Hai cực.","Đa cực.","Không có cực."],"ans":2,"id":"b3-33"},{"lesson":3,"part":1,"num":34,"stem":"Một trật tự thế giới mà ở đó các nước lớn, các trung tâm kinh tế - tài chính lớn như Mỹ, Nhật Bản, Trung Quốc, Ấn Độ, Liên bang Nga,... có vị thế quan trọng đối với quan hệ quốc tế được gọi là trật tự","opts":["tam cường, đa phương.","đa cực, nhiều trung tâm.","đa phương hoá.","đơn cực, nhất siêu."],"ans":1,"id":"b3-34"},{"lesson":3,"part":1,"num":35,"stem":"Nội dung nào sau đây phản ánh đúng đặc điểm của trật tự thế giới mới được hình thành sau khi trật tự hai cực I-an-ta sụp đổ?","opts":["Mỹ và Trung Quốc là hai siêu cường nắm hoàn toàn quyền chi phối quan hệ quốc tế.","Vai trò của các trung tâm, các tổ chức kinh tế, tài chính quốc tế, khu vực bị suy giảm.","Sự hình thành trật tự là tiến trình lịch sử khách quan với sự nổi lên của các cường quốc.","Sự hình thành trật tự bị chi phối bởi kết quả của các cuộc đấu tranh giành độc lập dân tộc"],"ans":2,"id":"b3-35"},{"lesson":3,"part":1,"num":36,"stem":"Sau khi Chiến tranh lạnh chấm dứt, tổ chức nào sau đây đã nổ lực vươn lên trở thành một cực trong trật tự thế giới đa cực?","opts":["Liên minh châu Âu.","Hội đồng tương trợ kinh tế.","Tổ chức Hiệp ước Bắc Đại Tây Dương.","Diễn đàn hợp tác Á - Âu."],"ans":0,"id":"b3-36"},{"lesson":3,"part":1,"num":37,"stem":"Sau Chiến tranh lạnh, quốc gia nào sau đây ở châu Á là một trong những trung tâm quyền lực đang vươn lên khẳng định vị thế trong quan hệ quốc tế?","opts":["Mi-an-ma.","Ma-lai-xi-a.","Ấn Độ.","Cam-pu-chia."],"ans":2,"id":"b3-37"},{"lesson":3,"part":1,"num":38,"stem":"Trong xu thế đa cực, trung tâm quyền lực nào đã vươn lên mạnh mẽ để trở thành nền kinh tế lớn thứ hai thế giới (từ năm 2010)?","opts":["Liên bang Nga.","Trung Quốc.","Nhật Bản.","Ấn Độ."],"ans":1,"id":"b3-38"},{"lesson":3,"part":1,"num":39,"stem":"Sau Chiến tranh lạnh, các quốc gia nào sau đây là một trong những trung tâm quyền lực đang vươn lên khẳng định sức mạnh về kinh tế, quân sự và chính trị đối với quốc tế?","opts":["Xin-ga-po và Nam Phi.","Hà Lan và Tây Ban Nha.","Trung Quốc và Ấn Độ.","Bỉ và Mông Cổ."],"ans":2,"id":"b3-39"},{"lesson":3,"part":1,"num":40,"stem":"Trong xu thế đa cực, quốc gia nào sau đây đang phục hồi mạnh mẽ và trở thành một trong những cường quốc hàng đầu thế giới về quân sự, khoa học, kĩ thuật?","opts":["Liên bang Nga.","Mi-an-ma.","Bô-li-vi-a.","Xu-đăng."],"ans":0,"id":"b3-40"},{"lesson":3,"part":1,"num":41,"stem":"Quốc gia nào là một trong những trung tâm quyền lực mới nổi của thế giới từ đầu thế kỉ XXI?","opts":["Ấn Độ.","Liên Xô.","Mỹ.","Nhật Bản."],"ans":0,"id":"b3-41"},{"lesson":3,"part":1,"num":42,"stem":"Một trong những biểu hiện của xu thế đa cực đầu thế kỉ XXI là","opts":["bước đầu hình thành các liên minh kinh tế khu vực.","thị trường thế giới được hoàn toàn thống nhất.","Mỹ khống chế và chi phối tất cả tình hình thế giới.","vai trò ngày càng tăng của các trung tâm quyền lực."],"ans":3,"id":"b3-42"},{"lesson":3,"part":1,"num":43,"stem":"Nội dung nào sau đây không phải là biểu hiện của xu thế đa cực trong quan hệ quốc tế sau Chiến tranh lạnh?","opts":["Vai trò của các trung tâm, tổ chức kinh tế quốc tế và khu vực ngày càng lớn.","Các quốc gia vừa cạnh tranh vừa hợp tác nhằm tái thiết trật tự thế giới cũ.","Hoạt động của các công ty xuyên quốc gia có ảnh hưởng ngày càng lớn.","Sự suy giảm sức mạnh tương đối của Mỹ so với các cường quốc khác."],"ans":1,"id":"b3-43"},{"lesson":3,"part":1,"num":44,"stem":"Nội dung nào sau đây không phải là biểu hiện của xu thế đa cực?","opts":["Mỹ bị suy giảm sức mạnh tương đối trong tương quan lực lượng giữa các cường quốc.","Sự gia tăng sức mạnh, tầm ảnh hưởng và vị thế kinh tế, chính trị... của các nước lớn.","Cách mạng công nghiệp lần thứ ba đạt được nhiều thành tựu, đặc biệt là về kinh tế.","Vai trò của các trung tâm, tổ chức kinh tế, tài chính quốc tế và khu vực ngày càng lớn."],"ans":2,"id":"b3-44"},{"lesson":3,"part":1,"num":45,"stem":"Trong trật tự thế giới đa cực đang được hình thành sau Chiến tranh lạnh, sự gia tăng vai trò của các trung tâm, tổ chức quốc tế phản ánh điều gì?","opts":["Tương quan so sánh lực lượng mới trong quan hệ quốc tế.","Sự phát triển mạnh mẽ của hệ thống xã hội chủ nghĩa.","Sự ra đời và ảnh hưởng của các công ty xuyên quốc gia.","Thắng lợi to lớn của phong trào cách mạng trên thế giới."],"ans":0,"id":"b3-45"},{"lesson":3,"part":1,"num":46,"stem":"Sự hình thành của xu thế đa cực, nhiều trung tâm sau khi Chiến tranh lạnh chấm dứt không có tác động nào sau đây đối với tình hình thế giới và quan hệ quốc tế?","opts":["Góp phần củng cố hoà bình, an ninh.","Giữ vững sự ổn định trật tự thế giới.","Hạn chế khả năng chi phối thế giới của Mỹ.","Thúc đẩy sự ra đời của xu thế toàn cầu hoá."],"ans":3,"id":"b3-46"},{"lesson":3,"part":1,"num":47,"stem":"Nội dung nào sau đây là một trong những biểu hiện của xu thế đa cực trong quan hệ quốc tế sau Chiến tranh lạnh?","opts":["Sự gia tăng sức mạnh, tầm ảnh hưởng của các nước lớn.","Bức tường Béc-lin sụp đổ, nước Đức tái thống nhất.","Cuộc chạy đua vũ trang không hồi kết giữa Mỹ và Liên Xô.","Các liên minh quân sự được thành lập (NATO, Vác-xa-va)."],"ans":0,"id":"b3-47"},{"lesson":3,"part":1,"num":48,"stem":"Nội dung nào sau đây phản ảnh đúng đặc điểm của trật tự thế giới sau Chiến tranh lạnh?","opts":["Có sự cân bằng giữa hai hệ thống xã hội đối lập.","Được thành lập ngay sau khi Chiến tranh lạnh kết thúc.","Sức mạnh của Mỹ được tăng cường tuyệt đối.","Lợi ích của dân tộc được đặt lên vị trí hàng đầu."],"ans":3,"id":"b3-48"},{"lesson":3,"part":1,"num":49,"stem":"Trong xu thế đa cực, để vươn lên khẳng định vị thế của mình, các quốc gia lựa chọn phương thức đối ngoại chủ yếu nào?","opts":["Vừa cạnh tranh, vừa hợp tác.","Vừa đối đầu, vừa hòa hoãn.","Vừa xung đột, vừa hòa bình.","Vừa tiếp xúc, vừa giao thoa."],"ans":0,"id":"b3-49"},{"lesson":3,"part":1,"num":50,"stem":"Nội dung nào sau đây thể hiện tác động của xu thế đa cực đối với quan hệ quốc tế?","opts":["Mĩ, Trung Quốc quyết định và chi phối sự phát triển của các quốc gia trên thế giới.","Chấm dứt hoàn toàn những cuộc xung đột vũ trang, xung đột sắc tộc trên thế giới.","Tạo điều kiện cho các cường quốc mới nổi có vai trò lớn trong quan hệ quốc tế.","Mĩ ngày càng mở rộng phạm vi ảnh hưởng và chi phối mạnh mẽ quan hệ quốc tế."],"ans":2,"id":"b3-50"},{"lesson":3,"part":1,"num":51,"stem":"Sau Chiến tranh lạnh kết thúc, sự vươn lên mạnh mẽ của các cường quốc về kinh tế, chính trị, quân sự, đối ngoại,... đã dẫn đến điều gì?","opts":["Sự suy giảm sức mạnh tương đối của Mỹ.","Mỹ không còn vai trò dẫn đầu phe tư bản chủ nghĩa.","Sự thống trị của chủ nghĩa tư bản trên thế giới.","Nguy cơ về xung đột vũ trang giữa các cường quốc."],"ans":0,"id":"b3-51"},{"lesson":3,"part":1,"num":52,"stem":"Sau Chiến tranh lạnh, các quốc gia nào sau đây là một trong những trung tâm quyền lực đang vươn lên khẳng định sức mạnh về kinh tế, quân sự và chính trị đối với quốc tế?","opts":["Xi-ga-po và Nam Phi.","I-ta-li-a và Mông Cổ.","Đan Mạch và Tây Ban Nha.","Nga và Nhật Bản."],"ans":3,"id":"b3-52"},{"lesson":3,"part":1,"num":53,"stem":"Nội dung nào phản ánh đúng vị trí, vai trò của Mỹ trong trật tự thế giới đa cực hiện nay?","opts":["Suy giảm sức mạnh tương đối trong tương quan với các cường quốc khác.","Vươn lên ngôi vị bá chủ, thao túng các đồng minh của Mỹ.","Vẫn duy trì được trật tự thế giới đơn cực, bá chủ thế giới.","Vẫn duy trì được vai trò trung tâm, giữ vững ưu thế tuyệt đối về tài chính."],"ans":0,"id":"b3-53"},{"lesson":3,"part":1,"num":54,"stem":"Trong trật tự thế giới thế giới mới sau Chiến tranh lạnh, quốc gia nào sau đây có ảnh hưởng lớn nhất đến quan hệ quốc tế?","opts":["Ân Độ.","Nhật Bản","Mỹ.","Anh."],"ans":2,"id":"b3-54"},{"lesson":3,"part":1,"num":55,"stem":"Từ đầu thế kỉ XXI, quốc gia châu Á nào sau đây đang ngày càng gia tăng sức mạnh và tầm hường về kinh tế, chính trị, quân sự đối với thế giới?","opts":["Ai Cập.","Ba Lan.","Phần Lan.","Trung Quốc."],"ans":3,"id":"b3-55"},{"lesson":3,"part":1,"num":56,"stem":"Nội dung nào sau đây không phải là biểu hiện của xu thế đa cực?","opts":["Mỹ bị suy giảm sức mạnh tương đối trong tương quan so sánh với các cường quốc khác.","Liên bang Nga và các nước Đông Âu thành lập tổ chức Hội đồng tương trợ kinh tế, chính trị.","Các trung tâm quyền lực ngày càng vươn lên khẳng định tầm ảnh hưởng về kinh tế, chính trị.","Vai trò ngày càng gia tăng của các trung tâm, tổ chức kinh tế, tài chính quốc tế, khu vực."],"ans":1,"id":"b3-56"},{"lesson":3,"part":1,"num":57,"stem":"Sau khi Trật tự thế giới hai cực I-an-ta sụp đổ (1991), quốc gia nào sau đây ra sức thiết lập trật tự thế giới đơn cực?","opts":["Nga.","Nhật Bản.","Mỹ.","Ấn Độ."],"ans":2,"id":"b3-57"},{"lesson":3,"part":1,"num":58,"stem":"Nhận xét nào sau đây không đúng khi nói về vị thế của Mỹ sau khi chiến tranh lạnh chấm dứt?","opts":["Là nước có quy mô kinh tế lớn nhất thế giới.","Là nước có ảnh hưởng lớn nhất đến quan hệ quốc tế.","Là nước xã hội chủ nghĩa hùng mạnh nhất thế giới.","Vươn lên thành một cực trong trật tự thế giới đa cực"],"ans":2,"id":"b3-58"},{"lesson":3,"part":1,"num":59,"stem":"Sau khi chiến tranh lạnh chấm dứt, quốc gia nào sau đây ở châu Á đã nổ lực vươn lên trở thành một cực trong trật tự thế giới đa cực?","opts":["Mỹ","Anh","Pháp","Nhật Bản"],"ans":3,"id":"b3-59"},{"lesson":3,"part":1,"num":60,"stem":"Trong trật tự thế giới đa cực, hai cực có tầm ảnh hưởng lớn nhất là","opts":["Nhật Bản và Trung Quốc","Mỹ và Trung Quốc","Nhật Bản và Ấn Độ","Liên bang Nga và Ấn Độ"],"ans":1,"id":"b3-60"},{"lesson":3,"part":1,"num":61,"stem":"Sau khi chiến tranh lạnh chấm dứt, nước xã hội chủ nghĩa nào sau đây đã vươn lên trở thành một cực trong trật tự thế giới đa cực?","opts":["Liên bang Nga","Trung Quốc","Ấn Độ","Nhật Bản"],"ans":1,"id":"b3-61"},{"lesson":3,"part":1,"num":62,"stem":"Nội dung nào sau đây phản ánh điểm khác biệt giữa trật tự thế giới mới sau Chiến tranh lạnh so với trật tự hai cực I-an-ta?","opts":["Bị chi phối bởi quyền lợi của các cường quốc.","Hòa bình, đối thoại, hợp tác là xu thế chủ đạo.","Hình thành sau khi chiến tranh thế giới kết thúc.","Các nước tập trung phát triển quân sự là trọng điểm."],"ans":1,"id":"b3-62"},{"lesson":3,"part":1,"num":63,"stem":"Nội dung nào sau đây phản ánh đúng điểm tương đồng giữa trật tự thế giới mới sau Chiến tranh lạnh so với trật tự hai cực I-an-ta?","opts":["Tồn tại hai hệ thống kinh tế - xã hội đối lập nhau","Được hình thành khi chiến tranh thế giới kết thúc","Các nước lớn giữ vai trò điều phối quan hệ quốc tế","Các nước tập trung phát triển kinh tế là trọng điểm."],"ans":2,"id":"b3-63"},{"lesson":3,"part":1,"num":64,"stem":"Trong xu thế đa cực, tổ chức kinh tế, tài chính khu vực nào sau đây có vai trò ngày càng lớn đối với sự phát triển của thế giới?","opts":["Liên minh châu (EU).","UNICEF.","WHO.","UNESCO."],"ans":0,"id":"b3-64"},{"lesson":3,"part":1,"num":65,"stem":"Trong xu thế đa cực, quốc gia nào vẫn giữ vị trí số 1 thế giới về kinh tế, nhưng đang ngày càng bị giảm dần trước sự nổi lên của các trung tâm khác?","opts":["Ấn Độ.","Mỹ","Inđônêxia.","Mianma."],"ans":1,"id":"b3-65"},{"lesson":3,"part":1,"num":66,"stem":"Năm 1999, nhóm 20 nền kinh tế lớn nhất thế giới (G20) được thành lập, trở thành trung tâm điều phối các nỗ lực quốc tế nhằm mục đích","opts":["chi phối các hoạt động kinh tế thế giới.","tăng cường hợp tác kinh tế, văn hoá, xã hội.","thúc đẩy sự phát triển kinh tế thế giới.","thúc đẩy hoà bình và ổn định khu vực."],"ans":2,"id":"b3-66"},{"lesson":3,"part":1,"num":67,"stem":"Nhận xét nào sau đây phản ánh đúng tác động của các trung tâm, các tổ chức kinh tế, tài chính quốc tế và khu vực tới quan hệ quốc tế sau Chiến tranh lạnh?","opts":["Hạn chế sự phát triển của xu thế toàn cầu hóa.","Làm suy giảm hoàn toàn ảnh hưởng của các nước lớn.","Làm giảm sự phụ thuộc lẫn nhau giữa các quốc gia.","Củng cố xu thế đa cực, nhiều trung tâm."],"ans":3,"id":"b3-67"},{"lesson":3,"part":1,"num":68,"stem":"Từ thân phận thuộc địa - phụ thuộc, ngày nay cả Ấn Độ và Trung Quốc đều trở thành các trung tâm quyền lực lớn trong trật tự thế giới theo xu thế đa cực là do","opts":["mối quan hệ giữa hai nước luôn tốt đẹp và hỗ trợ nhau cùng phát triển.","hai nước này đều có mối quan hệ hợp tác tốt với cả hai nước Nga và Mĩ.","sức mạnh quốc gia tổng hợp của mỗi nước không ngừng được gia tăng.","hai nước này đều có lãnh thổ rộng lớn và có dân số đông nhất thế giới."],"ans":2,"id":"b3-68"},{"lesson":3,"part":1,"num":69,"stem":"Một trong những điểm khác biệt của Trật tự thế giới theo xu thế đa cực so với Trật tự hai cực I-an-ta là","opts":["Mĩ là nước đứng đầu hệ thống tư bản chủ nghĩa.","Liên Xô đứng đầu hệ thống xã hội chủ nghĩa.","Vai trò chi phối của Mỹ ngày càng giảm sút.","Các cường quốc hoàn toàn không có mâu thuẫn."],"ans":2,"id":"b3-69"},{"lesson":3,"part":1,"num":70,"stem":"Trước xu thế đa cực và sự gia tăng vai trò của các trung tâm, tổ chức quốc tế và khu vực, Việt Nam cần làm gì để nâng cao vị thế trên trường quốc tế?","opts":["Giảm bớt quan hệ hợp tác với các nước lớn để tránh bị phụ thuộc về chính trị, kinh tế.","Tập trung phát triển nội lực, bằng mọi giá phải tiếp xúc với các tổ chức khu vực và Mỹ.","Xây dựng chính sách đối ngoại chủ động dựa hoàn toàn vào các cường quốc truyền thống.","Tăng cường tham gia các tổ chức quốc tế để thích ứng với thay đổi cục diện thế giới."],"ans":3,"id":"b3-70"},{"lesson":3,"part":1,"num":71,"stem":"Nhận xét nào sau đây là đúng và đầy đủ về tác động của xu thế đa cực đối với Việt Nam?","opts":["Giúp cho Việt Nam ứng dụng thành công cách mạng khoa học – công nghệ.","Tạo ra cho Việt Nam những thời cơ và thách thức trong hội nhập quốc tế.","Hỗ trợ Việt Nam tham gia sâu rộng vào các diễn đàn kinh tế thế giới.","Thúc đẩy Việt Nam xây dựng một nền văn hóa đậm đà bản sắc dân tộc."],"ans":1,"id":"b3-71"},{"lesson":3,"part":1,"num":72,"stem":"Trong xu thế phát triển chung của thế giới hiện nay, thời cơ Việt Nam có thể tận dụng để xây dựng và phát triển đất nước là gì?","opts":["Không bị áp dụng luật chống bán phá giá.","Sự ổn định tình hình chính trị trong nước.","Thu hút vốn, tiếp thu thành tựu khoa học.","Mua được các bằng phát minh với giá rẻ."],"ans":2,"id":"b3-72"},{"lesson":3,"part":1,"num":73,"stem":"Trong 30 năm đầu thế kỉ XX, Mỹ, Trung Quốc, Liên Minh Châu Âu, Nhật Bản, Liên bang Nga, Ấn Độ vẫn đóng vai trò là","opts":["một cực trong xu thế đa cực, nhiều trung tâm.","một số trung tâm quyền lực của thế giới.","các cường quốc chi phối trật tự thế giới đa cực.","một cực trong thế giới nhất siêu - đơn cực."],"ans":1,"id":"b3-73"},{"lesson":3,"part":1,"num":74,"stem":"Trong số các trung tâm quyền lực của thế giới hiện nay, Mỹ vẫn là","opts":["cường quốc số một, có sức mạnh vượt trội trên nhiều lĩnh vực.","cường quốc duy nhất trên thế giới có vũ khí hạt nhân.","siêu cường duy nhất, thống trị các quốc gia trên thế giới.","siêu cường toàn cầu, quyết định mọi vấn đề của Liên hợp quốc."],"ans":0,"id":"b3-74"},{"lesson":3,"part":1,"num":75,"stem":"Sau Chiến tranh lạnh, nhiều tổ chức kinh tế - tài chính khu vực, liên khu vực có vai trò ngày càng lớn đối với sự phát triển của thế giới, ngoại trừ","opts":["Liên minh châu Âu (EU).","Hiệp hội các quốc gia Đông Nam Á (ASEAN).","Diễn đàn hợp tác Á Âu (ASEM).","Hội đồng Tương trợ kinh tế (SEV)."],"ans":3,"id":"b3-75"},{"lesson":3,"part":1,"num":76,"stem":"“Gồm các nước nhóm G7, chiếm 2/3 dân số thế giới, 90% GDP toàn cầu và 80% thương mại thế giới” là nội dung đề cập tới","opts":["nhóm nước G20.","Liên minh châu Âu (EU).","các nước ASEAN.","các nước công nghiệp mới."],"ans":0,"id":"b3-76"},{"lesson":3,"part":1,"num":77,"stem":"Vị thế của Trung Quốc trong trật tự thế giới mới đang vận động hình thành sau khi Chiến tranh lạnh chấm dứt là","opts":["“một cực” trong xu thế đa cực.","“một cực” trong trật tự đa cực.","chi phối và thống trị châu Á.","“một cực” duy nhất ở châu Á."],"ans":0,"id":"b3-77"},{"lesson":3,"part":1,"num":78,"stem":"Sau Chiến tranh lạnh, trật tự thế giới đa cực, nhiều trung tâm được hình thành do tác động chủ yếu nào sau đây?","opts":["Tham vọng và âm mưu bá chủ thế giới của Mỹ.","Sự thay đổi tương quan lực lượng giữa các nước.","Sự xuất hiện quan hệ song phương thay cho đối đầu.","Phạm vi ảnh hưởng của Liên Xô ngày càng tăng."],"ans":1,"id":"b3-78"},{"lesson":3,"part":1,"num":79,"stem":"Nội dung nào sau đây không phải là nhân tố tác động đến sự hình thành trật tự thế giới mới sau khi Chiến tranh lạnh chấm dứt?","opts":["Sự lớn mạnh của các lực lượng cách mạng thế giới.","Sự lớn mạnh và ảnh hưởng của hệ thống xã hội chủ nghĩa.","Sự phát triển của cách mạng khoa học - công nghệ.","Thực lực kinh tế, chính trị, quân sự của các cường quốc."],"ans":1,"id":"b3-79"},{"lesson":3,"part":1,"num":80,"stem":"Một trong những yếu tố tác động đến sự hình thành trật tự thế giới mới sau Chiến tranh lạnh là","opts":["tư bản tài chính xuất hiện và chi phối nền kinh tế thế giới.","sự xuất hiện và mở rộng ngày càng nhiều các công ty độc quyền.","sự phát triển của các cường quốc và Liên minh châu Âu (EU).","các trung tâm kinh tế - tài chính Tây Âu và Nhật Bản ra đời."],"ans":2,"id":"b3-80"},{"lesson":3,"part":1,"num":81,"stem":"Trong những thập niên đầu của thế kỉ XXI, nhân tố nào sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trong cục diện thế giới?","opts":["Sự vươn lên mạnh mẽ của Nhật Bản và Tây Âu.","Cuộc chạy đua vũ trang giữa Mỹ và Liên Xô.","Sự phát triển của cách mạng khoa học - kĩ thuật.","Mỹ khống chế và chi phối Trung Quốc, Tây Âu."],"ans":2,"id":"b3-81"},{"lesson":3,"part":1,"num":82,"stem":"Nhân tố nào sau đây đóng vai trò quyết định để các cường quốc tham gia xác lập trật tự thế giới mới sau Chiến tranh lạnh?","opts":["Là một trong năm cường quốc của Hội đồng Bảo an Liên hợp quốc.","Sự ra đời và ngày càng mở rộng của các tổ chức liên kết khu vực.","Sức mạnh tổng hợp của quốc gia, trong đó kinh tế vẫn là trụ cột.","Sức mạnh quân sự của quốc gia với lực lượng quân sự hùng hậu."],"ans":2,"id":"b3-82"},{"lesson":3,"part":1,"num":83,"stem":"Một trong những nhân tố quan trọng tác động đến sự hình thành trật tự thế giới mới sau khi chiến tranh lạnh chấm dứt là","opts":["sự hình thành và lớn mạnh của hệ thống xã hội chủ nghĩa","sự phát triển mạnh mẽ của cách mạng khoa học-công nghệ","cuộc chạy đua về vũ khí hạt nhân giữa các cường quốc.","cuộc đấu tranh giành độc lập của các dân tộc thuộc địa."],"ans":1,"id":"b3-83"},{"lesson":3,"part":2,"num":84,"stem":"Đọc đoạn tư liệu sau: “Trật tự thế giới mới này được hình thành như thế nào, còn tuỳ thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị, quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp ... Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa.); Sự phát triển của cách mạng khoa học - kĩ thuật sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trên cục diện thế giới\". (Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr.424)","stmts":[{"t":"Một trong những yếu tố quy định trật tự thế giới mới hiện nay là cuộc chạy đua sức mạnh tổng lực của các cường quốc, lấy sức mạnh quân sự làm trung tâm.","ok":false},{"t":"Đoạn tư liệu phản ánh nhận thức và quan điểm của tác giả về tình hình thế giới trong thời kì Chiến tranh lạnh.","ok":false},{"t":"Trong trật tự thế giới mới hiện nay, Mỹ và Trung Quốc là hai cực có vị trí rất quan trọng.","ok":true},{"t":"Sau Chiến tranh lạnh, xu hướng thế giới chuyển dịch sang cục diện “đa cực” là cơ sở để nhiều quốc gia theo đuổi chủ nghĩa đa phương, coi trọng đối ngoại đa phương.","ok":true}],"id":"b3-84"},{"lesson":3,"part":2,"num":85,"stem":"Cho đoạn tư liệu sau đây: “Trật tự thế giới mới này được hình thành như thế nào, còn tuỳ thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị, quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp..... Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa....); Sự phát triển của cách mạng khoa học - kĩ thuật sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trên cục diện thế giới”. (Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr.424)","stmts":[{"t":"Sự sụp đổ của Trật tự thế giới hai cực I-an-ta và Chiến tranh lạnh kết thúc đã mở ra thời kì mới trong quan hệ quốc tế.","ok":true},{"t":"Trong trật tự thế giới đa cực đang hình thành, Mỹ và Liên bang Nga là hai trung tâm quyền lực lớn nhất chi phối quan hệ quốc tế.","ok":false},{"t":"Sự phát triển của cuộc cách mạng khoa học - kĩ thuật là một trong những nhân tố tác động đến hình thành trật tự thế giới mới.","ok":true},{"t":"Sức mạnh tổng hợp của các cường quốc Mỹ, Liên bang Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức,... góp phần định hình trật tự thế giới đa cực.","ok":true}],"id":"b3-85"},{"lesson":3,"part":2,"num":86,"stem":"Đọc đoạn tư liệu sau đây: “Trật tự thế giới mới này được hình thành như thế nào, còn tùy thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp... Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa,...); Sự phát triển của cách mạng khoa học - kĩ thuật sẽ còn tiếp tục tạo ra những \"đột phá\" và biến chuyển trên cục diện thế giới\". (Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr. 424)","stmts":[{"t":"Để có thể trở thành một cực trong xu thế đa cực hiện nay, các nước phải có chiến lược xây dựng sức mạnh tổng hợp, trong đó sức mạnh kinh tế là trụ cột.","ok":true},{"t":"Trong trật tự thế giới mới sau Chiến tranh lạnh, ASEAN trở thành tổ chức duy nhất liên kết khu vực chặt chẽ trên nhiều lĩnh vực, có ảnh hưởng trên phạm vi toàn cầu.","ok":false},{"t":"Trong trật tự thế giới đa cực, nhiều trung tâm, Trung Quốc vươn lên mạnh mẽ, vượt Nhật Bản (2010) để trở thành nền kinh tế lớn thứ hai thế giới.","ok":true},{"t":"Trong trật tự thế giới mới sau Chiến tranh lạnh, Mỹ đã vươn lên trở thành quốc gia duy nhất có vị thế, ảnh hưởng hàng đầu và thực hiện được âm mưu bá chủ thế giới.","ok":false}],"id":"b3-86"},{"lesson":3,"part":2,"num":87,"stem":"Đọc đoạn tư liệu sau đây: “Thế giới phát triển nhanh chóng theo hướng đa cực, tuy vậy cục diện đa cực chưa hẳn đã hình thành mà đang trải qua thời kỳ quá độ từ Trật tự cũ để tiến tới một Trật tự mới. Có người dự đoán thời kỳ quá độ này phải kéo dài trong nhiều năm, có thể từ 30 đến 50 năm, bởi sự chuyển đổi cục diện thế giới lần này mang đặc điểm mới, quan trọng nhất là không trải qua chiến tranh như các cục diện trước kia. Thế giới đang trong tình hình \"một siêu cường, nhiều cường quốc\", đó là các nước Mỹ, Tây Âu (EU), Nhật Bản, Nga và Trung Quốc”. (Vũ Dương Ninh, Một số chuyên đề Lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, 2002, tr.399)","stmts":[{"t":"Đoạn tư liệu trên thể hiện quá trình hình thành và xác lập của trật tự thế giới đa cực.","ok":false},{"t":"Cục diện đa cực chưa hẳn đã hình thành chủ yếu vì Chiến tranh lạnh chưa kết thúc hoàn toàn.","ok":false},{"t":"Mỹ, các cường quốc hàng đầu trong EU, Nhật Bản, Nga và Trung Quốc đã trở thành các trung tâm quyền lực trong trật tự thế giới mới.","ok":true},{"t":"Trật tự thế giới mới sau Chiến tranh lạnh có điểm tương đồng với trật tự thế giới trước đó là không có các cuộc chiến tranh cục bộ.","ok":false}],"id":"b3-87"},{"lesson":3,"part":2,"num":88,"stem":"Đọc đoạn tư liệu sau đây: “Trật tự thế giới này được hình thành như thế nào, còn tùy thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị, quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp...; Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa);... Sự phát triển của cách mạng khoa học- kĩ thuật sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trên cục diện thế giới\". (Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr.424)","stmts":[{"t":"Nhân tố đóng vai trò quyết định đến sự hình thành trật tự thế giới hiện nay là cuộc chạy đua sức mạnh quốc gia tổng hợp, trong đó sức mạnh kinh tế là trụ cột.","ok":true},{"t":"“Trật tự thế giới” được nhắc đến trong đoạn tư liệu trên là trật tự thế giới “hai cực Ianta” được hình thành sau Chiến tranh thế giới thứ hai.","ok":false},{"t":"Một trong những đặc điểm nổi bật của trật tự thế giới mới được thiết lập sau Chiến tranh lạnh là thế giới bị chia thành hai hệ thống xã hội đối lập.","ok":false},{"t":"Một trong những nhân tố tác động đến sự hình thành trật tự thế giới mới sau khi Chiến tranh lạnh kết thúc là sự vươn lên mạnh mẽ của các nước Á, Phi, Mỹ-latinh.","ok":true}],"id":"b3-88"},{"lesson":3,"part":2,"num":89,"stem":"Đọc đoạn tư liệu sau: “Khác với các trật tự thế giới trước đây thường được thiết lập ngay sau khi chiến tranh kết thúc, trật tự thế giới mới đã không thể ra đời ngay sau khi Liên Xô tan rã. [...] Liên Xô tan rã nhưng Liên bang Nga vẫn tiếp tục tồn tại với tiềm lực quân sự kế thừa Liên Xô cũ và không phải là một cường quốc bại trận để chấp nhận một trật tự thế giới do Mĩ áp đặt. Các trung tâm kinh tế, các cường quốc khu vực như Tây Âu, Nhật Bản, Trung Quốc... không ngừng lớn mạnh và cố gắng tạo cho mình một vị thế đáng kể để chia sẻ quyền lực chi phối đời sống chính trị quốc tế.\" (Trần Thị Vinh (Cb), Lịch sử thế giới hiện đại, Quyển 2, NXB Đại học Sư phạm, Hà Nội, 2016, tr.99)","stmts":[{"t":"Sau năm 1991, Liên bang Nga và Mĩ ngày càng có quan hệ ngoại giao tốt đẹp hơn.","ok":false},{"t":"Đoạn tư liệu trên đề cập đến tình hình thế giới sau Chiến tranh lạnh.","ok":true},{"t":"Sau khi Liên Xô tan rã, tình hình thế giới phát triển theo xu thế “đơn cực”.","ok":false},{"t":"Chiến tranh lạnh kết thúc, Việt Nam đẩy mạnh hội nhập khu vực và quốc tế.","ok":true}],"id":"b3-89"},{"lesson":3,"part":2,"num":90,"stem":"Đọc đoạn tư liệu sau đây: “Thế giới phát triển nhanh chóng theo hướng đa cực, tuy vậy cục diện đa cực chưa hẳn đã hình thành mà đang trải qua thời kỳ quá độ từ Trật tự cũ để tiến tới một Trật tự mới. Có người dự đoán thời kỳ quá độ này phải kéo dài trong nhiều năm, có thể từ 30 đến 50 năm, bởi sự chuyển đổi cục diện thế giới lần này mang đặc điểm mới, quan trọng nhất là không trải qua chiến tranh như các cục diện trước kia. Thế giới đang trong tình hình “một siêu cường, nhiều cường quốc”, đó là các nước Mỹ, Tây Âu (EU), Nhật Bản, Nga và Trung Quốc.\" (Vũ Dương Ninh, Một số chuyên đề Lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, 2002, tr.399)","stmts":[{"t":"Điểm tương đồng của Trật tự đa cực và Trật tự thế giới hai cực I-an-ta là đều hình thành sau các cuộc chiến tranh thế giới.","ok":false},{"t":"Thế giới phát triển nhanh chóng theo hướng đa cực từ những năm 50 của thế kỷ XX.","ok":false},{"t":"Xu thế chính trong quan hệ quốc tế sau Chiến tranh lạnh là xu thế hòa bình, hợp tác và phát triển.","ok":true},{"t":"Mỹ, Liên minh châu Âu (EU), Nhật Bản, Nga và Trung Quốc là những trung tâm quyền lực có vai trò, vị trí quan trọng đối với thế giới.","ok":true}],"id":"b3-90"},{"lesson":3,"part":2,"num":91,"stem":"Đọc đoạn tư liệu sau đây: “Sau khi Chiến tranh lạnh kết thúc, so sánh lực lượng trên bình diện toàn cầu từ chỗ cân bằng giữa hai hệ thống chính trị – xã hội đối lập nay chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mĩ và phương Tây. Tuy nhiên, tình hình quốc tế đã không phát triển một cách hòa bình, ổn định như người ta mong đợi. Sự đối đầu Đông – Tây về hệ tư tưởng, chính trị, quân sự, kinh tế [...] đã từng chi phối đời sống quốc tế trong suốt thời kỳ Chiến tranh lạnh, nay được chuyển hóa dưới những hình thức khác, bên cạnh sự nổi lên của những mâu thuẫn mới. Sự vận động của các mâu thuẫn này sẽ quyết định diện mạo của trật tự thế giới và xu hướng phát triển của quan hệ quốc tế sau Chiến tranh lạnh.” (Trần Thị Vinh (Chủ biên), Lịch sử thế giới hiện đại, Quyển 2, NXB Đại học sư phạm, Hà Nội, 2008, tr. 102-103).","stmts":[{"t":"Cụm từ “hai hệ thống chính trị – xã hội đối lập” được nhắc đến trong đoạn tư liệu trên là để chỉ mối quan hệ giữa hệ thống tư bản chủ nghĩa và hệ thống xã hội chủ nghĩa.","ok":true},{"t":"Sau Chiến tranh lạnh, đấu tranh về hệ tư tưởng không còn, đánh dấu môi trường an ninh quốc tế phát triển hoà bình, ổn định.","ok":false},{"t":"Mâu thuẫn về lợi ích dân tộc là một trong những yếu tố tác động đến việc hình thành trật tự thế giới sau Chiến tranh lạnh.","ok":true},{"t":"Sau khi Chiến tranh lạnh kết thúc, Mĩ, Nga, Trung Quốc là những cường quốc có vị thế, vai trò và ảnh hưởng hàng đầu thế giới.","ok":true}],"id":"b3-91"},{"lesson":3,"part":2,"num":92,"stem":"Cho bảng dữ liệu sau đây:","stmts":[{"t":"Sự gia tăng sức mạnh trong nhiều lĩnh vực đã đưa Trung Quốc, Liên Bang Nga, Ân Độ trở thành những trung tâm quyền lực mới trong quan hệ quốc tế.","ok":true},{"t":"Từ sau Chiến tranh lạnh, sự suy giảm vị thế của Mỹ là nhân tố quyết định hình thành xu thế đa cực trong quan hệ quốc tế.","ok":false},{"t":"Bảng thông tin phản ánh sự vươn lên mạnh mẽ và vị thế quốc tế của Trung Quốc, Liên Bang Nga, Ấn Độ, G20, APEC.","ok":true},{"t":"Sự hình thành những trung tâm quyền lực mới trong quan hệ quốc tế tạo thời cơ và thách thức đối với sự phát triển của Việt Nam hiện nay.","ok":true}],"table":[["Quốc gia/ Tổ chức","Nội dung"],["Mỹ","Mặc dù Mỹ vẫn giữ vị trí số một thế giới về kinh tế và các lĩnh vực như: vốn, khoa học - công nghệ,... nhưng vị thế của nước này đang ngày càng bị giảm dần trước sự nổi lên của các trung tâm khác."],["Trung Quốc","Vươn lên mạnh mẽ, vượt Nhật Bản (năm 2010) để trở thành nền kinh tế lớn thứ hai thế giới (sau Mỹ), sức mạnh quân sự không ngừng được gia tăng."],["G20","Nhóm 20 nền kinh tế lớn nhất thế giới (G20) chiếm 2/3 dân số thế giới, 90% GDP toàn cầu và 80% thương mại quốc tế. Được thành lập năm 1999, G20 trở thành trung tâm điều phối các nỗ lực quốc tế nhằm thúc đẩy sự phát triển kinh tế thế giới."],["APEC","Diễn đàn hợp tác kinh tế châu Á - Thái Bình Dương (APEC) được thành lập tháng 11-1989, hiện có 21 thành viên, chiếm khoảng 38% số dân, 62% GDP và gần 50% thương mại thế giới."],["Liên bang Nga","Phục hồi mạnh mẽ, là một trong những cường quốc hàng đầu về quân sự, khoa học, kĩ thuật."],["Ấn Độ","Trở thành cường quốc kinh tế, quân sự, khoa học, kĩ thuật...; có ảnh hưởng lớn trong quan hệ quốc tế."]],"id":"b3-92"},{"lesson":3,"part":2,"num":93,"stem":"Cho đoạn tư liệu sau đây: “Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô - Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế -chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học - kĩ thuật”. (Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, Hà Nội, 2001, tr.401)","stmts":[{"t":"Liên Xô và Mỹ đều suy giảm vị thế trong thời kỳ Chiến tranh lạnh vì phương thức đối đầu chính trị - quân sự.","ok":true},{"t":"Bài học của thời kì Chiến tranh lạnh cho tất cả các quốc gia là không nên tập trung vào phát triển quân sự, quốc phòng đất nước.","ok":false},{"t":"Các nước như Đức, Nhật và NICs là minh chứng cho việc phát triển dựa trên hợp tác và cạnh tranh kinh tế - chính trị thay vì đối đầu quân sự.","ok":true},{"t":"Thực lực kinh tế và khoa học - kỹ thuật sau Chiến tranh lạnh đóng vai trò quyết định sự phát triển sức mạnh tổng hợp của một quốc gia.","ok":true}],"id":"b3-93"},{"lesson":3,"part":2,"num":94,"stem":"Đọc đoạn tư liệu sau: “Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị – quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô – Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế -chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học – kĩ thuật\" (Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, Hà Nội, 2001, tr.401)","stmts":[{"t":"Một trong những bài học rút ra từ thời kì chiến tranh lạnh cho tất cả các quốc gia là không nên tập trung vào phát triển quân sự, quốc phòng đất nước.","ok":false},{"t":"Trong và sau thời kì chiến tranh lạnh, nội dung của quan hệ quốc tế có sự điều chỉnh từ chỗ lấy yếu tố quân sự sang lấy yếu tố kinh tế là trọng tâm.","ok":true},{"t":"Sau thời kì chiến tranh lạnh, Xô - Mỹ lấy đối đầu về chính trị - quân sự là chủ yếu, trong khi đó Đức và Nhật Bản lại lấy hợp tác và cạnh tranh về kinh tế - chính trị là chủ yếu.","ok":false},{"t":"Kinh tế và khoa học – kĩ thuật là hai yếu tố chủ yếu tạo nên sức mạnh tổng hợp của một quốc gia sau khi cuộc Chiến tranh lạnh chấm dứt.","ok":true}],"id":"b3-94"},{"lesson":3,"part":2,"num":95,"stem":"Đọc đoạn tư liệu sau đây: “Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô – Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế -chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học – kĩ thuật\". (Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia Hà Nội, Hà Nội, 2001, tr.401).","stmts":[{"t":"Hợp tác và cạnh tranh trong lĩnh vực kinh tế - chính trị là con đường mang lại hiệu quả cao hơn cho sự phát triển của các quốc gia.","ok":true},{"t":"Trong bối cảnh toàn cầu hóa hiện nay, bài học từ Chiến tranh lạnh cho thấy quốc gia nào càng tập trung vào quân sự thì càng dễ có vị thế cao trên trường quốc tế.","ok":false},{"t":"Đoạn tư liệu cho rằng phương thức đối đầu chính trị - quân sự là chủ yếu đã mang lại nhiều thành tựu cho các nước như Mỹ và Liên Xô trong thời kì Chiến tranh lạnh.","ok":false},{"t":"Thực lực kinh tế và khoa học – kĩ thuật có vai trò quan trọng đối với sự phát triển và hưng thịnh của một quốc gia sau khi Chiến tranh lạnh kết thúc.","ok":true}],"id":"b3-95"},{"lesson":3,"part":2,"num":96,"stem":"Đọc đoạn tư liệu sau đây: “Toàn cầu hoá mà trước hết và thực chất là toàn cầu hoá kinh tế đang trở thành một đặc trưng chủ yếu của sự phát triển thế giới. Xu thế toàn cầu hoá là xu thế khách quan, tất yếu, không thể đảo ngược được. Toàn cầu hoá mang lại nhiều cơ hội nhưng cũng hàm chứa không ít thách thức to lớn đối với các quốc gia, đặc biệt là các nước đang phát triển\". (Trần Thị Vinh (Chủ biên), Lê Văn Anh, Lịch sử thế giới hiện đại, quyển 2, NXB Đại học Sư phạm, Hà Nội, 2016, tr.98)","stmts":[{"t":"Một trong những thách thức to lớn của xu thế toàn cầu hóa đối với các quốc gia, đặc biệt là các nước đang phát triển là làm trầm trọng thêm bất công xã hội.","ok":true},{"t":"Đoạn thông tin đề cập đến một trong những xu thế phát triển chính của thế giới sau Chiến tranh lạnh là xu thế toàn cầu hóa.","ok":true},{"t":"Toàn cầu hoá là một xu thế khách quan, một thực tế không thể đảo ngược vì đó là hệ quả của việc mở rộng quan hệ thương mại giữa các cường quốc.","ok":false},{"t":"Xu thế toàn cầu hóa đưa đến sự phát triển nhanh của lực lượng sản xuất đòi hỏi các quốc gia phải tăng cường quan hệ hợp tác quốc tế.","ok":true}],"id":"b3-96"},{"lesson":3,"part":2,"num":97,"stem":"Đọc đoạn tư liệu sau đây: “Một thời kì mới trong quan hệ quốc tế đã bắt đầu, trong đó tất cả các quốc gia dân tộc đều đang đứng trước những thách thức, những thời cơ để đưa vận mệnh đất nước mình tiến lên kịp với thời đại mới. Sự nghiệp bảo vệ hòa bình - mối quan tâm hàng đầu của toàn nhân loại, đang ngày càng tiến triển, mặc dù nguy cơ chiến tranh chưa phải là chấm dứt, ...\". (Nguyễn Thái Anh (Chủ biên). (2021). Lịch sử thế giới hiện đại. Nhà xuất bản Giáo dục Việt Nam, tr. 425)","stmts":[{"t":"Việc bảo vệ hòa bình thế giới là mối quan tâm hàng đầu của toàn nhân loại sau Chiến tranh lạnh.","ok":true},{"t":"Việc các nước điều chỉnh chiến lược phát triển, lấy quân sự làm trọng tâm sau Chiến tranh lạnh để xác lập vị thế trong trật tự thế giới mới đã góp phần duy trì môi trường hòa bình, ổn định.","ok":false},{"t":"Sau Chiến tranh lạnh, xung đột sắc tộc và tôn giáo chỉ còn diễn ra ở khu vực Trung Đông chủ yếu vì hòa bình, an ninh thế giới đã được đảm bảo.","ok":false},{"t":"Theo đoạn tư liệu trên, “một thời kì mới trong quan hệ quốc tế đã bắt đầu” sau Chiến tranh lạnh là thời kì đối đầu giữa hai hệ thống chính trị - xã hội đối lập.","ok":false}],"id":"b3-97"},{"lesson":3,"part":2,"num":98,"stem":"Đọc đoạn tư liệu sau đây: “Sự chấm dứt Chiến tranh lạnh và sự sụp đổ của hệ thống xã hội chủ nghĩa (XHCN) thế giới đã kết thúc thời kì thế giới hai cực, chấm dứt sự đối đầu của hai hệ thống chính trị, kinh tế, xã hội, mở ra một thời kì hội nhập kinh tế toàn cầu thực sự với sự chuyển đổi của hầu hết các quốc gia từng là XHCN, các quốc gia đang phát triển sang kinh tế thị trường, mở cửa hội nhập kinh tế quốc tế, xu thế hòa bình, hợp tác phát triển đã trở thành xu thế chính của thời đại. Đây là đặc trưng cực kỳ quan trọng”. (Đinh Công Tuấn. (2007). Những thay đổi của thế giới sau Chiến tranh lạnh (1991) và tác động của nó đến việc giảng dạy bộ môn Lịch sử bậc đại học hiện nay. Tạp chí Nghiên cứu Lịch sử, (12), 61.)","stmts":[{"t":"Hòa bình, ổn định, hợp tác phát triển, mở cửa hội nhập kinh tế quốc tế là ngọn cờ chủ yếu để các nước lớn tập hợp lực lượng sau khi Chiến tranh lạnh kết thúc.","ok":false},{"t":"Đặc trưng quan trọng nhất của trật tự thế giới sau Chiến tranh lạnh phù hợp với nguyện vọng kiến tạo một môi trường hòa bình của nhân loại tiến bộ trên thế giới.","ok":true},{"t":"Để chấm dứt sự cạnh tranh trên thế giới, các quốc gia chú trọng hợp tác, phát triển, mở cửa hội nhập kinh tế quốc tế sau khi Chiến tranh lạnh kết thúc hoàn toàn.","ok":false},{"t":"Xu thế chính của thời đại sau khi Chiến tranh lạnh chấm dứt được đoạn tư liệu đề cập là hòa bình, ổn định, hợp tác phát triển, mở cửa hội nhập kinh tế quốc tế.","ok":true}],"id":"b3-98"},{"lesson":3,"part":2,"num":99,"stem":"Đọc đoạn tư liệu sau đây: “Sau khi Chiến tranh lạnh kết thúc, so sánh lực lượng trên bình diện toàn cầu từ chỗ cân bằng giữa hai hệ thống chính trị – xã hội đối lập nay chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mĩ và phương Tây. Tuy nhiên, tình hình quốc tế đã không phát triển một cách hòa bình, ổn định như người ta mong đợi. Sự đối đầu Đông – Tây về hệ tư tưởng, chính trị, quân sự, kinh tế [...] đã từng chi phối đời sống quốc tế trong suốt thời kỳ Chiến tranh lạnh, nay được chuyển hóa dưới những hình thức khác, bên cạnh sự nổi lên của những mâu thuẫn mới. Sự vận động của các mâu thuẫn này sẽ quyết định diện mạo của trật tự thế giới và xu hướng phát triển của quan hệ quốc tế sau Chiến tranh lạnh.\" (Trần Thị Vinh (Chủ biên). (2008). Lịch sử thế giới hiện đại (Quyển 2). Nhà xuất bản Đại học Sư phạm, tr. 102-103)","stmts":[{"t":"Mâu thuẫn về lợi ích quốc gia và dân tộc là một trong những yếu tố quan trọng, tác động đến việc hình thành trật tự thế giới mới sau Chiến tranh lạnh.","ok":true},{"t":"Sự vận động của các mâu thuẫn sau Chiến tranh lạnh đã làm cho môi trường an ninh quốc tế vô cùng căng thẳng, bùng nổ các cuộc chiến tranh thế giới.","ok":false},{"t":"Sự hình thành của trật tự thế giới mới sau Chiến tranh lạnh vô cùng phức tạp và chậm chạp chủ yếu vì sự đối đầu giữa hai hệ thống chính trị - xã hội đối lập.","ok":false},{"t":"Đoạn tư liệu trên thể hiện sự vận động và phát triển của tình hình thế giới sau Chiến tranh lạnh.","ok":true}],"id":"b3-99"},{"lesson":3,"part":2,"num":100,"stem":"Đọc đoạn tư liệu sau đây: “Thế giới phát triển nhanh chóng theo hướng đa cực, tuy vậy cục diện đa cực chưa hẳn đã hình thành mà đang trải qua thời kỳ quá độ từ trật tự cũ để tiến tới một trật tự mới. Có người dự đoán thời kỳ quá độ này phải kéo dài trong nhiều năm, có thể từ 30 đến 50 năm, bởi sự chuyển đổi cục diện thế giới lần này mang đặc điểm mới, quan trọng nhất là không trải qua chiến tranh như các cục diện trước kia. Thế giới đang trong tình hình \"một siêu cường, nhiều cường quốc\", đó là các nước Mỹ, Tây Âu (EU), Nhật Bản, Nga và Trung Quốc”. (Vũ Dương Ninh. (2002). Một số chuyên đề Lịch sử thế giới. Nxb Đại học Quốc gia Hà Nội, tr. 399)","stmts":[{"t":"Đoạn tư liệu trên thể hiện cục diện chính trị thế giới sau khi Chiến tranh lạnh chấm dứt.","ok":true},{"t":"Để tạo nên sự cân bằng quyền lực giữa các trung tâm quyền lực sau Chiến tranh lạnh, hầu hết các nước trên thế giới đều ủng hộ cục diện “một siêu cường, nhiều cường quốc”.","ok":false},{"t":"Cục diện \"một siêu cường, nhiều cường quốc\" là biểu hiện cụ thể và là giai đoạn quá độ của xu hướng đa cực sau khi Chiến tranh lạnh chấm dứt.","ok":true},{"t":"Cục diện chính trị thế giới sau khi Chiến tranh lạnh chấm dứt đã cho thấy trật tự thế giới đa cực đã được xác lập trên thế giới thay thế cho trật tự đơn cực.","ok":false}],"id":"b3-100"},{"lesson":3,"part":2,"num":101,"stem":"Đọc đoạn tư liệu sau đây: \"Cuộc Chiến tranh lạnh kéo dài trên 40 năm đã chấm dứt và trong quan hệ quốc tế, từ xu thế \"đối đầu\" đã dần dần chuyển sang xu thế \"đối thoại\" hợp tác trên cơ sở hai bên cùng có lợi, tôn trọng lẫn nhau trong cùng tồn tại hỏa bình, tình hình thế giới trở nên hòa dịu hơn, tuy thế vẫn bùng nổ những tranh chấp, xung đột mang tính chất khu vực\". (Nguyễn Anh Thái (Chủ biên). (2015). Lịch sử thế giới hiện đại. Nhà xuất bản Giáo dục, tr. 537.)","stmts":[{"t":"Cuộc Chiến tranh lạnh kéo dài trên 40 năm kết thúc đã làm cho tình hình thế giới trở nên hòa dịu hơn, mở ra cơ hội hợp tác cho các quốc gia có chế độ chính trị - xã hội khác biệt.","ok":true},{"t":"Đoạn tư liệu trên đề cập đến quan hệ của hai siêu cường đứng đầu thế giới sau Chiến tranh lạnh.","ok":false},{"t":"Sau khi Chiến tranh lạnh chấm dứt, quan hệ quốc tế chuyển từ xu thế \"đối đầu\" sang xu thế \"đối thoại\" chủ yếu vì không còn mâu thuẫn ý thức hệ giữa các quốc gia với nhau.","ok":false},{"t":"Việc “hợp tác trên cơ sở hai bên cùng có lợi, tôn trọng lẫn nhau trong cùng tồn tại hòa bình” là động lực thúc đẩy các mối quan hệ giữa các quốc gia với nhau sau Chiến tranh lạnh.","ok":true}],"id":"b3-101"},{"lesson":3,"part":2,"num":102,"stem":"Đọc đoạn tư liệu sau đây: “Thời kì từ nửa sau những năm 70 đến 1991: thời kì từng bước sụp đổ rồi sụp đổ hoàn toàn của trật tự thế giới theo “thể chế hai cực lanta”, chủ nghĩa xã hội dần dần lâm vào cuộc khủng hoảng toàn diện, trầm trọng dẫn tới sự sụp đổ của chế độ xã hội chủ nghĩa ở Đông Âu và Liên Xô, một số nước thuộc thế giới thứ ba cũng lâm vào khủng hoảng kinh tế và chính trị, cuộc cách mạng khoa học – kĩ thuật phát triển sang giai đoạn mới với nội dung cách mạng khoa học công nghệ, trong đó công nghệ được nâng lên vị trí hàng đầu, và một trật tự thế giới mới đang dần dần hình thành”. dục, tr. 536-537.) (Nguyễn Anh Thái (Chủ biên). (2003). Lịch sử thế giới hiện đại. Nhà xuất bản Giáo dục, tr. 536-537.)","stmts":[{"t":"Ngay sau Chiến tranh lạnh, “một trật tự thế giới mới đang dần dần” được hình thành chủ yếu vì Mĩ không còn duy trì được vị trí siêu cường trong quan hệ quốc tế.","ok":false},{"t":"“Một trật tự thế giới mới đang dần dần hình thành” được đề cập đến trong đoạn tư liệu trên là trật tự đa cực – một trật tự có sự chi phối của nhiều trung tâm quyền lực.","ok":false},{"t":"Đoạn tư liệu trên đề cập đến các xu thế lớn sau khi Chiến tranh lạnh kết thúc hoàn toàn.","ok":false},{"t":"Sự sụp đổ của chủ nghĩa xã hội ở Đông Âu và Liên Xô làm cho chủ nghĩa xã hội không còn tồn tại với tư cách là hệ thống trên thế giới.","ok":true}],"id":"b3-102"},{"lesson":3,"part":2,"num":103,"stem":"Đọc đoạn tư liệu sau đây: “Giai đoạn hiện nay, sau khi chế độ xã hội chủ nghĩa ở Liên Xô và Đông Âu sụp đổ, Chiến tranh lạnh kết thúc. Chủ nghĩa xã hội thế giới, Phong trào Cộng sản và Công nhân quốc tế tạm thời lâm vào tình trạng thoái trào. Cục diện chính trị thế giới thay đổi bất lợi cho phong trào cách mạng và tiến bộ. Trật tự thế giới hai cực Xô - Mỹ tan vỡ. Chủ nghĩa tư bản do lợi dụng được những thành tựu của cách mạng khoa học công nghệ, cùng với những biện pháp điều chỉnh hợp lý về kinh tế, xã hội tạo ra bước phát triển mới về kinh tế, khoa học – công nghệ. Mặc dù chủ nghĩa tư bản còn tồn tại những mâu thuẫn không thể điều hòa được, song chủ nghĩa tư bản đang chiếm ưu thế về vốn, kỹ thuật - công nghiệp và thị trường. Đặc biệt, gần đây chủ nghĩa tư bản, chủ nghĩa đế quốc đứng đầu là Mỹ thực hiện âm mưu bá chủ thế giới, nhằm thiết lập trật tự thế giới do Mỹ lãnh đạo. Chính sách cường quyền, bá chủ của Mỹ và đồng mình đã và đang đe dọa tới nền hòa bình, an ninh chung của mỗi quốc gia dân tộc”. (Phạm Thành Dung, Nguyễn Thị Thúy Hà, Phạm Thanh Hà. (2014). Một số vấn đề quan hệ quốc tế và đường lối đối ngoại của Đảng, Nhà nước Việt Nam. Nxb Lý luận chính trị, trang 29-30).","stmts":[{"t":"Sự sụp đổ của Liên Xô và các nước xã hội chủ nghĩa ở Đông Âu là một tổn thất to lớn đối với phong trào cách mạng vì đã cho thấy sự ủng hộ của các lực lượng tiến bộ đối với phong trào này không còn.","ok":false},{"t":"Theo đoạn tư liệu trên, sự sụp đổ của Liên Xô và các nước xã hội chủ nghĩa Đông Âu đã đánh dấu sự cáo chung của chủ nghĩa xã hội trên phạm vi toàn thế giới.","ok":false},{"t":"Việc chính sách bá quyền, bá chủ của Mỹ và đồng minh đã và đang đe dọa hòa bình, an ninh của các quốc gia dân tộc chứng tỏ các nước lớn vẫn có tham vọng chi phối trật tự thế giới.","ok":true},{"t":"Để tận dụng được thành tựu khoa học - công nghệ và điều chỉnh hợp lý về kinh tế, xã hội, các nước tư bản chủ nghĩa giải quyết triệt để các mâu thuẫn vẫn đang tồn tại trong lòng xã hội.","ok":false}],"id":"b3-103"},{"lesson":3,"part":2,"num":104,"stem":"Cho bảng thông tin sau đây:","stmts":[{"t":"Sau Chiến tranh lạnh, Mĩ vẫn là cường quốc số một trên thế giới chủ yếu vì có tiềm lực kinh tế, quân sự, khoa học to lớn và không bị các nước khác cạnh tranh.","ok":false},{"t":"Sự vươn lên của các trung tâm quyền lực mới nổi sau khi Chiến tranh lạnh kết thúc đã có tác động mạnh mẽ tới vị thế, vai trò của Mỹ trong quan hệ quốc tế.","ok":true},{"t":"Đoạn tư liệu trên đề cập đến quá trình hình thành trật tự thế giới mới sau Chiến tranh lạnh.","ok":true},{"t":"Sự ra đời và hoạt động của các trung tâm kinh tế tài chính là một trong những nhân tố thúc đẩy sự hình thành trật tự thế giới mới sau Chiến tranh lạnh.","ok":true}],"table":[["Quốc gia và trung tâm","Biểu hiện"],["Mỹ","Vẫn là cường quốc số một thế giới. Với sức mạnh về kinh tế, quân sự, khoa học - kĩ thuật, Mỹ có ảnh hưởng lớn nhất đến quan hệ quốc tế"],["Trung Quốc","Vươn lên mạnh mẽ, vượt Nhật Bản (năm 2010) để trở thành nền kinh tế lớn thứ hai thế giới (sau Mỹ), sức mạnh quân sự không ngừng được tăng cường."],["EU","Ngày càng trở thành tổ chức liên kết khu vực chặt chẽ trên nhiều lĩnh vực, có ảnh hưởng trên phạm vi toàn cầu về kinh tế, thương mại."],["Nhật Bản","Tiếp tục duy trì địa vị cường quốc kinh tế, từng bước tăng cường sức mạnh về chính trị, ngày càng có ảnh hưởng trên trường quốc tế."],["Nga","Phục hồi mạnh mẽ, là một trong những cường quốc hàng đầu về quân sự khoa học - kĩ thuật."],["Ấn Độ","Trở thành cường quốc kinh tế, quân sự khoa học - kĩ thuật có ảnh hưởng lớn trong quan hệ quốc tế."]],"id":"b3-104"},{"lesson":3,"part":2,"num":105,"stem":"Đọc đoạn tư liệu sau đây: \"Sau khi Chiến tranh lạnh kết thúc, so sánh lực lượng trên bình diện toàn cầu từ chỗ cân bằng giữa hai hệ thống chính trị – xã hội đối lập nay chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mĩ và phương Tây. Tuy nhiên, tình hình quốc tế đã không phát triển một cách hòa bình, ổn định như người ta mong đợi. Sự đối đầu Đông – Tây về hệ tư tưởng, chính trị, quân sự, kinh tế [...] đã từng chi phối đời sống quốc tế trong suốt thời kỳ Chiến tranh lạnh, nay được chuyển hóa dưới những hình thức khác, bên cạnh sự nổi lên của những mâu thuẫn mới. Sự vận động của các mâu thuẫn này sẽ quyết định diện mạo của trật tự thế giới và xu hướng phát triển của quan hệ quốc tế sau Chiến tranh lạnh.” (Trần Thị Vinh (Chủ biên), Lịch sử thế giới hiện đại, Quyển 2, NXB Đại học sư phạm, Hà Nội, 2008, tr.102-103).","stmts":[{"t":"Tình hình quốc tế sau Chiến tranh lạnh không phát triển hòa bình và ổn định như mong đợi chứng tỏ cuộc đấu tranh về hệ tư tưởng giữa các nước không còn nhưng sự cạnh tranh về ảnh hưởng vẫn tiếp tục.","ok":false},{"t":"So sánh lực lượng trên thế giới sau Chiến tranh lạnh chuyển sang trạng thái mất cân bằng theo hướng có lợi cho Mỹ và phương Tây vì các quốc gia mới độc lập chưa đủ sức cạnh tranh với Mĩ và phương Tây.","ok":false},{"t":"Để giải quyết triệt để các vấn đề dân tộc và giai cấp sau Chiến
