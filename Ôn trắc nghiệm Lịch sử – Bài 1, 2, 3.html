tranh lạnh, các quốc gia trên thế giới chủ trương tập trung xây môi trường hòa bình, ổn định và cùng hợp tác phát triển.","ok":false},{"t":"Đoạn tư liệu trên đề cập đến tình hình thế giới và quan hệ quốc tế sau khi Chiến tranh lạnh kết thúc.","ok":true}],"id":"b3-105"},{"lesson":3,"part":2,"num":106,"stem":"Đọc đoạn tư liệu sau: “Trong thời kì hậu Chiến tranh lạnh, thế giới đang chứng kiến sự thay đổi về địa vị chiến lược của các cường quốc, sự sắp xếp lại vị trí và vai trò của mỗi chủ thể quốc tế, kéo theo những biến chuyển lớn trong cục diện quan hệ quốc tế. Các quốc gia, các tổ chức và lực lượng chính trị quốc tế thực hiện điều chỉnh chiến lược đối nội, đối ngoại và phương thức hành động cho phù hợp với yêu cầu nhiệm vụ bên trong và đặc điểm của thế giới. Trên phạm vi thế giới, những cuộc chiến tranh cục bộ, xung đột, tranh chấp vẫn còn, nhưng xu thế chung của thế giới là hoà bình và hợp tác phát triển. Xu thế chạy đua phát triển kinh tế khiến các nước, nhất là những nước đang phát triển, đã đổi mới tư duy đối ngoại, thực hiện chính sách đa phương hoá, đa dạng hoá quan hệ quốc tế; mở rộng và tăng cường liên kết, hợp tác với các nước phát triển để tranh thủ vốn, kĩ thuật, công nghệ, mở rộng thị trường, học tập kinh nghiệm tổ chức, quản lí sản xuất kinh doanh. Các nước đổi mới tư duy về quan niệm sức mạnh, vị thế quốc gia. Thay thế cách đánh giá cũ, chủ yếu dựa vào thế mạnh quân sự bằng các tiêu chí tổng hợp, trong đó sức mạnh kinh tế được đặt ở vị trí quan trọng hàng đầu.”. (Hoàng Hải Hà, Nguyễn Thị Mỹ Hạnh (đồng chủ biên). (2024). Giáo trình Lịch sử Ngoại giao Việt Nam. Nxb Đại học Sư phạm, trang 278).","stmts":[{"t":"Để tránh bị các tổ chức quốc tế kiểm soát, các nước đang phát triển đã mở rộng và tăng cường liên kết, hợp tác với các nước phát triển trong thời kì hậu Chiến tranh lạnh.","ok":false},{"t":"Theo đoạn tư liệu trên, xu thế chung của thế giới sau Chiến tranh lạnh là đối thoại và thỏa hiệp.","ok":false},{"t":"Các cường quốc phải điều chỉnh chiến lược phát triển trong thời kỳ hậu Chiến tranh lạnh vì các nước này đều không muốn quay trở lại trạng thái đối đầu chính trị - quân sự.","ok":false},{"t":"Việc các quốc gia đổi mới tư duy đối ngoại trong bối cảnh hậu Chiến tranh lạnh chứng tỏ các nước này đều muốn từ bỏ quan hệ quốc tế truyền thống, đề cao việc thích ứng với tình hình mới.","ok":false}],"id":"b3-106"}]</script>
<script>
const Q=JSON.parse(document.getElementById('d').textContent),$=id=>document.getElementById(id);
const TABS=[['1','Bài 1'],['2','Bài 2'],['3','Bài 3'],['all','Cả 3 bài']],PARTS=[['0','Tất cả'],['1','Nhiều lựa chọn'],['2','Đúng/Sai']];
const NAME={1:'Bài 1 · Liên hợp quốc',2:'Bài 2 · Trật tự thế giới trong Chiến tranh lạnh',3:'Bài 3 · Trật tự thế giới sau Chiến tranh lạnh'};
let set='1',part='0',list=[],order=[],idx=0,shuffled=false;const A={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function status(q){const a=A[q.id];if(q.part==1)return a==null?'':a===q.ans?'ok':'no';
 if(!a)return'';const n=a.filter(v=>v!=null).length;if(!n)return'';if(n<q.stmts.length)return'part';return a.every((v,i)=>v===q.stmts[i].ok)?'ok':'no'}
function build(){list=Q.filter(q=>(set==='all'||q.lesson==set)&&(part==='0'||q.part==part));order=list.map((_,i)=>i);shuffled=false;idx=0;render()}
function head(){$('tabs').innerHTML=TABS.map(([k,t])=>`<button class="tab ${k===set?'on':''}" data-set="${k}">${t}</button>`).join('');
 $('parts').innerHTML=PARTS.map(([k,t])=>`<button class="seg ${k===part?'on':''}" data-part="${k}">${t}</button>`).join('')}
function render(){head();const tot=list.length;let done=0,ok=0;
 order.forEach(i=>{const s=status(list[i]);if(s==='ok'||s==='no')done++;if(s==='ok')ok++});
 $('s1').textContent=`Đã làm ${done}/${tot} · Đúng ${ok}`+(done?` (${Math.round(ok/done*100)}%)`:'');
 $('s2').textContent=shuffled?'Đang xáo thứ tự':'Thứ tự gốc';$('pb').style.width=(tot?done/tot*100:0)+'%';
 $('nav').innerHTML=order.map((li,p)=>`<button class="n ${status(list[li])} ${p===idx?'cur':''}" data-go="${p}" title="${NAME[list[li].lesson]} · Câu ${list[li].num}">${p+1}</button>`).join('');
 const q=list[order[idx]];if(!q){$('qa').innerHTML='<div class="card">Không có câu hỏi.</div>';return}
 const a=A[q.id];let h=`<div class="card"><div class="tag">${NAME[q.lesson]} · Câu ${q.num} · ${q.part==1?'Nhiều lựa chọn':'Đúng/Sai'} · ${idx+1}/${tot}</div><p class="q">${esc(q.stem)}</p>`;
 (q.imgs||[]).forEach(s=>h+=`<img src="${s}" alt="Bảng thông tin">`);
 if(q.table)h+='<div class="tbl"><table>'+q.table.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')+'</tr>').join('')+'</table></div>';
 if(q.part==1)q.opts.forEach((o,i)=>{const c=a==null?'':i===q.ans?'ok':i===a?'no':'';h+=`<button class="o ${c}" data-o="${i}" ${a==null?'':'disabled'}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`});
 else q.stmts.forEach((s,i)=>{const v=a&&a[i];const d=v!=null;
  const bt=(val,t)=>`<button class="${d&&s.ok===val?'ok':d&&v===val?'no':''}" data-s="${i}" data-v="${val?1:0}" ${d?'disabled':''}>${t}</button>`;
  h+=`<div class="st"><p><b>${'abcd'[i]})</b> ${esc(s.t)}${d?`<span class="fb ${v===s.ok?'ok':'no'}"><br>${v===s.ok?'✓ Chính xác':'✗ Sai – đáp án: '+(s.ok?'Đúng':'Sai')}</span>`:''}</p><div class="yn">${bt(true,'Đúng')}${bt(false,'Sai')}</div></div>`});
 $('qa').innerHTML=h+'</div>';$('prev').disabled=idx<=0;$('next').disabled=idx>=tot-1}
function go(p){if(p>=0&&p<list.length){idx=p;render();window.scrollTo({top:0})}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
 if(D.set){set=D.set;build()}else if(D.part){part=D.part;build()}else if(D.go)go(+D.go);
 else if(D.o!=null){const q=list[order[idx]];if(A[q.id]==null){A[q.id]=+D.o;render()}}
 else if(D.s!=null){const q=list[order[idx]],a=A[q.id]=A[q.id]||[];a[+D.s]=D.v==='1';render()}});
$('shuf').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}shuffled=true;idx=0;render()};
$('orig').onclick=()=>{order=list.map((_,i)=>i);shuffled=false;idx=0;render()};
$('reset').onclick=()=>{if(confirm('Xóa toàn bộ kết quả của bộ câu hỏi đang chọn?')){list.forEach(q=>delete A[q.id]);idx=0;render()}};
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const q=list[order[idx]];
 if(e.key==='ArrowLeft')go(idx-1);else if(e.key==='ArrowRight')go(idx+1);
 else if(q&&q.part==1&&A[q.id]==null){const i='abcd'.indexOf(e.key.toLowerCase());const j='1234'.indexOf(e.key);const k=i>=0?i:j;if(k>=0){A[q.id]=k;render()}}});
build();
</script></body></html>
